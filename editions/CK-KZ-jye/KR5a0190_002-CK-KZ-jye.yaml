front:
  text: 元始上帝再吿左右侍眞曰吾今以此經懺散布萬國九洲十方世界若有奉道之民發無上道意遇三元八節之日爲國王
  hash: sha256:6b440d66df15a425758a9b9087bbbfe9f8f92271cd59d4831d96b77202dd7619
body:
  text: 主儲君太子燒香朝禮轉念三淸寶號天尊眞人名位者安鎭國祚保天長存世世不絶長爲人君冲妙先生朝拜禮謝金闕上帝而獻頌曰上帝降命聖算延長金枝挺秀玉葉弭芳五星順遂七曜垂芒赫赫煌煌空洞靈章福我聖王寶祚無疆天淸地靈萬字輝光太上靈寶朝天謝罪法懺卷一終爾時元始上帝於赤明刼初在玉淸大羅天上南丹開陽之舘火鍊宮中大會羣仙四方天地無量天人玉童玉女持旛持節燒香散花吟咏洞章旋繞天臺龍燭鳳燈羅列照耀至尊聖德巍巍嘆未存見是時元始上帝以大威力布大祥光普照十方無量國土皆同一相表裏開通亦如流璃淸雲無礙十方大聖一切侍眞隨至尊祥光下見十方萬國九洲山河大地人民苦樂地獄天堂罪福果報如在目前是時諸天神王三府靈官列班朝禮進呈天下國土人民罪福之籍一一分明併無差忒是時有玉淸眞人金華眞人與會中一切神仙燒香跼蹐朝拜至尊今日沗預法筵面禮慈尊親聽法音開導塵迷咸使悟道實爲夙慶元始上帝吿左右侍眞曰吾常在玉淸天中下觀一切兆民積善崇福者皆有福報見有廣造經像立觀度人佈施齋戒濟生度死普救一切者生國王帝主身供養三寶燒香然燈誦經禮懺廣造福田救災拔難者生皇后國母身信樂經法持齋念道佈施貧乏者生富貴聰明身常行慈悲濟生度死崇奉三寶燒香不怠者生淸淨出家身信奉修行供養星辰者生長命淸淨端正身成就宮觀建立靈壇者生富貴聰明身佈施救貧成就功德無所悋惜者生天人中身不殺不盗不嫉不害者生長命具足身供養三寶怜念一切慈悲於物者生高上豪貴身子孫昌盛長命富貴者從供養天尊大道星辰中來夫妻和睦男女柔順者從不隔恩愛中來在處得人敬養甘膳美衣者從敬奉天地信禮三寶中來見世尊勝豪貴見人畏懼者從敬信三寶中來出家法身爲人敬信者從說法教化中來富貴巍巍永刼不衰者從佈施成就功德中來身心淸淨智慧明了者從護持經法中來所居快樂無諸災厄者從放生救物不害眾生中來子孫豐足富貴長夀者從廣行佈施求福中來女人降生貴子夫婦常敬愛者從道場教化信心中來形容端正笑語柔和眾人恭敬者從三寶持奉經戒中來已身福報皆夙世祖禰陰德種植致得今身之報或一身積善致使宿命善因得福無量元始上帝再謂左右神仙曰吾見毁壤天尊星辰大道形像者死入九幽地獄酆都拷罰萬刼方生病癩百虫啖噬穢身訾毁三洞經籙法典改換品秩者死入地獄拷罰百刼方生野獸舌根爛壞身誹謗出家法身者見世蟲癩過去生六畜身破壞宮觀靈壇毁拆眞舘者見世眉髪墮落身體爛壞過去生毒蛇餓虎身不敬天尊大道星辰者見世愚癡憨𤶗過去生六畜鳥獸身不信經法宿命報對者見世爲奴婢過去生蠻夷虜狄身輕慢出家法師穢污三寶福地者見世跛躄過去生猪狗身淫犯出家凌辱法師者見世形容腥臭過去生糞穢厠圂毒蟲身邪淫好色不別尊卑者見世風邪過去生六畜猪羊牛馬身偷盗常住財物及信施衣帛者見世顚狂過去生愚癡身偷盗三寶花菓蔬菜齋食者見世得饑渴餓病過去生饑虎毒蛇身偷盗齋供醮獻法食者見世逢霹𩆝虎害過去生蠎蛇毒蟲又生餓狗毒猲身罵詈出家法身惡言凌辱者見世得風癇惡疾過去生狂狗猛獸身破齋犯戒者見世遭逢牢獄過去生蠅蛆螻蟻身殺害眾生恣心宰殺者見世得短命疾病牢獄拷决身食肉貪殺六畜者見世百病困苦過去生麋鹿野獸身嗜酒過度好食葷辛臭穢者見世風狂猛火焚燒過去生猿猴身死入地獄鑊湯中又見一切眾生見世手腳斷壞拳縮跛足者從不敬三寶星辰中來兩眼雙盲舌根爛壞者從毁訾經教輕怱三寶中來瘖瘂不能言語鼻塞不聞香臭者從誑說出家不信經法中來眉毛墮落唇㩟舌露鼻梁崩裂者從破壞道場誹謗三寶中來顚狂迷妄形容醜陋者從嗊嗃傲慢非咲出家法身中來刼賊相逢傷害財物者從刼奪三寶常住財物中來水溺漂沉魚龍傷害者從損壞三寶常住中來火焚灼爛毒蛇吞噬者從殺害出家毁拆觀舍中來毒蛇入口吐血臭穢者從惡口咒咀呌唤鬼神中來毒蛇入孔竅食啖虎狼猛獸傷害者從陰謀毒害欺心中來父母妻子離隔常不同居晝夜相罵者從嫉姤姦淫破人和合離人骨肉中來媅淫不避親疎好醜者從猪狗六畜中來嗜肉好殺嗜酒猖狂者從魚鼈蝦蟆毒虫猛獸中來身體穢污不淨臭穢者從蝌蚪毒獸中來生牛馬六畜者從殺害眾生負諱抵債中來野獸麞鹿蝮蠍蠎蛇者從嫉妬毒害陰謀中來餓虎豺狼者從欺凌刼奪殺傷中來厠溷穢蟲蝦蟆蝌蚪螻蟻者從輕褻三寶不生敬信中來猘犬野猪魚鼈怪蟲者從背師弃本違法經教中來燕雀鳩鴿者從評論經法自作口業中來鷹鸇鷙鳥者從犯觸出家破壞經教中來墮子落胎腹大項細者從非㗛三寶傲誕出家中來牢獄枷鎖拷掠切身者從䧟毒阿黨殘虐負下中來鞭笞楚打枷鎖牢獄者從毒害貪虐中來猫犬野犴豺狼狐貉者從貪悋虐誕矯詐中來鼠鼬蜈蚣蚰蜒生身者從陰毒妬害中來蜂蠆蠍毒蝘蜓𧋍蜴者從咒咀出家欺怱三寶中來蜘蛛蛐蟮蚊蝱蚤蝨者從慢法輕道㗛謗經籍中來邊夷下賤秃頭斷髮眼深鼻長身體腥穢者從殺生邪淫不信因緣中來元始上帝吿左右侍眞曰以上罪業死經地獄受諸拷罰厯刼方生受得此身亦有見世業報生身所犯罪福因緣一一明示各須澄心懺悔獲福無量元始上帝再告左右侍眞曰下界若有奉道信心男女發無上誠心爲皇貴妃七廟宗厯建三淸寶座五帝星壇掛旛獻花百珍異菓然香點燈大醮星辰拔贖魂儀者吾遣太乙救苦天尊開朱陵之闕丹簡紫籙出天尊懿號讚嘆稱揚吟咏洞章解釋九幽滯魄宿業罷散五道開通逍遙無爲超生福果一切罪犯併得消除是故燒香皈身皈命五體投地志心朝禮玉淸聖境虛無自然元始天尊上淸眞境太上道君靈寶天尊太淸仙境太上老君降生天尊太上昊天至尊金闕玉皇上帝上靈高道聖祖司命保生天尊南極聖主紫微上宮天皇大帝中天星主紫微中宮北極大帝承天效法厚德光太后土皇地祗應感儲祥元天大慈聖后元君南極長生大帝統天元聖天尊東極靑宮大帝太乙救苦天尊眞明大聖九天應元雷聲普化天尊九天雷祖大帝除災濟物天尊紫微碧玉宮太乙天帝保制刼運天尊六天洞淵大帝伏魔上上太乙天尊六波天主帝君普施法潤天尊九天可韓司丈人朱陵度命天尊九天採訪使應元保運妙化天尊東方九炁天中靑靈始老洞空天尊南方三炁天中丹靈眞老洞淸天尊西方七炁天中皓靈皇老洞虛天尊北方五炁天中五靈玄老洞微天尊中央一炁天中玄靈元老洞眞天尊南方延夀益算天尊南方玄眞萬福天尊湛寂法雲天尊智力法善天尊東華開化天尊三天獨尊天尊太淸道成天尊朱玄妙道天尊惠遍道運天尊敷恩丹景天尊太淸五帝天尊眞戒寶敷天尊應明高運天尊愛樂太洞天尊玄廣道運天尊天皇上帝天尊法性徧開天尊遍悟上元天尊道運神開天尊凝彩神映天尊無爲應妙天尊救苦慈航天尊神通妙運天尊𤣥範法通天尊至德寶明天尊常開光明天尊鏡心妙光天尊浮雲法王天尊開慈靈廣天尊璚琚法寶天尊𤣥道明文天尊萬運徧道天尊眞人仙暎天尊眞尊仙道天尊玉山紫舘天尊常行運明天尊無滯至眞天尊言成眞道天尊道上明照天尊淸源大願天尊等觀重玄天尊不二至性天尊明徧慧道天尊果成虛無天尊道運慧空天尊𤣥通妙達天尊南極寶輪天尊眞空眞寂天尊化彼無際天尊運明神行天尊太淸七寶天尊開淸護生天尊金明極綠天尊靜定德重天尊玉帝太玄天尊無礙等眞天尊三界寂然天尊解脫照空天尊救物應念天尊明響眞道天尊湛然三元天尊空洞無礙天尊霞焕上宮天尊法寶靈顏天尊金神玉寶天尊太淸洞視天尊焕明丹天天尊妙金光素天尊七暎北元天尊正眞戒生天尊上仙延夀天尊中宮大行天尊響明上道天尊大行西靈天尊廣訓仙靈天尊重悟紫淸天尊垂範玉淸天尊晨極天皇天尊大慧玄明天尊丹元决定天尊得解上元天尊玄輝仙德天尊譬喻方便天尊紫淸普果天尊護生開霞天尊寂然化虛天尊空生諸有天尊明響神道天尊玄會明感天尊黄光運明天尊度脫眞品天尊慧通照明天尊隨願往生天尊慈悲救苦天尊大慈大悲救苦眞人大慈大悲救度眞人大慈大悲大惠眞人大慈大悲慈觀眞人大慈大悲普救眞人大慈大悲慧空眞人大慈大悲寶相眞人大慈大悲玄覺眞人大慈大悲空朗眞人大慈大悲等相眞人大慈大悲慈朗眞人大慈大悲曜靈眞人大慈大悲淸定眞人定邪天師收鬼天師遣𥘣天師制魔天師斬邪天師啟教天師元始上帝吿諸天神王曰吾今以此經懺遣金華眞人齎往下方散佈十方三界使一切人民轉誦或有奉道之民淸信男女遇本命生辰爲皇后貴妃太子天親大醮天地日月星辰名山洞府得道神仙詠誦天尊眞人天師名號者卽有十天善神營護修奉之民上奏天府永消世厄長沐天恩鎭居鳳閣日奉麻明功德獲福無量志心朝禮太伯山眞德洞天仙官西山天寶極眞洞天仙官大潙山好生玄上洞天仙官潛山天柱司玄洞天仙官鬼哭山太玄司眞洞天仙官武夷山昇眞元化洞天仙官玉笥山太秀法樂洞天仙官華葢山容成大王洞天仙官葢竹山長曜寶元洞天仙官都嶠山實玄洞天仙官白石山瓊秀長眞洞天仙官白漏山玉闕寶圭洞天仙官九凝山朝眞大虛洞天仙官洞陽山洞陽永觀洞天仙官幕阜山洞眞太玄洞天仙官大西山大有華妙洞天仙官金庭山金庭崇妙洞天仙官元始上帝再吿左右侍眞曰吾今以此經懺散佈萬國九洲徧使人天禮念迎祥集慶保命延生若有善男信女遇三元八節燒香轉禮三淸寶號眞人天師名位上願皇后貴妃太子天親禮拜供養集福延生永先寶暦世世不絶長居紫庭冲妙先生燒香朝拜禮謝金闕上帝而獻頌曰西靈聖母貴曵璚琚鸞臺鳳閣宻從𡷰輿虹光貫斗月榮太虛穆淸宮禁永鎭天居太上靈寶朝天謝罪法懺卷二終
