seq: 7
body:
  text: 爾時元始上帝在大羅天上玉清宮內座五雲天寶妙臺集諸天仙地仙水仙三界靈眞無鞅數眾齊赴天闕上朝玉清燒香散花步虛旋繞朝拜至尊是時上帝大布威光廣演妙法念度一切咸使悟道時有上清眞人太極眞人妙行眞人出班燒香朝拜至尊臣自厯刼以來叨居眞列榮侍璚軒每聽靈音開悟塵品長念下方兆世流吹慾海漂浪愛河輪迴生死不會暫息未知作何善果出離沉淪盡獲超度是時元始上帝告左右侍眞曰下界若有善男信女長行利益割口損身施捨財寶長作福田濟及鳥獸蠢動𠲒靈普救饑寒最爲第一若道邉開井建立屋宇種植菓林撫育貧苦及於江河廣立橋樑運度行旅勤行不倦眾聖護身得無量福元始上帝告左右侍眞曰吾念眾生在三毒十惡之中爲諸魍魎鬼精魅惡鬼邪神毒蟲猛獸刀兵水火杻械牢獄疾病苦痛㐫禍纒繞不能自安吾固爲汝演說三洞大法符籙寶經救護世間令得安樂爲眾生愚痴不識罪福放縱六情或殺生偷盗邪淫放蕩慳貪嗔怒愚癡顚倒綺言妄語惡口兩舌啖食眾生違天犯地背正信邪禱祀鬼神眾罪縱橫而無片善致使毒風惡氣六天魔鬼遍滿人間流行殺伐日夜不停吾甚哀憫吾常遣諸天帝王十極神仙四司五帝按行救度咸使超悟不遇眾惡夙愆消蕩元始上帝再告左右侍眞曰吾見凡夫從無量刼來沉淪罪苦造諸惡業殺生偷盗邪淫放蕩慳貪嗔怒愚癡顚倒惡口兩舌綺言妄語啖食羣毛殺害生性違天逆地不信罪福業力深重不可稱量可於宮觀靈壇或在本家淨室建立三清寶座五帝星壇燒香散花朝禮天地拜表上章乞消罪犯身宅清凈一切諸惡盡得消除獲福無量若有帝王國主后妃帝子天孫發無上心爲七世祖禰七代宗親亡過父母一切眷屬令諸道眾於正殿宮庭或清淨道室建置道塲轉禮經懴燒香然燈懴悔行道散施財寶衣服卧具放生續命廣設齋醮勤心不退吾遣十天眞人四司五帝十直靈官下降觀宇護國安民使病者得瘥死者得活厄者得消禁者得脫行者得還士者得遷水火刀兵虎狼毒獸邪精魍魎一切厄難永不干身年命長遠各得安甯若爲亡過父母祖禰姻親轉禮經懴卽得亡者鬼籍盡除上生天堂逍遥無爲咸悟至道若㐫荒饑饉水火旱煌瘟疫伏連兵戈刦掠能依科法轉禮經懴卽得國土清平民物昌盛若媍人懷孕生育艱難或鬼怪興妖家門多變能修香火轉禮經懴卽得子母安全身宅甯靜若復有人常勤懴禮學道得道求仙得仙若復有人因事懴禮所願者得所爲者成天上人間他生今世獲福無量證果非虛元始上帝再告左右侍眞曰禮懴功德不可思議保國甯家和天安地上消天災下禳毒害其福難稱普度天人元始上帝再謂侍眞曰吾爲眾生廣作福田大建功德冩經造像置觀度人轉禮經懴修齋布施果報巍巍實爲深厚何以故財者眾生性命切巳難忘能捨命財心無悋惜廣建功德接濟孤貧內息慳貪外除刼賊人天利潤生死䝉恩救護之功獲福無量七祖先靈盡皆超逝元始上帝告左右侍眞曰吾與羣仙下觀一切眾生命若蜉蝣之蟲朝生暮死甚可哀傷夫人死者五行數盡氣絶神逝髓竭骨枯形骸蕭索心怖神懼捨命之時受大苦惱內外六親圍繞左右男女悲泣死魂惶懼莫知去處身體虛冷氣息一絶生前所作惡業罪犯俱在目前若人在世積善天人扶衛魂超福境若人生平積業牛頭羅刹驅入地獄受諸苦惱當此之時英雄豪貴頓爾俱消高車大馬何關人事莊宅金寶盡屬他人妻子眷屬豈能相代一切𡨚對俱在目前如影隨形莫可逃避若有善信男女大啟洪願爲亡過父母一切宗親大醮天地拜表上章轉禮眞經如暗得燈如疾得藥如貧得寶如飢得食如囚得出如旱得雨洗滌罪障皆得清淨上生福堂出離五苦永脫輪迴元始上帝再告左右侍眞曰下界十方國土若有清信奉道男女爲地獄苦魂六畜羣毛含靈蠢動一切等類建立三清寶座五帝星壇燒香燃燈珍異百菓上章拜表大醮諸天懴悔惡業罪重者吾遣太乙救苦天尊開紫微上宮瓊簡紫籙寶函出天尊懿號傳度下方一切人民稱揚讚歎吟詠洞章思神念眞乞削落九幽長夜之罪六畜之業使出度人天離苦解脫獲福無量咸得超度是故燒香歸身皈命五體投地志心朝禮玉清聖境虛無自然元始天尊上清眞境太上道君靈寶天尊太清仙境太上老君道德天尊太上昊天至尊金闕玉皇上帝上寧高道聖祖司命保生天尊南極星主紫微上宮天皇大帝中天星主紫微中宮北極大帝承天效法厚德光太后土皇地祗應感儲祥元天大慈聖后元君南極長生大帝統天元聖天尊東極青華大帝太乙救苦天尊貞明大聖九天應元雷聲普化天尊紫微碧玉宮太乙天帝保制刼運天尊九天雷祖大帝除災濟物天尊六天洞淵大帝伏魔上上太乙天尊六波天主帝君普施法潤天尊九天可韓司丈人朱陵度命天尊九天採訪使應元保運妙化天尊東方九炁天中青靈始老洞空天尊南方三炁天中丹靈眞老洞清天尊西方七炁天中皓靈皇老洞虛天尊北方五炁天中五靈玄老洞微天尊中央一炁天中玄靈元老洞眞天尊西南方福生無量天尊西南方太靈虛皇天尊道功眞空天尊玄會爲說天尊因果上光天尊度幽洞玄天尊玄會神妙天尊益智方便天尊湛然中天天尊𣑽行太皇天尊萬德洞玄天尊八景戒生天尊救苦眞聖天尊天中萬變天尊光道至人天尊保命東華天尊靜定上因天尊金藏妙寶天尊八極洞幽天尊廣運無爲天尊神玄道運天尊常保生神天尊丹紫緣感天尊凈明紫虛天尊眞凈空會天尊行成眞道天尊無量難賜天尊靈容妙彩天尊太元有音天尊玄會智力天尊玄都無滯天尊𣑽行無尊天尊救生化道天尊玉清妙光天尊一切慈廕天尊寂然玄應天尊交神眾善天尊法主救生天尊地皇帝一天尊虛明上運天尊𣑽行眾妙天尊高皇一切天尊洞宫妙寂天尊清光因果天尊應寂眾妙天尊直道眞常天尊青華眞志天尊萬淨眞元天尊法通三界天尊保生開凈天尊明行天常天尊玄會開悟天尊道成眞道天尊丹暉結成天尊法海太明天尊錄妙安樂天尊决定無相天尊集虛西明天尊西靈玉暦天尊運明虛空天尊黃庭空運天尊丹景道眞天尊延夀慧眞天尊玄道朗慧天尊明經化運天尊仙暎妙觀天尊眞品元和天尊無相慧礙天尊普度丹景天尊金剛妙寶天尊善昇六道天尊妙樂素華天尊開度保護天尊玉虛舟航天尊丹元慧廣天尊最勝無上天尊金臺妙寂天尊救物常善天尊至極寶明天尊璚璋寂然天尊玄妙開悟天尊慧明徧覃天尊成化令威天尊究竟洞眞天尊法被無際天尊度魂太清天尊仙靈虛應天尊金格拔幽天尊開祕丹元天尊重玄妙法天尊玄眞道明天尊上宮玄解天尊妙樂紫素天尊寶運中千天尊玄虛解勝天尊隨順善果天尊百億感身天尊妙寶金相天尊益算聖王天尊寶眾眞海天尊西明元洞天尊明運到景天尊九幽拔罪天尊隨願往生天尊慈悲救苦天尊大慈大悲救苦眞人以下眞人俱加大慈大悲救度眞人大惠眞人景相眞人明覺眞人滿相眞人景空眞人景照眞人明法眞人妙景眞人景慧眞人化生眞人相光眞人上聖天師虛皇天師無量天師明皇天師洞深天師普攝天師正一天師元始上帝告諸天神仙曰吾今以此經遣玉清眞人齎往下界遍布萬國九州一切兆庶轉禮供𠐒若有積善之人遇三元本命五臘之辰燒香轉誦大醮天地爲上世幽魂所生父母一切宗親拔贖幽冥出離苦惱咸得超度轉化成人神仙接引上昇天宮獲福無量志心朝禮黃河泊水府之神龍宮官屬洛河泊水府之神龍宮官屬淮河泊水府之神龍宮官屬巫峽溪眞仙官聖眾五雲溪眞仙官聖眾岷山溪眞仙官聖眾清遠溪眞仙官聖眾桐柏溪眞仙官聖眾嶓𡺪溪眞仙官聖眾崐崘溪眞仙官聖眾武陵溪眞仙官聖眾苧羅溪眞仙官聖眾中滌溪眞仙官聖眾浣紗溪眞仙官聖眾沔池溪眞仙官聖眾馬當山上水府之神龍宮官屬采石山中水府之神龍宮官屬金山下水府之神龍宮官屬元始上帝再謂侍眞曰吾今遣金華眞人降下此經散布萬國九州普使人天諷誦爲見世父母亡過先祖一切羣生轉禮解釋宿殃䖍心供𠐒者使門戸興隆世世昌盛萬災不干神明護門世間若有奉道之民善信男女遇三元五臘本命生辰修齋輔誦三清寶號玉軸金文爲酆都地獄一切鬼神夙業罪過咸願解除盡乞超度上昇朱宮託生人道冲妙先生燒香朝謝金闕上帝而獻頌曰玉京元始尊生成萬化主靈文告三官下開九幽府酆都炎鑊獄慈悲灑法雨洗滌諸罪魂咸皆得超度太上靈寶朝天謝罪法懴卷七終讚元始上帝十極眾眞常施法雨潤枯民萬國仰咸欽冲妙先生讚禮無上尊大聖元始宥罪大天尊三稱
