body:
  text: 太上靈寶朝天謝罪法懴卷十爾時元始上帝示大威神遠布祥光照耀萬國山河大地細微罪業無不盡見是時金華眞人玉淸眞人妙行眞人救苦眞人燒香朝拜至尊上奏言曰今觀下土眾生多不信奉恣縱身心忘行苦毒殺害眾生三毒口業罪殃深重爲十直之神司命司錄冩其罪犯上奏天府厯世纒結無由解脫禍福賞罰毫分不差見諸眾生在世積善長行陰騭者天氣蓋之地氣載之星辰照之鬼神敬之五福隨之千災離之或生在世積諸罪業行諸苦毒者天不蓋之地不載之星辰不照之鬼神害之五福遠之千災隨之臣等觀見甚可哀傷伏願上帝天慈大開方便普爲救度咸使了悟至道出離垢濁是時至尊告諸大眞人曰吾憫下方世界一切羣生猶如赤子皆令得道只爲眾生罪業深厚長居不淨恣縱情慾多有穢污在世生身長行淫慾或在宫殿星辰靈觀行諸淫慾或在神廟社壇行諸淫慾或捉人殘害離人子母奪人男女别人恩愛隔人憐念或六親通同或骨肉會合或誘人奴婢不擇妍醜或不擇賢愚或强抑男女或分割夫妻或染汚出家或祼露天地侵凌四輩行諸淫慾意想惡夢交接無所不至放縱六情無量無邊結在身中昏迷六識精氣衰竭罪犯深重今日懴滌咸乞消滅元始上帝告左右侍眞曰吾見下方男女捨身受身動意常行偷盗或偷盗天尊聖像經法財物或偷盗出家法師財物或偷盗靈觀星壇財物或偷盗修造尊像財物或偷盗庄田常住財物或偷盗齋醮供養財物或偷盗廟祠鬼神財物或偷盗父母男女財物或廹恊勢力財物或行官事誑謼財物或非義强抑財物或下脫矯妄財物或貪愛惜貸財物或借貸抵拒不償財物或欺負黯黮財物凌忽非義財物凡起一念偷盗不論多少無量無邊罪業隱藏在身未曾發露首謝今日燒香禮懴悔過一切罪咎咸乞蕩除元始上帝告左右侍眞曰吾觀下界眾生積財如山心常不足貪愛無厭殺心運智勞苦四大畧無惠心立身在世貪心刻削或見天尊聖像生慳貪心或見靈觀經法生慳貪心或見道士法師生慳貪心或見父母男女生慳貪心或見貧窮孤老生慳貪心或見死亡殘疾生慳貪心或見牢獄枷鎻生慳貪心或見荒年饑饉生慳貪心或見行旅囚徒生慳貪心或見水火急難生慳貪心或見奴婢役夫生慳貪心或見天仙星宿不生敬心或見天尊靈壇不肯布施或見經籙齋醮不肯布施或見冩經造像不肯布施或見大聖法師不肯布施或見貧窮孤老不肯布施或見囚徒枷鎻不肯布施或見疾病困苦不肯布施或見行旅饑切不肯布施夫人生在世光陰迅速生旣不將一文而來死亦不將一文而去一朝身殁萬事皆空幾許愚痴慳貪悋惜畧無慈心氣㪚而亡七寶珍玩屋宅庫藏庄田地土盡屬他人妻子悲啼骨肉分㪚有何所益生存積業一一受報不忍聽聞吾又見下界眾生終日積罪造業貪毒縈心刻削孤貧畧無恤念或於天尊聖像前生諸嗔怒或見齋醮道場生諸嗔怒或見廟庭鬼神生諸嗔怒或見老病孤貧生諸嗔怒或見牢獄囚徒生諸嗔怒或見生死急難生諸嗔怒或見水火凶災生諸嗔怒或見荒年饑饉生諸嗔怒或見奴婢役夫生諸嗔怒或見孤貧求吃生諸嗔怒或見牛馬六畜生諸嗔怒如是等心業無量無邊立身處世舉心措意畧無慈忍今日皈命懴謝咸乞滅除元始上帝告左右待眞曰吾觀下界眾生處世立身六識暗昧畧無片善或於天尊聖像前行諸愚癡或於星辰大道前行諸愚痴或於宫觀玄壇前行諸愚癡或於經籙道場前行諸愚痴或見道士出家行諸愚痴或見虛空聖賢行諸愚痴或見父母妻兒行諸愚痴或見天地日月星辰行諸愚痴或罵詈天地咒咀鬼神或逆叛君父不孝宗親或返福作凶立法亂常內淫骨肉外殺他人不信罪福因緣宿命報對謂自已長存不生不滅不分善惡不識賢愚不忍觀見諸大眞人燒香朝拜金闕上帝自今日巳後普願下界一切眾生身口意三業併皆釋放常得六根淸淨永無爭競常行柔軟心調和心慈悲心不放逸心不傲慢心無貪悋心長行歡喜心常存不殺救護心常行濟貧拔難心常行利物饒潤心若人行如是心卽有十天善神衞護永消世厄㪚滅罪殃神仙接引皆得超度元始上帝再告左右侍眞曰自今巳後下界羣生若有善士奉道之人爲一切愚痴罪障惡業及蠢走羣毛鳥獸六畜建立靈壇誦經禮懴然燈燒香拜表上章醮謝天地日月星辰五嶽四瀆酆都冥官精心不退者吾遣太乙救苦天尊開北靈紫館琅王亟藏中出碧簡金文天尊懿號稱揚讚嘆吟咏洞章思眞念道乞削落九幽長夜靈官之府玉匱之函使五苦並原三途解釋脫離羣毛返生人道高超三界永越四生是故燒香志心朝禮玉淸聖境虛無自然元始天尊上淸眞境太上道君靈寶天尊太淸仙境太上老君降生天尊太上昊天至尊金闕玉皇上帝上靈高道聖祖司命保生天尊南極聖主紫微上宫天皇大帝中天星主紫微中宫北極大帝承天效法厚德光太后土皇地祗應感儲祥元天大慈聖后元君南極長生大帝統天元聖天尊東極靑華大帝太乙救苦天尊眞明大聖九天應元雷聲普化天尊九天雷祖大帝除災濟物天尊紫微碧玉宫太乙天帝保制劫運天尊六天洞淵大帝伏魔上上太乙天尊綠波天主帝君普施法潤天尊九天可韓司丈人朱陵度命天尊九天採訪使應元保運妙化天尊東方九炁天中靑靈始老洞空天尊南方三炁天中丹靈眞老洞靑天尊西方七炁天中皓靈皇老洞虛天尊北方五炁天中五靈玄老洞微天尊中央一炁天中玄靈元老洞眞天尊下方興大福力天尊下方眞皇洞神天尊積功成聖天尊凝神照境天尊和神利物天尊總鑒眾靈天尊幽照無極天尊善斷迷感天尊好解羅網天尊瓊瑤寶蓋天尊朱景洞照天尊體悟萬行天尊洞淵微妙天尊萬行圓滿天尊無量玉皇天尊大乘空惠天尊還功報德天尊隱跡全道天尊高皇洞神天尊紫霞浮蓋天尊法雲流潤天尊闡揚妙法天尊尊妙無雙天尊玄智遠照天尊變見法界天尊威降慈緣天尊湛寂體玄天尊玉京垂惠天尊保度應運天尊太微光範天尊眞相具足天尊導世無遺天尊法緣常濟天尊勸發無礙天尊大光常照天尊道炁含育天尊降伏强良天尊延光布像天尊永證道源天尊妙福無邊天尊志節微妙天尊常傳眞戒天尊道惠圓滿天尊光德具足天尊無量增益天尊華蓋浮雲天尊沖和淨樂天尊玄隱無爲天尊幽源不測天尊永住無相天尊陶化四生天尊太虛常寂天尊紫虛觀微天尊證眞靜意天尊紫有凝神天尊常遊寂處天尊信樂正法天尊勝業濳耀天尊默念無爲天尊高眞定智天尊玄臺勤德天尊羣靈普衞天尊揮靈妙用天尊凝神生惠天尊乘景浮生天尊救度八難天尊延夀無盡天尊寂住玄都天尊和光隱妙天尊渣溟神化天尊淸淨眞意天尊惠業廣德天尊至極安樂天尊端靜凝和天尊最勝妙果天尊善救世界天尊湛相湻和天尊百寶勝嚴天尊廣布神化天尊高虛最妙天尊開化玄宗天尊南丹暉惠天尊朱陵寶德天尊妙力寶王天尊虛極垂感天尊慈和忍愛天尊尊貴無邊天尊寍撫萬神天尊宴豫景像天尊總朝上帝天尊玄理垂文天尊西那靈應天尊善道洪源天尊雲華見相天尊凝寂金闕天尊善消魔試天尊元皇眞一天尊靈應無極天尊無滯無着天尊玉淸金像天尊北眞鍊妙天尊無愛慈惠天尊九幽拔罪天尊隨願往生天尊慈悲救苦天尊大慈大悲救度眞人以下眞人位號俱首冠以大慈大悲慈悲大惠眞人慈悲轉輪眞人玄通眞人太妙眞人九光眞人普慈眞人拔難眞人護命眞人救苦眞人廣惠眞人度命眞人元始上帝告左右侍眞曰吾今演說天尊寶號眞人名位遣救苦眞人齎此眞經降下人間㪚布十方使一切天人解悟皆得神仙若有奉道之民修眞男女每遇三元五臘本命生辰爲上世亡魂六親父母追薦冥福懴謝夙生罪犯咸使先靈出離苦惱返生人道神仙接引魂度南宫存眷䝉恩獲福無量志心朝禮德山福地仙官聖眾藍水福地仙官聖眾藍田福地仙官聖眾玉峯福地仙官聖眾天目山福地仙官聖眾商山福地仙官聖眾張公洞福地仙官聖眾魚湖洞福地仙聖官眾中條山福地仙官聖眾司馬海山福地仙官聖眾綿竹山福地仙官聖眾甘山福地仙官聖眾瑰山福地仙官聖眾金城山福地仙官聖眾雲山福地仙官聖眾北北山福地仙官聖眾武當山福地仙官聖眾女几山福地仙官聖眾少室山福地仙官聖眾蘆山福地仙官聖眾西山源福地仙官聖眾南田山福地仙官聖眾玉蟠山福地仙官聖眾犢山福地仙官聖眾元始上帝再告左右侍眞曰吾今遣救苦眞人齎此寶經㪚布十方使一切人天轉禮供養爲上世亡魂六親眷屬追薦拔贖幽魂受度仙化成人超凌三界逍遙上淸若有男女奉道之流於三元八節拜表上章䖍謝天地廣設齋醮轉禮天尊眞人寶號爲地獄幽魂羣毛六畜水族濕居一切蠢動懴除罪犯洗滌宿殃普使拔出地戸永離鬼官轉化成人生昇超度沖妙先生燒香朝拜禮謝金闕上帝而獻頌曰玉帝垂靈貺天宣告萬靈救拔九幽苦廣演三洞經名奏南丹府魂超北寒庭永離炎鑊獄徑出冰池城神仙同救度逍遥上太清太上靈寶朝天謝罪法懴卷十終讚元始上帝普被羣生演說十戒度人民句句聖賢心流傅洪文頂禮削罪因大聖元始宥罪大天尊三稱
