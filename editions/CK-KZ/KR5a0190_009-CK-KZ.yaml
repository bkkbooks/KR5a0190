body:
  text: 太上靈寶朝天謝罪法懴卷九爾時元始上帝在無上大羅天中玉京金闕之內坐七寶妙臺與太上玉晨道君太上聖祖老君大集諸天一切神仙敷揚妙法廣度天人咸使得道永悟無爲是時法會中有玉清眞人太極眞人與諸天神仙持符執節燒香散花步虛旋繞讚歎聖德稱未聞見出班朝禮上奏至尊臣等忝侍雲軒受任眞位伏見下方一切羣生身心暗昧不識靈寶自然妙化何能救度多爲六夭五傷百精九醜惡鬼廣行疫毒百病因起凶禍債主𡨚家口舌誹謗哭聲相續人心悲惶禱祝不正之鬼追烹血食妄說吉凶留連百姓結罪三官爲十直之神司命司籙冩錄罪犯上奏天府奪其算祿減刻夀齡自死自生無由解脫或五斗星官告變災禍水旱風雨不調四起刀兵疫病死亡國主憂惶百姓塗炭無由救拔伏願上帝天慈保其國祚救度兆民光宣道化咸使羣生悟解正眞盡獲超度是時元始上帝告左右侍眞曰我從無始刼來常在人間教化救度眾生使十方三界凡聖天人普使開通湛然常存不生不滅持戒誦念廣建福田救護眾生眾聖欽仰羣魔稽首刻名上清吾念眾生身心暗昧不能得聞今爲汝等說無上十戒作人天福果生死善緣積福消災獲報無量上帝告侍眞曰第一戒者下土兆民不得殺生及懷殺想故殺貪殺常行慈悲救度一切羣生觀諸眾生長如自巳第二戒者不得偷盗及懷盗想常行退讓不受非義之物觀諸財寶如巳之物第三戒者不得邪婬及懷婬想常行清潔觸景幽棲觀諸男女如巳骨肉第四戒者不得慳貪及懷貪想常行布施廣濟貧窮平等一心無彼我想第五戒者不得瞋怒及懷怒想常行歡喜和睦𡨚親觀諸眾生猶如赤子第六戒者不得愚癡及懷癡想常行智慧勸誘愚迷觀諸眾生如巳手足第七戒者不得綺言及懷綺想常行忠正內外湻和觀諸經戒常生念誦第八戒者不得妄言及懷妄想常行信實隱顯無欺觀諸人民無虛妄想第九戒者不得惡口罵詈及諸惡口常行正念不起毒心觀彼毒蛇自生毒氣第十戒者不得兩舌鬭亂親朋常行端直不起愛憎觀諸彼我無向背想元始上帝告左右侍眞曰吾說此戒是眾生城郭依棲屋宅能受持男女常有玉童玉女金剛力士十天善神常侍護衛左右消災度厄保命延生神仙敬仰神明護門刀兵水火虎狼毒蛇疾病牢獄鬼賊邪精飢寒苦難一切災禍不干求男得男求女得女富貴夀樂所願從心智慧聰明形容端正功德巍巍不可思議若有善心男女禮懴行道持戒修善如彼寶劍能斷一切如彼法船能度一切如彼猛火能燒一切如彼淨水能洗一切自三清以下乃至十方眞仙莫不皆持經戒也戒者防非止惡檢敕身心降伏外魔感動靈仙得福無量元始上帝告左右侍眞曰吾見下界眾生自曠刼以來受身爲人只爲慳貪嗜慾飲酒食肉啖嚼無厭長此肌膚養其膿血致生病惱彌益罪根生老病苦暑濕風寒痛癢疼酸惡風毒氣入身染體百病來侵念念無常晝夜悲泣受生稟識各各不同日夜循環萬生萬死或處胞胎洳成膿血隨卽消化或居母腹不得出生生卽破壞雖則分娩子母暫殊卽便死亡不可稱計或一歳兩歳乃至百年念念改張衰耗精氣頭痛肚熱苦惱相侵一生之中無少安樂者良由廣食穢濁積滿身中酒肉熏肥蒸鬱藏腑惡風毒氣吹扇形體金石化消身形不久吾不飲不食抱道自然變化無方長生不死常說經戒開度眾生凡夫愚迷不能信受我常憂念愍痛在兹故演齋科令滅病苦又念眾生於曠刼以來存亡二世一切眷屬在世所犯一切罪業爲五道之神遊奕使者司命司錄察命威神錄其罪犯上奏諸天厯世纒結不能解脫眾惡備厯望返何期今日五體投地燒香懴謝乞削落九幽玉匱之函普使人天離苦解脫消無量罪獲無量福元始上帝再告左右侍眞曰下界若有奉道之流能爲水族蛟龍黿鼉魚蜄水界甲蟲建壇禮懴誦經燒香然燈懴滌水府濕居介族並乞天恩救拔咸使脫離鱗甲得返人道一切罪犯俱希解釋乃命太乙救苦天尊開洞陽之宮出瓊簡金籙天尊懿號稱揚讚嘆吟詠洞章拜表拔贖普使水族魚龍離苦解脫消無量罪生無量福是故燒香歸身皈命五體投地志心朝禮玉清聖境虛無自然元始天尊上清眞境太上道君靈寶天尊太清仙境太上老君道德天尊太上昊天至尊金闕玉皇上帝上寧高道聖祖司命保生天尊南極星主紫微上宮天皇大帝中天星主紫微中宮北極大帝承天效法厚德光太后土皇地祇應感儲祥元天大慈聖后元君南極長生大帝統天元聖天尊東極青華大帝太乙救苦天尊貞明大聖九天應元雷聲普化天尊九天雷祖大帝除災濟物天尊紫微碧玉宮太乙大天帝保制刼運天尊六天洞淵大帝伏魔上上太乙天尊六波天主帝君普施法潤天尊九天可韓司丈人朱陵度命天尊九天採訪使應元保運妙化天尊東方九炁天中青靈始老洞空天尊南方三炁天中丹靈眞老洞清天尊西方七炁天中皓靈皇老洞虛天尊北方五炁天中五靈玄老洞微天尊中央一炁天中玄靈元老洞眞天尊上方保命䕶身天尊上方玉虛明皇天尊道有方便天尊寶珠妙彩天尊上道元明天尊至德太元天尊大慈行慧天尊玉光素景天尊妙尊斗極天尊妙尊道明天尊金慈湛鏡天尊化靈寂然天尊明空最勝天尊至眞長樂天尊寶質法海天尊益算聖王天尊功德眞光天尊凝威金藏天尊九玄運明天尊眞品太空天尊玉華八素天尊丹紫有觀天尊保命開慧天尊拔苦眞階天尊妙果珠晃天尊金城妙尊天尊運慧眞道天尊凈雲聖王天尊開慈元慧天尊七眞上宰天尊慶流因果天尊法寶眞成天尊普明黃庭天尊玄虛解脫天尊洞元高行天尊妙觀眞虛天尊變化玄通天尊揚光度仙天尊仙公道化天尊應度聖王天尊映光元童天尊普大慈光天尊慈蔭苦海天尊法海寶思天尊金苑妙林天尊一乘法橋天尊妙樂法王天尊㪚暉廣明天尊月慧明光天尊普度戒生天尊萬變金宮天尊智道高步天尊高運化靈天尊靈眞度魂天尊玉精眞慧天尊寶禁萬靈天尊至眞東極天尊丹紫大帝天尊化度仙靈天尊常增十善天尊凈明眞定天尊妙虛蓮開天尊大慈𣑽元天尊威眞丹𣑽天尊明曜妙運天尊五老𣑽皇天尊徧明上勝天尊寶寂自然天尊最勝悲愍天尊仙靈玄極天尊聖眞元老天尊因增上緣天尊仙道無央天尊凈開普慈天尊靈眞慈救天尊洞源仙府天尊神照道林天尊東華瓊和天尊丹明妙眞天尊天慧仁慈天尊玄明神凈天尊靈霞妙光天尊廣明仙庭天尊安漠玄光天尊凈空普朗天尊一切感度天尊妙樂玉慈天尊崟岑瓊簡天尊眞言十華天尊解脫至訓天尊因緣高仙天尊妙行逍遥天尊眞光𣑽果天尊眞品空浮天尊高空本運天尊善開慧藏天尊神通文明天尊度天人中天尊寶暉法境天尊法解紫威天尊仙道咸度天尊九幽拔罪天尊隨願往生天尊慈悲救苦天尊大慈大悲救苦眞人以下眞人位號俱直冠以大慈大悲救度眞人大惠眞人靈寶眞人度命眞人等淨眞人無垢眞人玄明眞人等成眞人等愛眞人等玄眞人無等眞人元始上帝告左右飛天神王左右神仙曰吾今出諸天尊寶號遣救苦眞人齎往下方遍使萬國九州一切人民轉禮供𠐒上消天災下禳地禍若清眞之士奉道男女或遇本命生辰三元五臘燒香誦詠醮謝諸天生死開㤗福慶豐隆五苦解脫九幽放魂神仙救拔上昇天宮天人伏聽諦授訣言五體投地志心朝禮洞靈源福地仙官聖眾三皇井福地仙官聖眾爛柯山福地仙官聖眾芹溪福地仙官聖眾龍虎山福地仙官聖眾靈山福地仙官聖眾泉源福地仙官聖眾逍遥山福地仙官聖眾閤皂山福地仙官聖眾始豐山福地仙官聖眾金精山福地仙官聖眾白源山福地仙官聖眾鉢池山福地仙官聖眾論山福地仙官聖眾毛公壇福地仙官聖眾雞籠山福地仙官聖眾桐柏山福地仙官聖眾平鄷山福地仙官聖眾綠羅山福地仙官聖眾彰觀山福地仙官聖眾抱福山福地仙官聖眾大面山福地仙官聖眾虎溪福地仙官聖眾元辰山福地仙官聖眾馬跡山福地仙官聖眾元始上帝再告左右侍眞曰吾今遣救苦眞人持此經下降人間㪚布一切兆民供𠐒若有奉道之人遇三元八節本命生辰或爲自身供奉轉念使魂永澄正萬炁長存不經苦惱身有光明諷誦洞章䖍心進禮三清寶號十大眞人或追薦先亡祖考一切罪魂永度三途仙化成人超凌三界上升朱宮冲妙先生燒香朝拜金闕上帝而獻頌曰金闕大聖主天地萬靈師慈悲洒甘露洗滌諸塵迷廣演空洞章徧使悟希夷救拔八難苦抛離五濁泥超度六毒海永謝貪嗔癡神仙同接引逍遥上太微太上靈寶朝天謝罪法懴卷九終讚元始上帝普被羣生演說十戒度人民句句聖賢心流傳洪文頂禮削罪因大聖元始宥罪大天尊三稱
