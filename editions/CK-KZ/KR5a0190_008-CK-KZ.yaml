body:
  text: 太上靈寶朝天謝罪法懴卷八爾時龍漢元年金闕大聖元始上帝在玉清聖境元陽寶殿坐五雲天寶妙臺與諸天大聖演說妙法是時天門大震元始上帝以神光下照乃見有鬱勃黑毒血光之氣上衝天闕盤結不散其氣腥血臭穢大眾驚異元始上帝告諸天大聖左右侍眞曰下界有大荒溟渤海水腥穢無邉莫測中有大山上滲碧落下入風泉名曰北陰酆都羅山是陰氣之主九地樞機焉下有大洞名曰陰景天宮中有主者太陰水帝北陰天君中有冥官萬眾山有三宮九府三十六大鐵圍獄山中草木自然毒惡之氣化生皆爲刀劍鋒鋩爍空黑烟濛渤惡風飄震晝夜不停皆是冥官考罰罪鬼死魂之所中有六宮大魔惡鬼爲見眾生昏暗迷亂作陣下降人間妄作妖怪損害生人與世人亡過七祖魂魄勾連行種種凶災惡疾疫癘行諸毒氣死亡狼籍枉橫夭傷甚可哀憫不忍聽聞是時左右侍眞列班燒香上奏伏願至尊開大慈悲慧力救拔眾生存亡獲恩得離罪苦惟願哀憐令一切罪人得免離見世三災九橫五瘟七注疾病毒氣眾邪魍魎諸鬼之難令其性命無有中傷如䝉哀憫則仰受聖言於是至尊告諸侍眞曰吾愍一切眾生如母念子今爲汝等敷演妙法子可諦聽在心勿忘左右侍眞一切神仙稽顙聽命元始上帝聖言往昔人民湻樸無有惡心任命自然終其天算無有夭傷今末世時代澆薄人心破壞五情離亂更相誑惑互相彼此不言正化唯用邪行背眞從僞不道不仁違天逆地攻臣伐主不忠不孝無愛無慈欺誘萬民酷虐百姓枉殺眾生殘害物命結諸𡨚對動多患難或行刼奪惡賊殺傷或惡魔之所滅身或被蚖蛇虎狼百蟲毒螫之所加害或官災口舌無故枉生閉繫牢獄鞭杖徒刑或家遭瘟疫身染毒氣大小疾病人口死亡六親斷絶骨肉支離或天雷馘斬或天火燒身諸如罪犯並是積業深重是故六天殺氣北酆鬼眾與五嶽之神陣亡鬼帥遊走天下乘其罪釁放其毒氣以殺惡人更相殘賊以致死亡家道破壞子孫絶滅吾見如此甚可哀傷不忍聽聞世間若有奉道之民發無上心廣施財寶救濟貧乏放生續命轉念經懴精心不退上消凶災下禳萬禍若遇國土兵災不息疫毒流行若人䖍心禮誦此懴修設清齋者則兵災靜息妖惡自屏天人稱悅欣國太平若在山林曠野爲虎狼猛獸之所奔突則當䖍心禮告許轉是經則有護法善神救助猛獸自退終不爲害若入大海遭遇惡風許轉是經風浪靜息得達於岸若軍陣白刃之中許轉是經兵杖伏匿不有傷害若在牢獄枷鎻之中許轉是經𡨚枉自伸必得解脫若爲鬼魅邪精刑害許轉是經鬼神消滅不敢爲害若人命過之日魂入九幽地府若有男女夫妻爲亡人立九幽齋醮禮謝三官魂超五苦隨福受生是時九幽地獄罪魂聞說是經身心開悟皆發道意永不退轉遂感上天降命釋放罪魂咸皆超度是時九幽黑簿一時焚盡火山息熖氷池靜波呑火食炭化爲甘露金鎚鐵杖變成蓮花神仙拯拔上朝南宮咸得脫化元始上帝以大威力布大慈光救度一切眾生咸使身心清凈出離酆都地獄隨願往生乃命救苦眞人開道陽之臺展紫文瓊笈出天尊懿號汝等可建立三清寶座五帝靈壇掛旛獻花百珍果實嚴陳供𠐒轉禮經懴拜表上章醮謝諸天星宿五帝三官燒香然燈吟詠洞章乞削落明眞九幽玉匱長夜之函普使幽魂離苦解脫消無量罪獲無量福生死受頼是故燒香歸身皈命五體投地志心朝禮玉清聖境虛無自然元始天尊上清眞境太上道君靈寶天尊太清仙境太上老君道德天尊太上昊天至尊金闕玉皇上帝上寧高道聖神司命保生天尊南極星主紫微上宮天皇大帝中天星主紫微中宮北極大帝承天效法厚德光太后土皇地祗應感儲祥元天大慈聖后元君南極長生大帝統天元聖天尊東極青華大帝太乙救苦天尊貞明大聖九天應元雷聲普化天尊九天雷祖大帝除災濟物天尊紫微碧玉宮太乙大天帝保制刼運天尊六天洞淵大帝伏魔上上太乙天尊六波天主帝君普施法潤天尊九天可韓司丈人朱陵度命天尊九天採訪使應元保運妙化天尊東方九炁天中青靈始老洞空天尊南方三炁天中丹靈眞老洞清天尊西方七炁天中皓靈皇老洞虛天尊北方五炁天中五靈玄老洞微天尊中央一炁天中玄靈元老洞眞天尊西北方九宫捍厄天尊西北方無量太華天尊普慈難思天尊常宣眞道天尊三界清通天尊玄凝眞寂天尊自然三光天尊法海瓊明天尊妙奥太玄天尊業行普慈天尊機應感仙天尊金尊玉林天尊珠素妙靈天尊慧觀太微天尊眞相淨明天尊戒生化成天尊明悟隨光天尊最勝逍遥天尊羅玄聖王天尊勝因高尊天尊太清元靈天尊金光凝耀天尊度人天中天尊眞品內明天尊常運法明天尊明通道境天尊戒生入玄天尊神道凈行天尊太玄眞應天尊自然洞妙天尊至眞長樂天尊最勝妙行天尊萬仙生因天尊太玄虛運天尊應慈益算天尊智含太乙天尊福應因緣天尊善悟空有天尊妙樂素華天尊北玄玉洞天尊化成天仙天尊神智方便天尊無礙等清天尊天皇眞君天尊寶珠玄妙天尊上靈慧日天尊慧日照明天尊照明利貞天尊無爲至德天尊上洞曲素天尊紫清玄智天尊玉清靈眞天尊明光妙照天尊寶生開訓天尊無礙洞虛天尊瓊姿法橋天尊冲虛三乘天尊太眞聖王天尊玉眞太空天尊洞玄凈行天尊三元威光天尊瓊妙華彩天尊降魔戒生天尊逍遥玄囿天尊法智常開天尊凈定空會天尊因果增明天尊昇玄眞智天尊變化無等天尊上宮慧觀天尊無窮聖眞天尊金瓔玉寶天尊殊勝妙寂天尊運明寂然天尊地皇上眞天尊虛融應體天尊洞眞玉清天尊妙法方便天尊玄眞太元天尊靈宮東華天尊昇玄天皇天尊拔苦慈會天尊妙尊瓊林天尊光明普洞天尊空寂太元天尊太空太清天尊三元玉京天尊朱輪妙善天尊明光眞運天尊空洞西靈天尊眾善高尊天尊道眞八素天尊妙樂六洞天尊三乘玄寂天尊鍊通妙果天尊神悟紫清天尊紫清元老天尊寂然清悟天尊靈眞東華天尊法海寶化天尊洞元萬靈天尊無染太玄天尊九幽拔罪天尊隨願往生天尊㝷聲救苦天尊大慈大悲救苦眞人以下眞人俱加大慈大悲救度眞人大惠眞人應感眞人等慧眞人無相眞人太玄眞人萬夀眞人太寶眞人無畏眞人等惠眞人金輪眞人玄上眞人法輪眞人元始上帝告諸天神仙曰吾今以此經遣清華眞人齎往下方㪚布萬國九州遍使人天禮誦若有信善男女修道之人或遇本命忌辰三元八節燒香轉禮天尊眞人位號醮謝地府冥官爲上世亡魂生身父母一切宗親懴謝夙愆罪犯惡業重殃脫落幽司解除𡨚結魂生福地脫化人倫神仙接引上朝太清志心朝禮鄷都山北陰玄天酆都大帝鄷都山左府太陽宮注生冥官鄷都山右府太陰宮注死冥官鄷都山七非府黑刼府定罪冥官鄷都山連宛府明晨府定罪冥官鄷都山九幽府諒事府定罪冥官鄷都山陰天府定罪冥官鄷都山咸池府靈經府定罪冥官鄷都山參靈獄律令獄考鬼靈官鄷都山清靈獄九平獄考鬼靈官鄷都山玄沙獄河伯獄考鬼靈官鄷都山青詔獄禁罪獄考鬼靈官鄷都山玄天獄天乙獄考鬼靈官鄷都山黃天獄風雷獄考鬼靈官鄷都山平天獄虛天獄考鬼靈官鄷都山女青獄自然獄考鬼靈官鄷都山玄都獄元政獄考鬼靈官鄷都山刑政獄萬死獄考鬼靈官鄷都山泉曲獄九天獄考鬼靈官鄷都山寒氷獄鑊湯獄考鬼靈官鄷都山紂絶陰天宮洞魔王聖眾鄷都山太殺諒事宗天宮洞魔王聖眾鄷都山恬照罪氣天宮洞魔王聖眾鄷都山宗靈七非天宮洞魔王聖眾鄷都山敢司連宛天宮洞魔王聖眾鄷都山明晨耐犯武城天宮洞魔王聖眾鄷都山休明總虛天宮洞魔王聖眾鄷都山玄司重政天宮洞魔王聖眾鄷都山正眞紹靈司天宮洞魔王聖眾鄷都山玉紀明晨天宮洞魔王聖眾鄷都山赤映雲曲天宮洞魔王聖眾鄷都山統仙昇靈希微天宮洞魔王聖眾元始上帝再告左右侍眞曰吾今遣清華眞人降下此經㪚布萬國九州普使人天傳冩轉禮爲上世亡魂追薦冥福度上南宮皆歸人道咸得長生世間若有奉道之民善信男女遇三元八節吉日本命忌辰爲先靈七祖父母宗親修齋禮誦三清寶號天眞名位或爲亡過先祖見在親姻拜表上章放生續命廣建福田齊同修奉異骨成親國安民豐欣樂太平崇奉禮拜皆得度世冲妙先生燒香朝拜金闕上帝而獻頌曰傾心朝太極玉帝降洪恩天符宣地府開度長夜魂幽都解七祖靈符告三官神仙同接引上朝朱陵天永脫罪業根長享福自然太上靈寶朝天謝罪法懴卷八終讚元始上帝金闕至尊常乘妙法度諸靈玄玄妙議音天師眞人靈官赦罪因大聖元始宥罪大天尊三稱
