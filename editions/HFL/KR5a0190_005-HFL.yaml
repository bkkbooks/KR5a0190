body:
  text: 太上靈寳朝天謝罪大懴卷之五露五爾時金闕大聖元始上帝在九清妙境五雲天宫御寳雲玉座大㑹群仙敷演眞一妙法廣度群生咸使超悟是時太上道君太上老君與諸天大聖妙行眞人九天上眞四司五帝一切神仙皆駕五色璚輪八景翠輿飛雲寳蓋十絶靈旛龍旂鳯葆燒香散花遊空歩虚吟詠洞章旋遶劫仭寳䑓朝讃齊唱元始上帝咸皆欣慶是時至尊以大威德放七寳神光照曜太空下及无極世界九幽長夜地獄善惡報應一一皆見于時東方九炁天君侍眞靈官上朝金闕于時南方三炁天君侍眞靈官上朝金闕于時西方七炁天君侍眞靈官上朝金闕于時北方五炁天君侍眞靈官上朝金闕于時中央一炁天君侍眞靈官上朝金闕列班焚香進呈天下兆庶生死罪福之籍須㬰萬變宫殿䑓榭皆悉水精琉璃珊瑚琥珀雕𤥨莊嚴麒麟獅子備衛左右各赴寳座講說酆都地獄生死之籙忽聞地獄死䰟受對考罰痛聲號絶又見死䰟无託𡨋闇之中鬼官不録是時五帝上問此輩罪人是何業報受拷痛切難任伏願天慈特垂救度元始上帝謂帝君曰下元生人死䰟受考爲前生不忠不孝君臣不義父子不慈不敬三光不信罪福欺師謗道反逆宗親廣殺物命縱恣貪婬司命奪筭壽無定年死鬼報對劫盡无解此人爲前生耽酒嗜肉殺戮无度不造善功專行不道年筭未盡被六天洞宫鬼神乗人罪釁放其毒疫夭傷人命水火盗賊疫癘刀兵危難困苦官𥝠口舌枷鎻迍蹇令人所爲不遂年月歳乆遭遇不少又見風雷之獄常有黒風震雷霹靂飛戈衝突罪人分散肢體穿穴五臓萬劫受苦晝夜不息又見火翳之獄有諸罪人吞火食炭爲火所燒頭面焦燎頭戴火山皮膚骨肉節節生火萬劫受苦晝夜不息又見金剛之獄有諸罪人金鎚鐵杖亂拷无數肢體爛壞筋骨零落鐵义穿腹金鎚塞心萬劫受苦晝夜不息又見溟泠之獄有諸罪人沉没寒氷劔㦸霜刄衝斷筋骨百毒之汁以灌其上五體零落心腹破壞萬劫受苦晝夜不息又見銅柱地獄有諸罪人身上銅柱大火猛熖令諸罪人手抱足登表裏焦爛腹背膿潰萬劫受苦晝夜不息又見屠割地獄有諸罪人身被倒懸刀劔割體四肢筋脉皮膚五藏皆有刀刄割切其中罪人血流滿地非可堪忍萬劫受苦晝夜不息又見火車地獄有諸罪人五車裂體四肢分散或身處火車東西南北一一車輪皆有兵刄隨輪運轉割切罪人加諸猛火燒炙焦爛萬劫受苦晝夜不息又見鑊湯地獄有諸罪人身被鐵义义入鑊湯五體煮漬四肢爛潰膿血臭穢不可堪忍萬劫受苦晝夜不息是時元始上帝十方救苦天尊救度眞人施大威光假六通慧力令諸罪䰟閉目靜思自識宿命生存之日造諸惡業或手弑君父不孝二親或誹謗眞仙或殘傷兄弟或謀反師尊或婬犯骨肉或劫賊殺害或屠割孤貧以强陵弱以貴虐賤或穢慢靈文或隂賊嫉妬或惡口兩舌或鬬亂善人積劫以來所犯諸罪一時頓憶各各明了倍增悲惱願求解脫咸乞救度元始上帝再告侍眞曰吾見諸罪人矌劫以來不信經懴唯罪是修遂使名書惡簿身没九幽䰟滯三塗无由解脫若有清信男女發心爲上世亡䰟父母眷屬建齋行道拜表上章濟接孤貧放生續命者吾遣太乙救苦天尊於紫微上宫開三天奥藏七部瓊篇蘂簡琅函出天尊懿號下降人間讃歎諷誦吟詠洞章消滅罪犯削落九幽長夜玉匱之函遍使一切罪䰟離苦解脫隨願徃生逍遥无爲咸獲超度是故燒香歸身歸命五體投地志心朝禮玉清聖境虚无自然元始天尊上清眞境太上道君靈寳天尊太清仙境太上老君道德天尊太上昊天至尊金闕玉皇上帝南極星主紫微上宫天皇大帝中天星主紫微中宫北極大帝承天效法厚德光大后土皇地祇南極長生大帝統天元聖天尊東極青華大帝太乙救苦天尊貞明大聖九天應元雷聲普化天尊九天雷祖大帝除災濟物天尊紫微碧玉宫太一大天帝保制劫運天尊六天洞淵大帝伏魔上上太一天尊六波天主帝君溥施法潤天尊九天可韓司丈人朱陵度命天尊九天採訪使應元保運妙化天尊東方九炁天中青靈始老洞空天尊南方三炁天中丹靈眞老洞清天尊西方七炁天中皓靈皇老洞虚天尊北方五炁天中五靈玄老洞微天尊中央一炁天中玄靈元老洞眞天尊志心朝禮東北方度仙上聖天尊志心朝禮慈暎度苦天尊志心朝禮髙勝天師天尊志心朝禮金靜玉寳天尊志心朝禮照度仙道天尊志心朝禮上元四明天尊志心朝禮妙尊金眞天尊志心朝禮洞玄内祕天尊志心朝禮光相寳開天尊志心朝禮萬元洞明天尊志心朝禮无等寳照天尊志心朝禮神通眞觀天尊志心朝禮太虚一乗天尊志心朝禮湛然丹林天尊志心朝禮應眞法寂天尊志心朝禮中玄道運天尊志心朝禮解脫思議天尊志心朝禮慧元三天天尊志心朝禮神智道運天尊志心朝禮權實洞玄天尊志心朝禮上洞飛經天尊志心朝禮上帝地皇天尊志心朝禮入妙寂然天尊志心朝禮无量妙行天尊志心朝禮上洞三天天尊志心朝禮金光常湛天尊志心朝禮太玄明解天尊志心朝禮洞眞玉虚天尊志心朝禮聖眞小有天尊志心朝禮丹紫縁感天尊志心朝禮上宫平等天尊志心朝禮玄紀七聖天尊志心朝禮上元上品天尊志心朝禮寳藏法海天尊志心朝禮寳䑓法海天尊志心朝禮隨聲救苦天尊志心朝禮萬靈寳眞天尊志心朝禮朱鏡妙尊天尊志心朝禮西靈寳眞天尊志心朝禮運晨明道天尊志心朝禮眞運遍明天尊志心朝禮金聖凝湛天尊志心朝禮輪東華法天尊志心朝禮思眞延壽天尊志心朝禮金靈妙寂天尊志心朝禮萬運明廣天尊志心朝禮明玄神運天尊志心朝禮眞空道訓天尊志心朝禮道應慧朗天尊志心朝禮自然神寳天尊志心朝禮妙寳玄元天尊志心朝禮化明至道天尊