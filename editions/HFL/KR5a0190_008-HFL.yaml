body:
  text: 太上靈寳朝天謝罪大懴卷之八露八爾時龍漢元年金闕大聖元始上帝在玉清聖境元陽寳殿坐五雲天寳妙臺與諸天大聖演說妙法是時天門大震元始上帝以神光下照乃見有鬱勃黑毒血光之氣上衝天闕盤結不散其氣腥血臭穢大衆驚異元始上帝告諸天大聖左右天眞曰下界有大荒溟渤海水腥穢无邊莫測中有大山上參碧落下入風泉名曰北隂酆都羅山是隂氣之主九地樞機焉下有大洞名曰隂景天宫中有主者太隂水帝北隂天君中有㝠官萬衆山有三宫九府三十六大鐵獄山中草木自然毒惡之氣化生皆爲刀劔鋒鋩爍空黒煙濛渤惡風飄震晝夜不停皆是㝠官考罰罪鬼死䰟之所中有六宫大魔惡鬼爲見衆生昏暗迷亂作陣下降人間妄作妖怪損害生人與世人亡過七祖䰟魄勾連行種種凶災惡疾疫癘行諸毒氣死亡狼籍枉横夭傷甚可哀憫不忍聽聞是時左右侍眞列班燒香上奏伏願至尊開大慈悲慧力救拔衆生存亡荷恩得離罪苦惟願哀憐令一切罪人得免離見世三災九横五瘟七注疾病毒氣衆邪魍魎諸鬼之難令其性命无有中傷如蒙哀憫則仰受聖言於是至尊告諸侍眞曰吾愍一切衆生如母念子今爲汝等敷演妙言子可諦聽在心勿忘左右侍眞一切神仙稽䫙聽命元始上帝聖言往昔人民淳朴无有惡心任命自然終其天筭无有大傷今末世時代澆薄人心破壤五情離亂更相誑惑互相彼此不言正化唯用邪行背眞從僞不道不仁違天逆地攻臣伐主不忠不孝无愛无慈欺誘萬民酷虐百姓枉殺衆生殘害物命結諸𡨚對動多患難或行劫奪惡賊殺傷或惡魔之所滅身或被蚖蛇虎狼百蟲毒螫之所加害或官災口舌无故枉生𨳲繫牢獄鞭杖徒刑或家遭瘟疫身染毒氣大小疾病人口死亡六親斷絶骨肉支離或天雷馘斬或天火燒身諸如罪犯並是積業深重是致六天殺炁北酆鬼衆與五嶽之神陣亡鬼帥遊走天下乗其罪釁放其毒炁以殺惡人更相殘賊以致死亡家道破壞子孫絶滅吾見如此甚可哀傷不忍聽聞世間若有奉道之民發无上心廣施財寳救濟貧乏放生續命轉念經懴精心不退上消凶災下禳萬禍若遇國土兵災不息疫毒流行若人虔心禮誦此懴修設清齋者則兵災靜息妖惡自屏天人稱恱欣國太平若在山林曠野爲虎狼猛獸之所奔突則當虔心禮告許轉是經則有護法善神救助猛獸自退終不爲害若入大海遭遇惡風許轉是經風浪靜息得達於岸若軍陣白刄之中許轉是經兵杖伏匿不有傷害若在牢獄枷鎻之中許轉是經冤枉自伸必得解脫若爲鬼魅邪精刑害許轉是經鬼神消滅不敢爲害若人命過之日䰟入九幽地府縈留男女夫妻爲亡人立九幽齋醮禮謝三宫䰟超五苦隨福受生是時九幽地獄罪人聞說是經身心開悟皆發道意永不退轉遂感上天降命釋放罪䰟咸皆超度是時九幽黒簿一時焚燼火山息焰氷池靜波呑火食炭化爲甘露金鎚鐵杖變成蓮花神仙拯拔上朝南宫咸得託化元始上帝以大威力布大慈悲救度一切衆生咸使身心清淨出離酆都地獄隨願徃生乃命救苦眞人開通陽之臺展紫文瓊笈出天尊懿號汝等可建立三清寳座五帝靈壇掛旛獻花百珍異果嚴陳供養轉禮經懴拜表上章醮謝諸天星宿五帝三官燒香然燈吟詠洞章乞削落明眞九幽玉匱長夜之函普使幽䰟離苦解脫消无量罪獲无量福生死受頼是故燒香歸身歸命五體投地志心朝禮玉清聖境虛无自然元始天尊上清眞境太上道君靈寳天尊太清仙境太上老君道德天尊太上昊天至尊金闕玉皇上帝南極星主紫微上宫天皇大帝中天星主紫微中宫北極大帝承天效法厚德光大后土皇地祇南極長生大帝統天元聖天尊東極青華大帝太乙救苦天尊貞明大聖九天應元雷聲普化天尊九天雷祖大帝除災濟物天尊紫微碧玉宫太一大天帝保制劫運天尊六天洞淵大帝伏魔上上太一天尊六波天主帝君普施法潤天尊九天可韓司丈人朱陵度命天尊九天採訪使應元保運妙化天尊東方九炁天中青靈始老洞空天尊南方三炁天中丹靈眞老洞清天尊西方七炁天中皓靈皇老洞虛天尊北方五炁天中五靈玄老洞微天尊中央一炁天中玄靈元老洞眞天尊志心朝禮西北方无量太華天尊志心朝禮普慈難思天尊志心朝禮常宣眞道天尊志心朝禮三界清通天尊志心朝禮玄凝眞寂天尊志心朝禮自然三光天尊志心朝禮法海瓊明天尊志心朝禮妙奥太玄天尊志心朝禮業行普慈天尊志心朝禮機應感仙天尊志心朝禮金尊玉林天尊志心朝禮珠素妙靈天尊志心朝禮慧觀太微天尊志心朝禮眞相淨明天尊志心朝禮戒生化成天尊志心朝禮明悟隨光天尊志心朝禮最勝逍遥天尊志心朝禮羅玄聖王天尊志心朝禮勝因髙尊天尊志心朝禮太清元靈天尊志心朝禮金光凝耀天尊志心朝禮度人天中天尊志心朝禮眞品内名天尊志心朝禮常運法明天尊志心朝禮明通道境天尊志心朝禮戒生入玄天尊志心朝禮神道淨行天尊志心朝禮太玄眞應天尊志心朝禮自然洞妙天尊志心朝禮至眞長樂天尊志心朝禮最勝妙行天尊志心朝禮萬仙生因天尊志心朝禮太玄虚運天尊志心朝禮應慈益筭天尊志心朝禮智含太一天尊志心朝禮福應因縁天尊志心朝禮善悟空有天尊志心朝禮妙樂素華天尊志心朝禮北玄玉洞天尊志心朝禮化成天仙天尊志心朝禮神智方便天尊志心朝禮无礙等清天尊志心朝禮天皇眞君天尊志心朝禮寳珠玄妙天尊志心朝禮上靈慧日天尊志心朝禮慧日照明天尊志心朝禮照明利貞天尊志心朝禮无爲至德天尊志心朝禮上洞曲素天尊志心朝禮紫清玄智天尊志心朝禮玉清靈眞天尊志心朝禮明光妙照天尊志心朝禮寳生開訓天尊志心朝