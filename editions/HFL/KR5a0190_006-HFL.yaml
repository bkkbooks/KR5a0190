front:
  text: 太上靈寳朝天謝罪大懴卷之六露六爾時元始上帝在大羅天宫黃金殿内七寳幃中大顯威神祥光輝爍照曜天地眞仙侍衛无鞅數衆建節捧香羅列左右歩虚旋繞讃歎至尊時見天仙地仙水仙各整威儀上朝金闕進呈萬國九州兆民生死罪福之目姓名功過毫分不失是時元始上帝謂左右侍眞曰吾觀一切有情皆是虚假念念滅壞曾不暫停苦惱輪迴凡夫不覺三途徃返萬劫辛酸受身生身煩惱纏縛皆由妄想顚倒執見關心生死存亡不能自出甚可哀傷是時法㑹中有金華眞人廣福眞人端簡整佩出班燒香朝拜金闕上帝臣等積善深厚位列玉清得侍左右恭聽法音開示群品今見下方一切衆生不顧宿命不遵經法是非爭競六識昏迷五毒縈心造業之時无所畏懼或呌喚鬼神以爲救助或上指三光七祖以爲盟誓六親相殘傷殺无道臨命終時戀其室宅財寳愛惜本身顧憐妻女心迫情切或發惡願債主𡨚家俱在目前沉淪五道无由解脫伏願天慈大開恩宥救度群倫出離幽㝠咸使悟道是時元始上帝告侍眞曰吾觀下界衆生妄想顚倒皆從心起强生分别繫念在心觸境生迷舉心皆妄當自定志智慧觀身骨肉肌膚形骸毛髮六根四大五藏百神諦想思惟緫无實處共相假合結聚成身表裏㝷求我在何處身旣是假心即成空空假非眞悉爲妄想是非憎愛貪著色聲香味觸法嫉妬慳貪殺盗邪婬綺言惡罵凡諸作業泯爾皆除内外清虚自悟眞道元始上帝告侍眞曰汝等定智觀身緫无實處人之執見者爲六根三業未淨一曰眼根二曰耳根三曰鼻根四曰舌根五曰身根六曰意根夫六根者能生諸業猶如草木生諸花葉子實展轉六情六賊六慾能生諸業若能用智慧思惟六根諸業皆盡夫三業者一者身業二者心業三者口業身則殺盗邪婬心則慳貪瞋怒口則綺言妄語惡口兩舌共成十惡諦思十惡悉是浮虚但自三業及六根漸自除滅損之又損乆能行之眞道自悟元始上帝告左右侍眞曰吾念下界衆生歴劫以來運心起意多有虚妄並不眞淳多有綺言或於天尊聖像前行諸綺言或於經法道場前行諸綺言或於父母尊親前行諸綺言或於賢人長者前行諸綺言或於豪貴長者前行諸綺言或於聦明識解前行諸綺言或於諸天聖衆日月星辰前舉心皆行綺言其罪深重今日恭對三寳靈壇前懴謝咸乞蕩除吾念衆生立身運心綺言妄語惡口兩舌嫉妬勝巳闘亂是非離人骨肉反虚成實轉僞爲眞今日懴悔皆令清淨得入信根元始上帝告左右侍眞曰吾觀下界衆生立身以來眼耳鼻舌起意造惡殺生偷盗邪婬放蕩慳貪瞋怒愚癡顚倒綺言妄語惡口兩舌嫉妬勝巳飲酒食肉違犯三光皆眞向僞信邪倒見禱祀鬼神不奉三寳訾毀嗊嗃輕慢傲誕媅滯色慾染習香味沉迷觸法内造外作展轉相生六根互起更相成愆罪根增長念念成非有无量罪數結習來乆緫在身中不可稱計一發念心皆得清淨猶如明鑑塵埃蒙蔽脂垢積聚生翳内外不明一旦遇良工拂拭磨洗表裏光徹逺近洞照還復如初何以故性本清淨人生亦爾神本清淨无諸滓穢但受形之後漸染成愆六根六情六賊六慾六識分别妄作穢弊生身障翳失其眞性流浪生死動入罪根報對相纏便入地獄受諸苦惱萬劫輪轉吾以慈悲憐念衆生故從劫到劫轉輪人間或生夷夏或老或少或貴或賤種種方便教化度脫衆生經教流傳開悟一切使離苦惱永出泥犁但衆生智劣不能解悟我今爲汝分别罪福因縁令一切衆生悉得解脫元始上帝謂衆眞曰若有下方善信男女受持此經燒香懴悔洗滌身中一切苦惱悉得清淨消无量无邊宿根惡業諸天上聖一切神仙常欲令人勤燒香懴悔則有十天善神保護衆聖護持若罪根結身内外纏縛則惡神考害疾病纏身水火刀兵毒蟲猛獸枷鎻牢獄衆苦害身凡夫惟知外飾面目衣服手足不能内洗身心罪根惡業可不愚哉若夫面目手足衣服等事勤加洗濯必得清淨值遇神仙皆獲福慶元始上帝告左右侍眞曰下界若有奉道男女於古觀靈壇或本居淨室爲先亡祖考建三清寳座五帝靈壇誦經禮懴大醮諸天吾遣太乙救苦天尊開紫微寳藏玉簡丹文出天尊懿號讃歎稱揚吟詠洞章乞削落盟眞九幽玉匱之函普使人天離苦解脫消歴劫罪獲无量福是故燒香歸身歸命五體投地
