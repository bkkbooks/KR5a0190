body:
  text: 太上靈寳朝天謝罪大懴卷之十露十爾時元始上帝在大羅天上金闕之内寳臺之中大集群仙廣演妙法救度人倫時有天仙地仙水仙三府靈官五嶽四瀆地府百司各整威儀理劒整佩叅駕雲龍上朝天闕列班燒香立侍瓊軒各進呈四方分野兆民生死罪福之籍是時元始上帝示大威神逺布祥光照耀萬國山河大地細微罪業无不盡見是時金華眞人玉清眞人妙行眞人救苦眞人燒香朝拜至尊上奏言曰今覩下土衆生多不信奉恣縱身心長行苦毒殺害衆生三毒口業罪殃深重爲十直之神司命司録寫其罪犯上奏天府歷劫纏結无由解脫禍福賞罰毫分不差見諸衆生在世積善長行隂騭者天氣蓋之地氣載之星辰照之鬼神敬之五福隨之千災離之或見在世積諸罪業行諸苦毒者天不蓋之地不載之星辰不照之鬼神害之五福逺之千災隨之臣等觀見甚可哀傷伏願上帝天慈大開方便普爲救度咸使了悟至道出離垢濁是時至尊告諸大眞人曰吾憫下方世界一切群生猶如赤子皆令得道只爲衆生罪殃深厚長居不淨恣縱情慾多有穢汙在世生身長行婬慾或在宫殿星辰靈觀行諸婬慾或在神廟社壇行諸婬慾或捉人殘害離人子母奪人男女别人恩愛隔人憐念或六親通同或骨肉㑹合或誘人奴婢不擇妍醜或不擇賢愚或疆抑男女或分割夫妻或染汙出家或裸露天地侵陵四輩行多婬慾意想惡夢交接无所不至放縱六情无量无邊結在身心昏迷六識精氣衰竭罪犯深重今日懴滌咸乞消滅元始上帝再告左右侍眞曰吾見下方男女捨身生身動意常行偷盗或偷盗天尊聖像經法財物或偷盗出家法師財物或偷盗靈觀星壇財物或偷盗修造尊像財物或偷盗庄田常住財物或偷盗齋醮供養財物或偷盗廟祀鬼神財物或偷盗父母男女財物或迫脅勢力財物或行官事誑謼財物或非義强抑財物或下脫矯妄財物或貪愛借貸財物或借貸扺拒不償財物或欺負黯黮陵忽非義財物凡起一念偷盗不論多少无量无邊罪業隱藏在身未曽發露首謝今日燒香禮懴悔過一切罪咎咸乞蕩除元始上帝再告左右侍眞曰吾觀下界衆生積財如山心常不足貪愛无猒役心運智勞苦四大略无惠心立身在世貪心刻削或見天尊星辰生慳貪心或見靈觀經法生慳貪心或見道士法師生慳貪心或見父母男女生慳貪心或見貧窮孤老生慳貪心或見死亡殘疾生慳貪心或見牢獄枷鎻生慳貪心或見荒年飢餓生慳貪心或見行旅囚徒生慳貪心或見水火急難生慳貪心或見奴婢役夫生慳貪心或見天仙星宿不肯布施或見天尊靈壇不肯布施或見經籙齋醮不肯布施或見寫經造像不肯布施或見大德法師不肯布施或見貧窮孤老不肯布施或見囚徒枷鎻不肯布施或見疾病困苦不肯布施或見水火急難不肯布施或見行旅急切不肯布施或見荒年飢餓不肯布施夫人生一日之活百年生計生旣不將一錢來死亦不將一錢去一朝身殁萬事皆空幾許愚癡慳貪悋惜略无慈心氣絶死亡七寳珍玩屋宅庫藏莊田地土盡屬他人妻子悲啼骨肉分散有何所益生存積業一一受報不忍聽聞吾又見下界衆生終日積罪業貪毒縈心刻削孤貧略无恤念或於天尊聖像前生諸瞋怒心或於宫觀經法前生諸瞋怒心或見道士出家生諸瞋怒心或見寫經造像生諸瞋怒或見齋醮道場生諸瞋怒或見廟庭鬼神生諸瞋怒或見老病孤貧生諸瞋怒或見牢獄囚徒生諸瞋怒或見生死急難生諸瞋怒或見水火凶災生諸瞋怒或見荒年飢餓生諸瞋怒或見奴婢役夫生諸瞋怒或見孤貧求乞生諸瞋怒或見牛馬六畜生諸瞋怒如是等心業无量无邊立身處世舉心措意略无慈忍今日歸命懴謝咸乞滅除元始上帝曰吾觀下界衆生處世立身六識暗昧略无片善或於天尊聖像前行諸愚癡或於星辰大道前行諸愚癡或於宫觀玄壇前行諸愚癡或於經籙道場行諸愚癡或見道士出家行諸愚癡或見虚空賢聖行諸愚癡或見父母妻兒行諸愚癡或見天地日月星辰行諸愚癡或罵詈天地呪詛鬼神或逆叛君父不孝宗親或返凶作禍立法亂常内婬骨肉外殺他人不信罪福因縁宿命報對謂自己長存不生不滅不分善惡不識賢愚如此愚癡不忍觀見諸大眞人燒香朝謝金闕上帝自今日巳後普願下界一切衆生身心口意三業並皆釋放常得六根清淨永无爭競常行柔輭心調和心慈愛心不放逸心不傲慢心无貪悋心長行歡喜心常生不殺救護心常行孝義忠信心常行濟貧拔難心常生利物饒潤心若人行如是心即有十天善神衛護永消世戹散滅罪殃永无憂怖神仙接引皆得超度元始上帝再告左右侍眞曰自今巳後下界群生若有善信奉道之人爲一切愚癡罪障惡業及飛走群毛鳥獸六畜等建立靈壇誦經禮懴然燈燒香拜表上章醮謝天地日月星辰五嶽四瀆酆都㝠官精心不退者吾遣太乙救苦天尊開北靈紫館琅玕藏中出碧簡金文天尊懿號稱敭讃歎吟詠洞章思眞念道乞削落九幽長夜靈官之府玉匱之函使五苦並原三塗解釋脫落群毛永離罪業盡得超度返身人道不滯苦難長處逍遥所願遂心是故燒香歸身歸命五體投地志心朝禮玉清聖境虚无自然元始天尊上清眞境太上道君靈寳天尊太清仙境太上老君道德天尊太上昊天至尊金闕玉皇上帝南極星主紫微上宫天皇大帝中天星主紫微中宫北極大帝承天效法厚德光大后土皇地祇南極長生大帝統天元聖天尊東極青華大帝太乙救苦天尊貞明大聖九天應元雷聲普化天尊九天雷祖大帝除災濟物天尊紫微碧玉宫太一大天帝保制劫運天尊六天洞淵大帝伏魔上上太一天尊六波天主帝君普施法潤天尊九天可韓司丈人朱陵度命天尊九天採訪使應元保運妙化天尊東方九炁天中青靈始老洞空天尊南方三炁天中丹靈眞老洞清天尊西方七炁天中皓靈皇老洞虚天尊北方五炁天中五靈玄老洞微天尊中央一炁天中玄靈元老洞眞天尊志心朝禮下方眞皇洞神天尊志心朝禮積功成聖天尊志心朝禮凝神照境天尊志心朝禮和神利物天尊志心朝禮總領衆靈天尊志心朝禮幽照无極天尊志心朝禮善斷迷惑天尊志心朝禮好解羅網天尊志心朝禮瓊瑶寳蓋天尊志心朝禮朱景洞照天尊志心朝禮體悟萬行天尊志心朝禮洞淵微妙天尊志心朝禮萬行圓滿天尊志心朝禮无量玉皇天尊志心朝禮大乗空惠天尊志心朝禮還功報德天尊志心朝禮隱跡全道天尊志心朝禮髙皇洞晨天尊志心朝禮紫霞浮蓋天尊志心朝禮法雲流潤天尊志心朝禮闡揚妙法天尊志心朝禮尊妙无雙天尊志心朝禮玄智逺照天尊志心朝禮變見法界天尊志心朝禮威降慈縁天尊志心朝禮湛寂體玄天尊志心朝禮玉京垂惠天尊志心朝禮保度應運天尊志心朝禮太微光範天尊志心朝禮眞相具足天尊志心朝禮導世无遺天尊志心朝禮法縁常濟天尊志心朝禮勸發无礙天尊志心朝禮大光常照天尊志心朝禮道炁含育天尊志心朝禮降伏强梁天尊志心朝禮延光布像天尊志心朝禮永證道源天尊志心朝禮妙福无邊天尊志心朝禮志節微妙天尊志心朝禮常傳眞戒天尊志心朝禮道惠圓滿天尊志心朝禮光德具足天尊志心朝禮无量増益天尊志心朝禮華蓋浮雲天尊志心朝禮沖和淨樂天尊志心朝禮玄隱无爲天尊志心朝禮幽源不測天尊志心朝禮永住无相天尊志心朝禮陶化四生天尊志心朝禮太虚常寂天尊志心朝禮紫虚觀微天尊志心朝禮證眞靜意天尊志心朝禮紫府凝神天尊志心朝禮恒遊寂處天尊志心朝禮信樂正法天尊志心朝禮勝業潜耀天尊志心朝禮黙念无爲天尊志心朝禮髙眞定智天尊志心朝禮玄臺勤德天尊志心朝禮群靈普衛天尊志心朝禮揮靈妙用天尊志心朝禮凝神生惠天尊志心朝禮乗景浮生天尊志心朝禮救度八難天尊志心朝禮延壽无盡天尊志心朝禮寂住玄都天尊志心朝禮和光隱妙天尊志心朝禮窈㝠神化天尊志心朝禮清淨真意天尊志心朝禮慧業廣德天尊志心朝禮至極安樂天尊志心朝禮端靜凝和天尊志心朝禮最勝妙果天尊志心朝禮善救世界天尊志心朝禮湛相淳和天尊志心朝禮百寳勝嚴天尊志心朝禮廣布神化天尊志心朝禮髙虚最妙天尊志心朝禮開化玄宗天尊志心朝禮南丹暉惠天尊志心朝禮朱靈寳德天尊志心朝禮妙力寳王天尊志心朝禮虚極垂感天尊志心朝禮慈和忍愛天尊志心朝禮尊貴无邊天尊志心朝禮寧撫萬神天尊志心朝禮宴豫景像天尊志心朝禮緫朝上帝天尊志心朝禮玄理垂文天尊志心朝禮西那靈應天尊志心朝禮善導洪源天尊志心朝禮雲華見相天尊志心朝禮凝寂金闕天尊志心朝禮善消魔試天尊志心朝禮元皇眞一天尊志心朝禮靈應无極天尊志心朝禮无滯无著天尊志心朝禮玉清金相天尊志心朝禮北眞錬妙天尊志心朝禮无礙慈惠天尊志心朝禮九幽拔罪天尊志心朝禮隨願往生天尊志心朝禮慈悲救苦眞人志心朝禮慈悲救度眞人志心朝禮慈悲大惠眞人志心朝禮慈悲轉輪眞人志心朝禮玄通眞人志心朝禮太妙眞人志心朝禮九光眞人志心朝禮普慈眞人志心朝禮拔難眞人志心朝禮護命眞人志心朝禮救死眞人志心朝禮廣惠眞人志心朝禮度命眞人元始上帝告五帝神仙三界衆聖曰吾今演說天尊寳號眞人名位遣救苦眞人齎此眞經降下人間散布十方使一切天人解悟皆得神仙若有奉道之人修眞男女每遇三元五臘本命生辰爲上世亡䰟六親父母追薦幽䰟懴謝夙生罪犯或陷身在六畜群毛水族蛟蜃濕居鱗甲一切蠢動之中乞出離苦惱返生人道神仙接引䰟度南宫夙劫重殃咸皆釋放獲福无量志心朝禮德山福地仙官聖衆藍水福地仙官聖衆玉峰福地仙官聖衆天目山福地仙官聖衆商山福地仙官聖衆張公洞福地仙官聖衆魚湖洞福地仙官聖衆中條山福地仙官聖衆司馬悔山福地仙官聖衆緜竹山福地仙官聖衆甘山福地仙官聖衆瑰山福地仙官聖衆金城山福地仙官聖衆雲山福地仙官聖衆北邙山福地仙官聖衆武當山福地仙官聖衆女几山福地仙官聖衆少室山福地仙官聖衆廬山福地仙官聖衆西山源福地仙官聖衆南田山福地仙官聖衆玉蟠山福地仙官聖衆别本作玉瑠抱犢山福地仙官聖衆元始上帝再告左右眞人曰吾今遣救苦眞人齎此寳經散布下方使一切人天轉禮爲上世亡䰟六親眷屬追薦懴悔幽䰟受度仙化成人超淩三界逍遥上清若有男女世人三元八節拜表上章虔謝天地修奉清齋誦詠三清寳號諸天眞人爲地獄幽䰟群毛六畜水族濕居一切蠢動懴除罪犯乞洗滌夙殃者普使拔出地戸永離鬼官轉化成人普得超度沖妙先生燒香朝謝金闕上帝而獻頌曰玉帝垂靈貺天宣告萬靈救拔九幽苦廣演三洞經名奏南丹府䰟超北寒庭永離炎鑊獄徑出氷池城神仙同救度逍遥上太清太上靈寳朝天謝罪大懴卷之十
