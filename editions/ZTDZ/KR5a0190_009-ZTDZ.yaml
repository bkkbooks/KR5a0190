body:
  text: 志心朝禮玉清聖境虚无自然元始天尊上清眞境太上道君靈寳天尊太清仙境太上老君道德天尊太上昊天至尊金闕玉皇上帝南極星主紫微上宫天皇大帝中天星主紫微中宫北極大帝承天效法厚德光大后土皇地祇南極長生大帝統天元聖天尊東極青華大帝太乙救苦天尊貞明大聖九天應元雷聲普化天尊九天雷祖大帝除災濟物天尊紫微碧玉宫太一大天帝保制劫運天尊六天洞淵大帝伏魔上上太一天尊六波天主帝君普施法潤天尊九天可韓司丈人朱陵度命天尊九天採訪使應元保運妙化天尊東方九炁天中青靈始老洞空天尊南方三炁天中丹靈眞老洞清天尊西方七炁天中皓靈皇老洞虛天尊北方五炁天中五靈玄老洞微天尊中央一炁天中玄靈元老洞眞天尊志心朝禮上方玉虚明皇天尊志心朝禮道有方便天尊志心朝禮寳珠妙彩天尊志心朝禮上道元明天尊志心朝禮至德太元天尊志心朝禮大慈行慧天尊志心朝禮玉光素景天尊志心朝禮妙尊斗極天尊志心朝禮妙尊道明天尊志心朝禮金慈湛鏡天尊志心朝禮化靈寂然天尊志心朝禮明空最勝天尊志心朝禮至眞長樂天尊志心朝禮寳質法海天尊志心朝禮益筭聖王天尊志心朝禮功德眞光天尊志心朝禮凝威金藏天尊志心朝禮九玄運明天尊志心朝禮眞品太空天尊志心朝禮玉華八素天尊志心朝禮丹紫有觀天尊志心朝禮保命開慧天尊志心朝禮拔苦眞階天尊志心朝禮妙果珠晃天尊志心朝禮金城妙尊天尊志心朝禮運慧眞道天尊志心朝禮浮雲聖王天尊志心朝禮開慈元慧天尊志心朝禮七眞上宰天尊志心朝禮慶流因果天尊志心朝禮法寳眞成天尊志心朝禮普明黄庭天尊志心朝禮玄虚解脫天尊志心朝禮洞无髙行天尊志心朝禮妙觀眞虛天尊志心朝禮變化玄通天尊志心朝禮揚光度仙天尊志心朝禮仙公道化天尊志心朝禮應度聖王天尊志心朝禮映光元童天尊志心朝禮普大慈光天尊志心朝禮慈䕃苦海天尊志心朝禮法海寳思天尊志心朝禮金苑妙林天尊志心朝禮一乗法橋天尊志心朝禮妙樂法王天尊志心朝禮散暉廣明天尊志心朝禮月慧明光天尊志心朝禮普度戒生天尊志心朝禮萬變金宫天尊志心朝禮智道髙步天尊志心朝禮髙運化靈天尊志心朝禮靈眞度䰟天尊志心朝禮玉精眞慧天尊志心朝禮寳禁萬靈天尊志心朝禮至眞東極天尊志心朝禮丹紫大帝天尊志心朝禮化度仙靈天尊志心朝禮常增十善天尊志心朝禮淨朗眞定天尊志心朝禮妙虚蓮開天尊志心朝禮大慈梵元天尊志心朝禮威眞丹梵天尊志心朝禮明曜妙運天尊志心朝禮五老梵皇天尊志心朝禮徧明上勝天尊志心朝禮㝠寂自然天尊志心朝禮最勝悲愍天尊志心朝禮仙靈玄極天尊志心朝禮聖眞元老天尊志心朝禮因増上縁天尊志心朝禮仙道无央天尊志心朝禮淨開普慈天尊志心朝禮靈眞慈救天尊志心朝禮洞源仙府天尊志心朝禮神照道林天尊志心朝禮東華瓊和天尊志心朝禮丹明妙貞天尊志心朝禮天慧仁慈天尊志心朝禮玄明神淨天尊志心朝禮雲霞妙光天尊志心朝禮廣明仙庭天尊志心朝禮安漠玄光天尊志心朝禮淨空普朗天尊志心朝禮一切感度天尊志心朝禮妙樂玉慈天尊志心朝禮崟岑瓊簡天尊志心朝禮眞言十華天尊志心朝禮解脫至訓天尊志心朝禮因縁髙仙天尊志心朝禮妙行逍遥天尊志心朝禮眞光梵果天尊志心朝禮眞品空浮天尊志心朝禮髙空本運天尊志心朝禮善開慧藏天尊志心朝禮神通文明天尊志心朝禮度天人中天尊志心朝禮寳暉法境天尊志心朝禮法解紫威天尊志心朝禮仙道咸度天尊志心朝禮九幽拔罪天尊志心朝禮隨願往生天尊志心朝禮慈悲救苦眞人志心朝禮慈悲救度眞人志心朝禮慈悲大惠眞人志心朝禮靈寳眞人志心朝禮度命眞人志心朝禮等淨眞人志心朝禮无垢眞人志心朝禮玄明眞人志心朝禮等成眞人志心朝禮等愛眞人志心朝禮等玄眞人志心朝禮无等眞人元始上帝告十方飛天神王左右神仙曰吾今出諸天尊寳號遣救苦眞人齎往下方遍使萬國九州一切人民轉禮供養上消天災下禳凶禍若有清眞之士奉道女男或遇本命生辰三元五臘燒香諷詠醮謝諸天生死開泰福慶豐隆五苦解脫九幽放䰟神仙救拔上昇天宫天人伏聽諦授訣言志心朝禮洞靈源福地仙官聖衆三皇井福地仙官聖衆爛柯山福地仙官聖衆芹溪福地仙官聖衆龍虎山福地仙官聖衆靈山福地仙官聖衆泉源福地仙官聖衆逍遥山福地仙官聖衆閤皂山福地仙官聖衆始豐山福地仙官聖衆金精山福地仙官聖衆白源山福地仙官聖衆鉢池山福地仙官聖衆論山福地仙官聖衆毛公壇福地仙官聖衆雞籠山福地仙官聖衆桐栢山福地仙官聖衆平都山福地仙官聖衆緑羅山福地仙官聖衆彰觀山福地仙官聖衆抱福山福地仙官聖衆太面山福地仙官聖衆虎溪福地仙官聖衆元辰山福地仙官聖衆馬跡山福地仙官聖衆元始上帝再告左右侍眞曰吾今遣救苦眞人持此經下降人間散布一切兆民供養若有奉道之人遇三元八節本命生辰或爲自身修奉轉念使䰟神澄正萬炁長存不經苦惱身有光明諷詠洞章虔心瞻禮三清寳號十大眞人或追薦先亡祖考一切罪䰟永度三徒仙化成人超淩三界上昇朱宫沖妙先生燒香朝拜金闕上帝而獻頌曰金闕大聖主天地萬靈師慈悲灑甘露洗滌諸塵迷廣演空洞章徧使悟希夷救拔八難苦抛離五濁泥超度六毒海永謝貪瞋癡神仙同接引逍遥上太微太上靈寶朝天謝罪大懴卷之九
