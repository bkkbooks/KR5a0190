front:
  text: 太上靈寳朝天謝罪大懴卷之九露九爾時元始上帝在无上大羅天中玉京金闕之内坐七寳妙臺與太上玉晨道君太上聖祖老君大集諸天一切神仙敷揚妙法廣度天人咸使得道永悟无爲是時法㑹中有玉清眞人太極眞人與諸天神仙持符執節燒香散花步虚旋繞讃歎聖德稱未聞見出班朝禮上奏至尊臣等忝侍雲軒受任眞位伏見下方一切群生身心暗昧不識靈寳自然妙化何能救度多爲六夭五傷百精九醜惡鬼廣行疫毒百病因起凶禍債主𡨚家口舌誹謗哭聲相續人心悲惶寒熱起内病生於外禱祝不正之鬼追烹血食妄說吉凶留連百怪結罪三官爲十直之神司命司録寫録罪犯上奏天府奪其筭禄减刻壽齡自死自生无由解脫或五斗星官告變灾禍水旱風兩不順四起刀兵疫病死亡國主憂惶百姓塗炭无由救拔伏願上帝天慈保其國祚救度兆民光宣道化咸使群生悟解正眞盡獲超度是時元始上帝告左右侍眞曰我從无始劫來常在人間教化救度衆生使十方三界凡聖天人普使開通湛然常存不生不滅持戒誦念廣建福田救護衆生衆聖欽仰群魔稽首列名上清吾念衆生身心暗昧不能得聞今爲汝等說无上十戒作人天福業生死善縁降福消災獲報无量天尊告侍眞曰第一戒者下土兆民不得殺生及懷殺想故殺貪殺常行慈悲救度一切群生觀諸衆生長如自已第二戒者不得偷盗及懷盗想常行退讓不受非義之物觀諸財寳如己之物第三戒者不得邪婬及懷婬想常行清潔觸景幽棲觀諸男女如己骨肉第四戒者不得慳貪及懷貪想常行布施廣濟貧窮平等一心无彼我想第五戒者不得瞋怒及懷怒想常行歡喜和睦冤親觀諸衆生猶如赤子第六戒者不得愚癡及懷癡想常行智慧勸誘愚迷觀諸衆生如己手足第七戒者不得綺言及懷綺想常行忠正内外淳和觀諸經戒常生念誦第八戒者不得妄言及懷妄想常行信實隱顯无欺觀諸人民无虚妄想第九戒者不得惡口罵詈及諸惡口常行正念不起毒心觀彼毒蛇自生毒氣第十戒者不得兩舌鬬亂親朋常行端直不起愛憎觀諸彼我无向背想元始上帝告左右侍眞曰吾說此戒是衆生城郭依棲屋宅能受持男女常有玉童玉女金剛力士十天善神常侍衛左右消災度戹保命延生神仙敬仰神明護門刀兵水火虎狼毒蛇疾病牢獄鬼賊邪精飢寒苦難一切災禍不干求男得男求女得女冨貴壽樂所願從心智慧聦明形容端正功德巍巍不可思議若有善心男女禮懴行道持戒修善如彼寳劔能斷一切如彼法船能度一切如彼猛火能燒一切如彼淨水能洗一切自三清以下乃至十方眞仙莫不皆持經戒也戒者防非止惡檢敕身心降伏外魔感動靈仙得福无量元始上帝告左右侍眞曰吾見下界衆生自曠劫以來受身爲人只爲慳貪嗜慾飲酒食肉啖嚼无猒長此肌膚養其膿血致生病惱彌益罪根生老病苦暑濕風寒痛癢疼酸惡風毒氣入身染體百病來侵念念无常盡夜悲泣受生禀識各各不同日夜循環萬生萬死或處胞胎洳成膿血隨即消化或居母腹不得出生生即破壞雖則分㝃子母暫殊即便死亡不可稱計或一歳兩歳乃至百年念念改張衰耗精氣頭痛壯熱萬惱相侵一生之中无少安樂者良由廣食穢濁積滿身中酒肉熏肥蒸鬱藏府惡風毒氣吹扇形骸金石化消身形不乆吾不飲不食抱道自然變化无方長生不死常說經戒開度衆生凡夫愚迷不能信受我常憂念愍痛在兹故演齋科令滅病苦又念衆生於曠劫以來存亡二世一切眷屬在世所犯一切罪業爲五道之神遊奕使者司命司録察命威神録其罪犯上奏諸天歷世纏結不能解脫衆惡備歷望返何期今日五體投地燒香懴謝乞削落九幽玉匱之函普使人天離苦解脫消无量罪獲无量福元始上帝再告左右侍眞曰下界若有奉道之流能爲水族蛟龍黿鼉魚蜃水介甲蟲建壇禮懴誦經燒香然燈懴滌水府濕居介族並乞天恩救拔咸使脫落鱗甲得返人道一切罪犯俱希解釋乃命太乙救苦天尊開洞陽之宫出瓊簡金籙天尊懿號稱揚讃歎吟詠洞章拜表拔贖普使水族魚龍離苦解脫消无量罪生无量福是故燒香歸身歸命五體投地
