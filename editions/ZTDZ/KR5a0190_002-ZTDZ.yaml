front:
  text: 太上靈寳朝天謝罪大懴卷之二露二爾時元始上帝於赤明劫初在玉清大羅天上南丹開陽上舘火鍊宫中大㑹群仙四方天帝无量天人玉童玉女持符執節燒香散花吟詠洞章旋遶天寳妙䑓龍燭鳯燈羅列照耀至尊聖德巍巍歎未聞見是時元始上帝以大威力布大祥光普照十方无量國土皆同一相表裏開通一如琉璃清瑩无礙十方大聖一切侍眞隨至尊祥光下見十方萬國九州山河大地人民苦樂地獄天堂罪福果報如在目前是時諸天神王三府靈官列班朝禮進呈天下國土人民罪福之籍一一分明並无差忒是時有玉清眞人金華眞人與㑹中一切神仙燒香跼蹐朝拜至尊今日忝預法筵面禮慈光觀聽法音開導塵迷咸使悟道實爲夙慶元始上帝告左右侍眞曰吾嘗在玉清天中下觀一切兆民積善崇福者皆有福報見有廣造經像立觀度人布施齋戒濟生度死普救一切者生天王國主身供養三寳燒香然燈誦經禮拜廣建福田救災拔難者生皇后國母身信樂經法持齋念道布施貧乏者生冨貴聦明身常行慈悲濟生度死崇奉三寳燒香不怠者生清淨出家身信奉修行供養星辰者生長命清淨端正身成就宫觀建立靈壇者生大冨貴聦明身布施救貧成就功德無所悋惜者生天人中身不殺不盗不嫉不害者生長命具足身供養三寳憐念一切慈悲於物者生高上豪貴身子孫昌盛長命冨貴者從供養天尊大道星辰中來夫妻和睦男女柔順者從不隔恩愛中來在處得人敬仰甘膳美衣者從敬奉天地禮信三寳中來見世尊勝豪貴人見畏懼者從敬信三寳中來出家法身爲人敬奉者從說法教化中來冨貴巍巍永劫不衰者從布施成就功德中來身心清淨智慧明了者從護持經法中來所居快樂無諸災厄者從放生救物不害衆生中來子孫豐足冨貴長壽者從廣行布施求福中來女人降生貴子夫婦常敬愛者從道場教化信心中來形容端正笑語柔和衆人恭敬者從供養三寳持奉經戒中來巳上福報皆生世祖禰隂德種植致得今身之報或一身積善致使宿命善因得福无量元始上帝再謂左右神仙曰吾見毀壞天尊星辰大道形像者死入九幽地獄酆都考罰萬劫方生病癩百蟲啖噬臭穢身訾毀三洞經籙法典攺換品帙者死入地獄考罰百劫方生野獸舌根爛壞身誹謗出家法身者見世蟲癩過去生六畜身破壞宫觀靈壇毀拆眞舘者見世眉鬚墮落身體爛壞過去生毒蛇餓虎身不敬天尊大道星辰者見世愚癡憨疾過去生六畜鳥獸身不信經法宿命報對者見世爲奴婢過去生蠻夷虜狄身輕慢出家法身穢汙三寳福地者見世跛躄過去生猪狗身婬犯出家陵辱法師者見世形容腥臭過去生糞穢厠溷毒蟲身邪婬好色不别尊卑者見世風邪過去生六畜猪羊牛馬身偷盜常住財物及四輩信施衣帛者過去生顚狂愚癡身偷盜三寳花果蔬菜齋食者見世得消渇飢病過去生餓虎毒蛇身偷盗齋醮供養法食者見世逢霹靂惡鬼殺害過去生蟒蛇毒蟲身又生餓狗毒猲身罵詈出家法身惡言陵辱者見世得風癎惡疾過去生狂狗猛獸身破齋犯戒者見世遭逢牢獄過去生蠅蛆螻蟻身殺害衆生恣心宰殺者見世得短命疾病牢獄考決身食肉貪殺六畜者見世百病困苦過去生麋鹿野獸身嗜酒過度好食葷辛臭穢者見世風狂猛火焚燒過去生猿猴身死入地獄鑊湯中又見一切衆生見世手脚斷壞拳縮跛足者從不敬三寳星辰中來两眼雙盲舌根爛壞者從毀訾經教輕忽三寳中來瘖啞不能言語鼻塞不聞香臭者從誑說出家不信經法中來眉毛堕落唇攐舌露鼻梁崩倒者從破壞道場誹謗三寳中來顛狂迷妄形容醜陋者從嗊嗃傲慢非笑出家法身中來劫賊相逢傷害財物者從劫奪三寳常住財物中來水溺漂沉魚龍傷害者從損壞三寳常住中來火燒灼爛毒蛇吞噬者從殺害出家毀拆觀舍中來毒蟲入口吐血穢汙者從惡口呪詛呌喚鬼神中來毒蟲入孔竅食啖虎狼猛獸傷害者從隂謀毒害欺心中來父母妻子離隔常不同居晝夜相罵者從嫉妬姦婬破人和合離人骨肉中來媅婬不避親䟽好醜者從猪狗六畜中來嗜肉好殺嗜酒猖狂者從魚鼈蝦蟆毒蟲猛獸中來身體穢汙不淨臭穢者從科蚪毒蟲中來牛馬六畜者從殺生負諱抵債中來野獸麞鹿蝮蝎蟒蛇者從嫉妬毒害隂謀中來餓虎豺狼者從欺陵劫奪殺傷中來厠溷穢蟲蝦蟆科蚪螻蟻者從輕褻三寳不生敬信中來猘犬野猪魚鼈恠蟲者從背師棄本違犯經教中來燕雀鳩鴿者從評論經法自作口業中來鷹鸇鷙鳥者從犯觸出家破毀經教中來堕子落胎腹大項細者從非笑三寳傲誕出家中來牢獄枷鎻考掠切身者從諂毒阿黨殘虐貧下中來鞭棓楚撻枷鎻牢獄者從毒害貪虐中來猫犬野豻豺狼狐貉者從貪悋虚誕矯詐中來䑕鼬蜈蚣蚰蜒生身者從隂毒妬害中來蜂蠆蠍毒蝘蜓蜥蜴者從呪詛出家欺忽三寳中來蜘蛛曲蟮蚊蝱蚤蝨者從慢法輕道笑謗經籍中來邊夷下賤秃頭斷髮眼深鼻長身體腥穢者從殺生邪婬不信因縁中來元始天尊告左右侍眞曰巳上罪業死經地獄受諸考罰歴劫受罪方得此身亦有見世業報生身所犯業報因縁一一明示各須澄心懴悔獲福无量元始天尊再告左右侍眞曰下界若有奉道信心男女發無上誠心爲皇后貴妃七廟天宗歴世貴族建三清寳座五帝星壇掛旛獻花百珍異果然香㸃燈大醮星辰拔贖䰟儀者吾遣太乙救苦天尊開朱陵之闕丹簡紫籙出天尊懿號讃歎稱揚吟詠洞章解釋九幽滯𩲸宿業釋散五道開通逍遥无爲超生福果一切罪犯並得消除是故燒香歸身歸命五體投地志心朝禮
