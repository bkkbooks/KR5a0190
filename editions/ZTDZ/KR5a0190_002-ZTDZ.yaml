body:
  text: 玉清聖境虚无自然元始天尊上清眞境太上道君靈寳天尊太清仙境太上老君道德天尊太上昊天至尊金闕玉皇上帝南極星主紫微上宫天皇上帝中天星主紫微中宫北極大帝承天效法厚德光大后土皇地祇南極長生大帝統天元聖天尊東極青華大帝太乙救苦天尊貞明大聖九天應元雷聲普化天尊九天雷柤大帝除災濟物天尊紫微碧玉宫太一大天帝保制劫運天尊六天洞淵大帝伏魔上上太一天尊六波天主帝君普施法潤天尊九天可韓司丈人朱陵度命天尊九天採訪使應元保運妙化天尊東方九炁天中青靈始老洞空天尊南方三炁天中丹靈眞老洞清天尊西方七炁天中皓靈皇老洞虚天尊北方五炁天中五靈玄老洞微天尊中央一炁天中玄靈元老洞眞天尊志心朝禮南方玄眞萬福天尊志心朝禮湛寂法雲天尊志心朝禮智力方便天尊志心朝禮東華開化天尊志心朝禮三天獨尊天尊志心朝禮太清道成天尊志心朝禮朱玄妙道天尊志心朝禮恵遍道運天尊志心朝禮敷恩丹景天尊志心朝禮太清五帝天尊志心朝禮眞戒寳敷天尊志心朝禮應明髙運天尊志心朝禮愛樂大洞天尊志心朝禮玄廣道運天尊志心朝禮天皇上帝天尊志心朝禮法性徧開天尊志心朝禮遍悟上元天尊志心朝禮道運神開天尊志心朝禮凝彩神暎天尊志心朝禮無爲應妙天尊志心朝禮救苦慈航天尊志心朝禮神道妙運天尊志心朝禮玄範法通天尊志心朝禮至德寳明天尊志心朝禮常開光明天尊志心朝禮鏡心妙光天尊志心朝禮浮雲法王天尊志心朝禮開慈靈廣天尊志心朝禮璚琚法寳天尊志心朝禮玄道明文天尊志心朝禮萬運徧道天尊志心朝禮眞人仙暎天尊志心朝禮眞尊仙道天尊志心朝禮玉山紫館天尊志心朝禮常行運明天尊志心朝禮无滯至眞天尊志心朝禮言成眞道天尊志心朝禮上道明照天尊志心朝禮清源大願天尊志心朝禮等觀重玄天尊志心朝禮不二至性天尊志心朝禮明徧慧道天尊志心朝禮果成虚無天尊志心朝禮道運慧空天尊志心朝禮玄通妙達天尊志心朝禮南極寳輪天尊志心朝禮眞空眞寂天尊志心朝禮化被无際天尊志心朝禮運明神行天尊志心朝禮太清七寳天尊志心朝禮開清護生天尊志心朝禮金明極縁天尊志心朝禮靜定德重天尊志心朝禮玉帝太玄天尊志心朝禮无礙等眞天尊志心朝禮三界寂然天尊志心朝禮解脫照空天尊志心朝禮救物應念天尊志心朝禮明響眞道天尊志心朝禮湛然三元天尊志心朝禮空洞无礙天尊志心朝禮霞煥上宫天尊志心朝禮法寳靈顔天尊志心朝禮金神玉寳天尊志心朝禮太清洞視天尊志心朝禮煥明丹天天尊志心朝禮妙金光素天尊志心朝禮七暎北元天尊志心朝禮正眞戒生天尊志心朝禮上仙延筭天尊志心朝禮中宫大行天尊志心朝禮響明上道天尊志心朝禮大行西靈天尊志心朝禮廣訓仙靈天尊志心朝禮重悟紫清天尊志心朝禮垂範玉清天尊志心朝禮晨極天皇天尊志心朝禮大慧玄明天尊志心朝禮丹光決定天尊志心朝禮德解上元天尊志心朝禮玄輝仙德天尊志心朝禮譬喻方便天尊志心朝禮紫清普果天尊志心朝禮護生開霞天尊志心朝禮寂然化虚天尊志心朝禮空清諸有天尊志心朝禮明響神道天尊志心朝禮玄㑹冥感天尊志心朝禮黃光運明天尊志心朝禮度脫眞品天尊志心朝禮慧道照明天尊志心朝禮隨願徃生天尊志心朝禮慈悲救苦眞人志心朝禮慈悲救度眞人志心朝禮慈悲大恵眞人志心朝禮慈觀眞人志心朝禮等救眞人志心朝禮慧空眞人志心朝禮寳相眞人志心朝禮玄覺眞人志心朝禮空朗眞人志心朝禮等相眞人志心朝禮慈朗眞人志心朝禮曜靈眞人志心朝禮清定天師志心朝禮定邪天師志心朝禮収鬼天師志心朝禮制魔天師志心朝禮斬邪天師志心朝禮啓天天師元始上帝告諸天神王曰吾今以此經遣金華眞人齎徃下方散布十方三界使一切人民轉誦或有奉道之民清信男女遇本命生日爲皇后貴妃太子天親大醮天地日月星辰名山洞府得道神仙詠誦天尊眞人天師名號者即有十天善神營護修奉之民上奏天府永消世戹長沐天恩鎭居鳯閣日奉伏明功德巍巍獲福无量志心朝禮太白山眞德洞天仙官西山天寳極眞洞天仙官大潙山好生玄上洞天仙官灊山天柱司玄洞天仙官鬼谷山太玄司眞洞天仙官武夷山昇眞元化洞天仙官玉笥山太秀法樂洞天仙官華蓋山容城大玉洞天仙官蓋竹山長曜寳元洞天仙官都嶠山寳玄洞天仙官白石山瓊秀長眞洞天仙官句漏山玉闕寳圭洞天仙官九嶷山朝眞太虚洞天仙官洞陽山洞陽永觀洞天仙官幕阜山洞眞太玄洞天仙官大酉山大酉華妙洞天仙官金庭山金庭崇妙洞天仙官元始上帝再告左右侍眞曰吾今以此經散布萬國九州徧使人天禮念迎祥集福保命延生若有善信男女遇三元八節燒香轉禮三清寳號金華眞人名位上願皇后貴妃太子天親禮拜供養集福延生永光寳曆世世不絶長居紫庭沖妙先生燒香朝謝金闕上帝而獻頌曰西靈聖母貴曵瓊琚鸞臺鳯閤宻從宸輿虹光貫斗月瑩太虚穆清官禁永鎭天居太上靈寳朝天謝罪大懴卷之二
