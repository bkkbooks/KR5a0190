body:
  text: 太上靈寳朝天謝罪大懴卷之四露四爾時元始上帝在大羅天上玉京金闕紫微天䑓大㑹群仙敷演妙法救度天人咸使悟道不歷諸苦施大威德放大光明普照萬國一切罪福俱在目前甚深微妙方便開度一切地獄窮䰟苦毒无量痛楚難言並蒙恩救拔不溺沉淪咸得超度是時元始上帝慈悲廣洽更開要道使過去未來俱霑利益再告左右侍眞曰人之禀生同資一氣及乎誕育命係三元壽夭吉凶冨貴貧賤因縁罪福善惡生死各逐宿命根源悉有報應隨其業力永不差移如影隨形似聲應響上元正月十五日天曹天官主録百司上詣天闕進呈世人罪福之籍七月十五日中元地官主録百司上詣天闕進呈世人罪福之籍十月十五日下元水官水府百司上詣天闕進呈世人罪福之籍三元之日與三界十方四司五帝善惡童子一切靈官上朝金闕元始座前考校男女生死之籍罪福因縁及九幽地獄水府窮䰟姓名黒簿此時若有善信男女䏻發自然道意建造紫微寳䑓玉京寳山樓閣䑓榭百寳莊嚴香花供養燒香行道吟詠洞章然燈放生歩虚法事布施發願謝過上章大建齋醮䖍告天地晝夜不怠者吾當遣十天眞人諸天神仙三界四司救苦靈童下降人間齊到道場爲其滅罪保佑生人使國土安寧男女歡泰衆善齊降諸惡不生地獄苦䰟一時解脫克生天上快樂无爲率土太平功德巍巍獲福无量元始上帝再告左右侍眞曰吾見十方无極世界十方天王造三十二層天䑓寳盤悉以紫金珠玉錦縠紫網寳蓋紫節旌幢百花飲食器物百珍仙樂摇曳徧滿虚空來詣道場羅列供養爾時天尊以神通威力變此㑹中國土悉是琉璃洞徹内外皆同一色逺近平等不殊三界十方同霑福慶喜樂難言九幽罷對五苦停酸國土安寧人民長壽元始上帝再告左右侍眞曰下界若有善信男女請道士法師常於三元節日宣說經戒罪福因縁懴悔自己受身不淨臭穢四大浮脆假合念念無常三業六根搆造諸惡漸染成愆輪廻生死堕落三塗九幽地獄受諸苦惱吞火食炭鑊湯煎煮足履刀山手攀劔𣗳磑磨碓擣鋸解錐劖鐵鳥啄聙鐵犁畊舌牛頭亂拷鐵杖負身膿血流離身體爛壞沉淪黒闇流轉泥犁負石塡河晝夜拷掠一入酆都地獄萬劫難原皆是衆生業力自受若有善信男女能發善心爲七世祖禰及見存已身父母骨肉五苦三塗窮䰟餓鬼畜生囚徒老病衆生造玉京髙座紫微天䑓掛旛獻花百珍供養醮謝星宿拜表上章禮懴燒香滅諸罪源咸皆超度元始天尊告左右侍眞曰若有善信男女於三元節日爲一切人天建造齋醮轉經禮懴供養天尊神仙列曜星宿地府百司爲祖考父母發片善心精誠不退過去未來三世父母獲福无量滅諸罪犯元始上帝告左右侍眞曰吾見下土兆民多有凶禍邪鬼所害可爲先亡祖考父母尊親五臘之日是天地開赦冝建齋行道禮懴上章救拔先祖咸得超度獲福无量正月一日天臘之日五帝神仙集於青天安寳華林青靈闕中校定世人罪福之籍五月五日地臘之日五帝神仙集於丹天梵寳昌陽丹靈朱闕校定世人罪福之籍七月七日道德臘之日五帝神仙集於金門素靈闕中校定世人罪福之籍十月一日民歳臘之日五帝神仙集於玄天洞隂黒靈闕中校定世人罪福之籍十二月遇臘日是王侯臘之日此日五方五帝集於玄都玉京元靈戊已金闕元始上帝八景殿中校定世人罪福之籍此五臘日皆是天地合攅之日定吉凶死生簿籍若有男女爲過去先祖父母禮懴上表謝罪滅除黒簿罪目升度七祖父母入名上清皆得超度夫五臘日者皆生人九祖父母幽嶽鬼䰟此日爲酆都北隂大帝引出責問乆處隂司年代積罪結釁端由及子孫姓名墳墓所在如積劫未有追贖因此日延累生人引問得子孫親姻九族姓名爲生人罪狀積釁幽司九族延滅此日可爲先祖亡過父母上表懴謝宿愆追拔幽塗皆亡人一一得之常日祭祀不可得達爲酆都幽深難爲通徹沐頼眞猷皆得宿愆解釋幽司不欲乆滯死䰟乆滯則天曹責及幽司官吏亦責及生人轉福爲禍災難自此而生若有至孝男女此日修奉齋醮即黒簿除名獲福无量皆得超度元始上帝告左右侍眞曰下界衆生識見不同習惡造善根基各異今說要言各冝信奉若衆生好殺害損傷者即以慈悲門攝之若偷盗劫奪財物者即以分義門攝之若邪婬放蕩者即以貞潔門攝之若慳貪悋惜者即以布施門攝之若瞋怒鬬爭者即以歡喜門攝之若愚癡顚倒者即以方便門攝之若綺言浮華者即以簡正門攝之若妄語虚誑者即以信順門攝之若惡口呪詛者即以誦念門攝之若兩舌惡罵者即以讃歎門攝之若飲酒食肉過度者即以齋戒門攝之若誹謗訾毀者即以講說門攝之若倨傲輕慢者即以禮拜門攝之若剛彊豪健者即以柔弱門攝之若不信罪福宿命者即以因縁門攝之若執繫有无者即以中道門攝之若是非彼我者即以平等門攝之若貪濁穢汙者即以清淨門攝之若堅固不移者即以輪轉門攝之若造作不休者即以无爲門攝之若𡱈守不變者即以圓轉門攝之若躁競不安者即以靜定門攝之若煩惱不釋者即以解脫門攝之若憂悲不樂者即以逍遥門攝之以此二十四門常攝一切衆生不亦樂乎元始上帝曰吾本以无攝爲攝勸化衆生衆生旣悟亦无攝因若能持奉獲福无量元始上帝再告左右侍眞曰下界兆庻若有清信奉道之民爲九祖先逺父毋幽䰟或於古觀靈壇或在本家淨室建三清寳座㸃七曜明燈燒香行道吟詠洞章轉禮經懴大醮諸天精誠不怠者五遣太乙救苦天尊於九炁天宫開七寳雲樓青簡金文出天尊懿號下降人間徧使人天禮念爲削落九幽長夜玉匱之函使七祖超度䰟上南宫神仙接引逍遥无爲獲福无量是故燒香歸身歸命五體投地志心朝禮玉清聖境虚无自然元始天尊上清眞境太上道君靈寳天尊太清仙境太上老君道德天尊太上昊天至尊金闕玉皇上帝南極星主紫微上宫天皇大帝中天星主紫微中宫北極大帝承天效法厚德光大后土皇地祇南極長生大帝統天元聖天尊東極青華大帝太乙救苦天尊貞明大聖九天應元雷聲普化天尊九天雷祖大帝除災濟物天尊紫微碧玉宫太一大天帝保制劫運天尊六天洞淵大帝伏魔上上太一天尊六波天主帝君普施法潤天尊九天可韓司丈人朱陵度命天尊九天採訪使應元保運妙化天尊東方九炁天中青靈始老洞空天尊南方三炁天中丹靈眞老洞清天尊西方七炁天中皓靈皇老洞虚天尊北方五炁天中五靈玄老洞微天尊中央一炁天中玄靈元老洞眞天尊志心朝禮北方玄上玉宸天尊志心朝禮玄明眞仙天尊志心朝禮玄㑹慈恩天尊志心朝禮朱光妙果天尊志心朝禮妙果四極天尊志心朝禮无礙十華天尊志心朝禮運明靜行天尊志心朝禮運明眞文天尊志心朝禮妙果正因天尊志心朝禮黄道運明天尊志心朝禮法海寳福天尊志心朝禮運明太虚天尊志心朝禮萬行靜定天尊志心朝禮金相凝神天尊志心朝禮靈融應體天尊志心朝禮上運智道天尊志心朝禮靈眞丹天天尊志心朝禮運明妙空天尊志心朝禮元一天皇天尊志心朝禮无等開元天尊志心朝禮至道智明天尊志心朝禮齊物高勝天尊志心朝禮清響无等天尊志心朝禮靈顔妙光天尊志心朝禮上靈光照天尊志心朝禮明廣慧道天尊志心朝禮拔苦慈解天尊志心朝禮四宫眞境天尊志心朝禮大洞體玄天尊志心朝禮洞玄開度天尊志心朝禮金光妙湛天尊志心朝禮結成騫林天尊志心朝禮雲宫法燈天尊志心朝禮至玄運道天尊志心朝禮慧光三天天尊志心朝禮自然流鈴天尊志心朝禮靜明玉帝天尊志心朝禮普朗業行天尊志心朝禮丹霍法成天尊志心朝禮寳林一乗天尊志心朝禮應㑹開闡天尊志心朝禮隨方傳法天尊志心朝禮中千常一天尊志心朝禮道運眞空天尊志心朝禮上天妙嚴天尊志心朝禮長樂丹元天尊志心朝禮救生萬化天尊志心朝禮文眞廣運天尊志心朝禮地皇神尊天尊志心朝禮皓素无等天尊志心朝禮華景一乗天尊志心朝禮正一三天天尊志心朝禮玉宫雲營天尊志心朝禮延壽慧眞天尊志心朝禮重玄德眞天尊志心朝禮流慈自然天尊志心朝禮七暎妙光天尊志心朝禮太洞七元天尊志心朝禮上洞朱極天尊志心朝禮雲宫平等天尊志心朝禮道運光空天尊志心朝禮妙寳金縁天尊志心朝禮妙善眞濟天尊志心朝禮丹紫无爲天尊志心朝禮大運化道天尊志心朝禮紫極中華天尊志心朝禮延壽仙靈天尊志心朝禮法海瓊音天尊志心朝禮妙玄北眞天尊志心朝禮眞觀神眞天尊志心朝禮妙玄道運天尊志心朝禮西明感化天尊志心朝禮期度仙道天尊志心朝禮廣明大道天尊志心朝禮開度解脫天尊志心朝禮仙靈普朗天尊志心朝禮朱宫妙樂天尊志心朝禮救生空觀天尊志心朝禮明智玄道天尊志心朝禮果成仙道天尊志心朝禮徧道上運天尊志心朝禮方便冥感天尊志心朝禮仙眞南極天尊志心朝禮玄通長樂天尊志心朝禮正眞法成天尊志心朝禮一切常度天尊志心朝禮无爲丹元天尊志心朝禮寳明大度天尊志心朝禮朱因髙尊天尊志心朝禮无等清響天尊志心朝禮化成仙道天尊志心朝禮運明妙照天尊志心朝禮戒生明行天尊志心朝禮上道運明天尊志心朝禮妙果朱素天尊志心朝禮寂然紫度天尊志心朝禮金剛妙彩天尊志心朝禮拔苦慈恩天尊志心朝禮眞空二炁天尊志心朝禮度戹應變天尊志心朝禮九幽拔罪天尊志心朝禮隨願徃生天尊志心朝禮慈悲救苦眞人志心朝禮慈悲救度眞人志心朝禮慈悲大惠眞人志心朝禮明皇眞人志心朝禮照理眞人志心朝禮普度眞人志心朝禮至極眞人志心朝禮普救眞人志心朝禮慈覺眞人志心朝禮玉䑓眞人志心朝禮金玄眞人志心朝禮妙玄眞人志心朝禮自在眞人志心朝禮變化天師志心朝禮神妙天師志心朝禮皇上天師志心朝禮萬福天師志心朝禮太極天師志心朝禮玉晨天師元始上帝告諸神仙曰吾今降此天尊眞人天師位號遣太清眞人齎徃下方散布萬國九州一切人天轉誦若有善信男女臻道之人毎遇八節三元生辰本命轉禮經懴醮謝天地爲三軍萬姓一切含生燒香朝謝使門戸昌隆世世榮盛子孫聦慧壽禄延永功德巍巍永消世戹志心朝禮東海廣德之神龍宫官屬南海洪聖廣利之神龍宫官屬西海廣潤之神龍宫官屬北海廣澤之神龍宫官屬江瀆廣源之神龍宫官屬河瀆靈源之神龍宫官屬淮瀆長源之神龍宫官屬濟瀆清源之神龍宫官屬淛江水府之神龍宫官屬呉江水府之神龍宫官屬楚江水府之神龍宫官屬荆江水府之神龍宫官屬揚子江水府之神龍宫官屬湘江水府之神龍宫官屬松江水府之神龍宫官屬南江水府之神龍宫官屬漢江水府之神龍宫官屬元始上帝再告左右侍眞曰吾今降下此經散布十方世界徧使人天禮念獲生生福滅世世罪所求皆遂所願皆成世間若有奉道之民善信之家毎遇本命生日八節三元燒香禮誦大建齋醮諷詠三清寳號眞人名位上願三公輔弼將相寀寮拜表上章迎祥集福永臻冨貴長保遐齡冲妙先生燒香朝謝金闕上帝而獻頌曰天生明哲來賛昌期氷稜玉峭鳯質鸞姿爕調元化力賛雍熈農歌緑野兵戢四夷長臻五福永集天褀太上靈寳朝天謝罪大懴卷之四
