body:
  text: 太上靈寳朝天謝罪大懴卷之三露三爾時元始上帝在无上大羅天中玉京金闕之内坐天寳妙䑓與太上玉晨道君太上聖祖太清老君大集群仙敷揚妙法講演經戒是時諸天大聖一切衆眞燒香散花持旙執節吟詠洞章歩虚讃歎功德巍巍未聞未見今日得詣寳軒列班侍立恭聽法音願賜開度是時元始上帝告左右侍眞曰吾以威光普照无極世界下土兆民一切群生愚癡暗昧沉迷世網媅滯六慾不能自覺常處苦惱流浪生死並不開悟若有善信男女能發无上道意爲一切衆生立三清寳座五帝靈壇掛旙獻花燒香朝禮轉念經懴爲先祖宗親亡過父母妻子眷屬滅除罪犯使身心清淨常味靈音不堕惡道常行信奉懴謝前生今世舉心運心生不信奉心誹謗三寳毀壞三寳穢汙三寳戲弄三寳罵詈三寳呪詛三寳欺忽三寳傲誕三寳嗊嗃三寳訾毀經籙評論眞僞攺易妄言强辯是非分别深淺言議短長形容不淨衣服不淨手脚不淨口氣不淨飲酒食肉啖嚼葷辛口出穢言心不恭敬或不淨手或不燒香或不漱口或不沐浴即入靈壇觸犯尊像穢辱眞聖神仙天王力士玉女金童直壇靈官或對三清至眞經法出家法師生不恭敬形容傲誕不肯信奉或乗車馬直入宫觀靈壇逼近尊像狼藉福地或見持齋受戒永不信奉或見禮經齋醮即便破亂以爲妖妄或入道場法席高聲大語惱觸法衆或發言舉意道說是非較量眞僞或倚恃三寳方便求財或假法教化誑惑百姓或費用三寳財物以養已身或恐愶出家求其長短以取財物養育妻子諸如上罪无量元邊今日發露心誠朝謝天地三寳星辰爲光祖父母見存眷屬起懇首陳乞滅除罪犯内外清淨咸獲超度元始上帝再告左右侍眞曰吾傷下土兆民見存在世三業六根罪業深重長行殺戮行諸苦酷不念慈心殺害群毛食啖六畜或爲父母及已身兄弟妻兒延諸親族衆集郷閭傷害衆生不計頭數或殺牛羊驢馬猪狗雞豚依人養牧芻豢之屬或殺麞鹿狐兔虎豹豺狼依泊山林野獸之屬或殺鵞鴨烏鵲鳩鴿鴟鳶鳬鶩鵁鶄飛禽之屬或殺蟲蛇虺蠍蜂蠆蚰蜒蜈蚣蜙蝑螻蟻之屬或殺黿鼉魚鼈螺蚌蝦蟇螯蟹蟛蜞水蟲之屬或殺𧏙蜋蠛蠓蝜蟠螟蛉蠍蠋丘蚓小蟲之屬或殺蚊蝱蚤蝨蜉蝣蠌蝝𧍒蝡蛸翹化生之屬或飛鷹走犬張羅布網殺害衆生或放火燒山窮林竭澤殺害衆生或持弓矢刀杖殺害衆生或手揉足踏坐按卧捺殺害衆生或畊田種作打墻立壁殺害衆生或竪造舍宇穿坑出土拆籬作障殺害衆生或剖胎破卵熱湯潑地殺害衆生或對經像靈壇宫觀殺害衆生或禱祀鬼神或爲嗔怒殺害衆生或命絶手中或身亡刀下或斷其頭足或剥裂皮毛或猛火煎燒或沸湯燖煮或生分子母斷其胎育或固絶命根令其磨滅或殺賢人道士或殺老弱女男或殺債主𡨚家或殺四方良善或恐殺怖殺毒藥殺呪殺罵殺或自殺教殺諸如上殺舉手動身殺害無數无量无邊罪業深重不忍聽聞今日若有奉道男女傾心露懇朝天禮謝拜表上章大醮三官放生續命布施財寳救濟孤貧燒香行道吟詠洞章歩虚禮懴爲七世祖禰亡過父母一切宗親懴滌罪犯攺惡修善洗滌身心所求皆遂所望皆成所救宗親咸得超度神仙接引逍遥無爲名上南宫得歸人道獲福无量元始上帝再告左右侍眞曰下界若有清信奉道之民或爲水族介蟲蛟龍魚鼈蝦螺蚌蛤濕居毒獸一切魚龍建三清寳座五帝靈壇燒香然燈上章拜表懴謝水居業重之罪者吾遣太一救苦天尊於雲樓青簡金文寳藏出天尊懿號徧使人天稱揚讃歎吟詠洞章思神念道乞削落明眞九幽長夜之函使一切水族介蟲離苦解脫滅无量罪咸獲超度是故燒香歸身歸命五體投地志心朝禮玉清聖境虚无自然元始天尊上清眞境太上道君靈寳天尊太清仙境太上老君道德天尊太上昊天至尊金闕玉皇上帝南極星主紫微上宫天皇大帝中天星主紫微中宫北極大帝承天效法厚德光大后土皇地祇南極長生大帝統天元聖天尊東極青華大帝太乙救苦天尊貞明大聖九天應元雷聲普化天尊九天雷祖大帝除災濟物天尊紫微碧玉宫太一大天帝保制劫運天尊六天洞淵大帝伏魔上上太一天尊六波天主帝君普施法潤天尊九天可韓司丈人朱陵度命天尊九天採訪使應元保運妙化天尊東方九炁天中青靈始老洞空天尊南方三炁天中丹靈眞老洞清天尊西方七炁天中皓靈黃老洞虚天尊北方五炁天中五靈玄老洞微天尊中央一炁天中玄靈元老洞眞天尊志心朝禮西方太妙至極天尊志心朝禮行明上道天尊志心朝禮蕭然紫桂天尊志心朝禮凝尊金容天尊志心朝禮凝光金洞天尊志心朝禮三光神耀天尊志心朝禮紫清九仙天尊志心朝禮天中大行天尊志心朝禮廣運道空天尊志心朝禮上眞道運天尊志心朝禮仙道運度天尊志心朝禮朱光重玄天尊志心朝禮大廣運明天尊志心朝禮隨順世間天尊志心朝禮玄寂一乗天尊志心朝禮金殿妙尊天尊志心朝禮逍遥三乗天尊志心朝禮觀行仙靈天尊志心朝禮飛天法王天尊志心朝禮清元訓廣天尊志心朝禮太和一乗天尊志心朝禮眞運明行天尊志心朝禮金慈玉寳天尊志心朝禮開明解智天尊志心朝禮解脫重玄天尊志心朝禮最勝空明天尊志心朝禮解脫暉光天尊志心朝禮戒生法王天尊志心朝禮妙寳金城天尊志心朝禮寂然太眞天尊志心朝禮洞元萬果天尊志心朝禮素王妙樂天尊志心朝禮玄應洞聽天尊志心朝禮普慈光暎天尊志心朝禮天仙无礙天尊志心朝禮眞覺仙靈天尊志心朝禮徧悟玄㑹天尊志心朝禮善果隨受天尊志心朝禮妙勝重玄天尊志心朝禮妙道明光天尊志心朝禮凝寂金寳天尊志心朝禮因縁无隱天尊志心朝禮光明髙運天尊志心朝禮大乗无爲天