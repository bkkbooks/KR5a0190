body:
  text: 太上靈寶朝天謝罪法懴卷六爾時元始上帝在大羅天宮黃金殿內七寶幃中大顯威神祥光輝爍照曜天地眞仙侍衛無鞅數眾建節捧香羅列左右步虛旋繞譛歎至尊時見天仙地仙水仙各整威儀上朝金闕進呈萬國九洲兆民生死罪福之目姓名功過毫分不失是時元始上帝謂左右侍眞曰吾觀一切有情皆是虛假念念滅壞曾不暫停苦惱輪迴凡夫不覺三途往返萬刼辛酸受身生身煩惱纒縛皆由妄想顚倒執見關心生死存亡不能自出甚可哀傷是時法會中有金華眞人廣福眞人端簡整佩出班燒香朝拜金闕上帝臣等積善深厚位列玉清得侍左右恭聽法音開示羣品今見下方一切眾生不顧宿命不遵經法是非爭競六識昏迷五毒縈心造業之時無所畏懼或呌鬼神以爲救助或上指三光七祖以爲盟誓六親相殘傷殺無道臨命終時戀其室宅財寶愛惜本身顧憐妻女心迫情切或發惡願債主𡨚家俱在目前沉淪五道無由解脫伏願天慈大開恩宥救度羣淪出離幽冥咸使悟道是時元始上帝告侍眞曰吾觀下界眾生妄想顚倒皆從心起强生分别繫念在心觸境生迷舉心皆妄當自定志智慧觀身骨肉肌膚形體毛髮六根四大五臟百神諦想思惟總無實處共相假合結聚成身表裏㝷求我在何處身旣是假心卽成空空假非眞悉爲妄想是非憎愛貪著色聲香味觸法嫉妬慳貪殺盗邪淫綺言惡罵凡諸作業泯爾皆除內外清虛自悟眞道元始上帝告侍眞曰汝等定智觀身總無實處人之執見者爲六根三業未淨一曰眼根二曰耳根三曰鼻根四曰舌根五曰身根六曰意根夫六根者能生諸業猶如草木生諸花葉子實展轉六情六賊六慾能生諸業若能用智慧思惟六根諸業皆盡夫三業者一者身業二者心業三者口業身則殺盗邪淫心則慳貪瞋怒口則綺言妄語惡口兩舌共成十惡諦思十惡悉是浮虛但自三業六根漸自除滅損之又損久能行之眞道悟自元始上帝告左右侍眞曰吾念下界眾生厯刼以來運心起意多有虛妄並不眞湻多有綺言或於天尊聖像前行諸綺言或於經法道塲前行諸綺言或於父母尊親前行諸綺言或於賢人長者前行諸綺言或於豪貴長者前行諸綺言或於聰明識解前行諸綺言或於諸天聖眾日月星辰前舉心皆行綺言其罪深重今日恭對三寶壇前懴謝咸乞蕩除吾念眾生立身運心綺言妄語惡口兩舌嫉妬勝巳鬪亂是非離人骨肉反虛成實轉僞爲眞今日懴悔皆令清凈得入信根元始上帝告左右侍眞曰吾觀下界眾生立身以來眼耳鼻舌起意造惡殺生偷盗邪淫放蕩慳貪瞋怒愚癡顚倒綺言妄語惡口兩舌嫉妬勝巳飲酒食肉違犯三光背眞向僞信邪倒見禱祀鬼神不奉三寶訾毁嗊嗃輕慢傲誕媅滯色慾染習香味沉迷觸法內造外作展轉相生六根互起更相成愆罪根增長念念成非有無量罪數結習來久總在身中不可稱計一發念心皆得清凈猶如明鑑塵埃䝉蔽脂垢積聚生翳內外不明一旦遇良工拂拭磨洗表裏光徹遠近洞照還復如初何以故性本清淨人生亦爾神本清凈無諸滓穢但受形之後漸染成愆六根六情六賊六慾六識分别妄作穢弊生身障翳失其眞性流浪生死動入罪根報對相纒便入地獄受諸苦惱萬刼輪轉吾以慈悲憐念眾生故從刼至刼轉輪人間或生夷夏或老或少或貴或賤種種方便敎化度脫眾生經敎流傳開悟一切使離苦惱永出泥犁但眾生智劣不能解悟我今爲汝分别罪福因緣一切眾生悉得解脫元始上帝謂眾眞曰若有下方善信男女受持此經燒香懴悔洗滌身中一切苦惱悉得清凈消無量無邉宿根惡業諸天上聖一切神仙常欲令人勤燒香懴悔則有十天善神保護眾聖護持若罪根結身內外纒縛則惡神考害疾病纒身水火刀兵毒蟲猛獸枷鎻牢獄眾苦害身凡夫惟知外飾面目衣服手足不能內洗身心罪根惡業可不愚哉若夫面目手足衣服等件勤加洗濯必得清淨値遇神仙皆獲福慶元始上帝告左右侍眞曰下方若有奉道男女於古觀靈壇或本居凈室爲先亡祖考建三清寶座五帝靈壇誦禮經懴大醮諸天吾遣太乙救苦天尊開紫微寶藏玉簡册文出天尊懿號讚歎稱揚吟咏洞章乞削落盟眞九幽玉匱之凾普使人天離苦解脫消厯刼罪獲無量福是故燒香皈身皈命五體投地人各恭敬志心朝禮玉清聖境虛無自然元始天尊上清眞境太上道君靈寶天尊太清仙境太上老君降生天尊太上昊天至尊金闕玉皇上帝上甯高道聖祖司命保生天尊南極聖主紫微上宮天皇上帝中天星主紫微中宮北極大帝承天效法厚德光太后土皇地祗應感儲祥元天大慈聖后元君南極長生大帝統天元聖天尊東極青宮大帝太乙救苦天尊眞明大聖九天應元雷聲普化天尊九天雷祖大帝除災利物天尊紫微碧玉宮太乙天帝保制刼運天尊六天洞淵大帝伏魔上上太乙天尊綠波天主帝君普施法潤天尊九天可韓司丈人朱陵度命天尊九天採訪使應元保運妙化天尊東方九炁天中青靈始老洞空天尊南方三炁天中丹靈眞老洞青天尊西方七炁天中皓靈皇老洞虛天尊北方五炁天中五靈玄老洞微天尊中央一炁天中玄靈元老洞眞天尊東南方長生保命天尊東南方好生度命天尊開㧞苦魂天尊因緣高仙天尊解悟普照天尊無名太玄天尊神化高素天尊開功保命天尊戒生紫虛天尊大聖聖王天尊大洞成清天尊結威八神天尊明眞智明天尊昇玄眞明天尊紫府仙靈天尊慧觀明仙天尊青宮妙眞天尊無礙保生天尊保命戒生天尊日生大乘天尊法華妙樂天尊流電雲宮天尊霞想凝湛天尊萬變太和天尊朱湛妙霞天尊蓋天法王天尊六覺玄通天尊太清洞眞天尊廣天妙運天尊法海寶心天尊天皇升極天尊道行眞空天尊五老梵行天尊妙虛玄通天尊寶明慧解天尊救生正眞天尊朱花妙彩天尊尊神戒生天尊權實眞一天尊重玄應感天尊慈光朱日天尊妙果素月天尊度緣應變天尊妙定三天天尊玄照幽運天尊道德眞空天尊本際上靈天尊七映北眞天尊虛玄光相天尊開明一切天尊慧眞延夀天尊寂然應玄天尊妙眞金華天尊威光凈明天尊道智洞玄天尊混成凝虛天尊雲宮青華天尊成就太玄天尊明黃道君天尊上品福慶天尊寶應仙飛天尊妙元朱光天尊仙靈普朗天尊仙道普度天尊智識玄靜天尊正觀上宮天尊大洞無量天尊智悟上京天尊照明萬方天尊明眞玉洞天尊應心普救天尊决定太清天尊護魂無滯天尊妙典寶開天尊仙梵法王天尊玄照大明天尊金暉靈寂天尊救生觀空天尊上靈金華天尊素果妙樂天尊靈寶自然天尊華明光運天尊丹元無上天尊仙靈妙寂天尊運華明智天尊光明神威天尊戒生摧魔天尊方廣運朗天尊神功通明天尊東華法丹天尊潜功隨方天尊上明普景天尊神寶寂然天尊金輿玉寶天尊大羅靈眞天尊玄運大照天尊寂然紫度天尊合成凝湛天尊徧明神道天尊金成凝寂天尊嚴凈無等天尊九幽㧞罪天尊隨願往生天尊慈悲救苦天尊大慈大悲救苦眞人大慈大悲救度眞人大慈大悲大惠眞人大慈大悲圓凈眞人大慈大悲慈救眞人大慈大悲慈照眞人大慈大悲瓊華眞人大慈大悲景玄眞人大慈大悲明空眞人大慈大悲明上眞人大慈大悲明玄眞人大慈大悲萬道眞人大慈大悲景明眞人元始上帝告左右侍眞天地水府三官一切聖眾曰吾今以此諸天尊名號下降人間遣金華眞人徧佈萬國九洲使一切人民禮誦若有清眞之士奉道之人或遇三元八節五臘十値生日忌辰爲七世幽魂先祖父母一切羣生修齋行道請道士法師步虛讚歎拜表上章禮謝天地日月星辰地府冥官水府仙哲卽有十直靈官奏上諸天䝉此功德㧞離五苦度脫三途上登朱陵府下入開光門神仙同接引萬世福長存普天皆獲慶浩刼荷天恩志心朝禮蓬萊山得道一切神仙槫桑山得道一切神仙方丈山得道一切神仙滄浪山得道一切神仙瀛洲上眞得道一切神仙祖洲上眞得道一切神仙聚窟洲上眞得道一切神仙炎洲上眞得道一切神仙鳳麟洲上眞得道一切神仙玄洲上眞得道一切神仙流洲上眞得道一切神仙長洲上眞得道一切神仙元洲上眞得道一切神仙生洲上眞得道一切神仙天下三十六靖盧仙官天下二十八治名山得道一切神仙元始上帝再吿左右侍眞曰吾今遣玉清眞人齎此經降下人間使一切眾生散佈供𠐒四時轉念上消天災下禳毒害增福無量若有積善之民遇三元八節本命忌辰爲亡過先祖父母幽魂追薦冥福燒香禮誦三清寶號諸大眞人名位願上世亡魂使所生父母一切兆民生生獲福早遇神仙身臻五福長享自然冲妙先生燒香朝謝金闕上帝而獻頌曰玉帝宣天旨普放幽夜魂八難俱解釋五道悉開通酆都絶報對上朝朱陵宮羣生悟至道永享福無窮太上靈寶朝天謝罪法懴卷六終
