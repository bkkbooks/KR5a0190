body:
  text: 太上靈寶朝天謝罪法懺卷三爾時元始上帝在無上大羅天中玉京金闕之內坐天寶妙臺與太上玉宸道君太上聖祖太淸老君大集羣仙敷揚妙法講演經戒是時諸天大聖一切眾眞燒香散花持旛執節吟咏洞章步虛讚嘆功德巍巍未聞未見今日得詣寶軒列班侍立恭聽法音願賜開度是時元始上帝吿左右侍眞曰吾以威光普照無極世界下土兆民一切羣生愚痴暗昧沉迷世網媅滯六慾不能自覺常處苦惱流浪生死併不開悟若有善男信女能發無上道意爲一切眾生立三淸寶座五帝靈壇掛旛獻花燒香朝禮轉念經懺爲祖宗親亡過父母妻子眷屬滅除罪犯使身心淸淨常昧靈音不墮惡道常行信奉懺謝前生今世舉心運心生不信奉詐謗三寶毁壞三寶穢污三寶戲弄三寶罵詈三寶咒咀三寶欺忽三寶傲誕三寶嗊嗃三寶訾毁經籙評論眞僞改意妄言强辯是非分别深淺言議短長形容不淨衣服不淨手腳不淨口氣不淨飮酒食肉啖嚼葷辛口出穢言心不恭敬或不淨手或不燒香或不潄口或不沐浴卽入靈壇觸犯尊像穢辱眞聖神仙天王力士玉童玉女眞壇靈官或對三淸至眞經法出家法師生不恭敬形容傲誕不肯佈施或乘車馬直入宮殿靈壇逼近尊像狼籍福地或見持齋受戒永不信奉或見禮懺齋醮卽便破亂以爲妖妄或見道場法席高聲大語惱諸法眾或發言舉意道說是非較量眞僞或倚恃三寶方便求財或假說教化誑語或惑百姓或費用三寶財物以養已身或恐愶出家求其長短以取財物養育妻子諸無上罪無量無邊今日發露誠心朝謝天地三寶星辰爲先祖父母見存眷屬啟懇首陳乞滅除罪犯內外淸淨咸獲超度元始上帝再吿左右侍眞曰吾見下土兆民見存眷屬三業六根罪業深重長行殺戮行諸苦酷不念慈心殺害羣毛食啖六畜或爲父母兄弟妻兒及諸親族集聚鄉閭傷害眾生不計頭數或殺猪羊驢馬猫狗鷄豚依人養牧芻豢之屬或殺麞鹿狐兎虎豹豺狼河泊山林野獸之屬或殺鷄犬鵝鴨鳥鵲鳩鴟𪀵鳬鶩鵁鶄飛禽之屬或殺蟲蛇虺蠍蜂蠆蚰蜒蜈蚣蝑螻蟻之屬或殺黿鼉魚鼈螺𧉻蝦蟇螯蠏蟛蜞水䖝之屬或殺𧏙螂蠛蠓蟠螟蛉蠍蠋蚯蚓小虫之屬或殺蚊蝱蚤蝨蜉蝤蠌䖶𧍒蝡蛸趐化生之屬或飛鷹走犬張羅布網殺害眾生或放火燒山窮林竭澤殺害眾生或持弓矢刀殺害眾生或手揉足踏坐按卧扌婪殺害眾生或耕田種作打墻立壁殺害眾生或𥪡造宅舍穿坑出土拆籬作障殺害眾生或剖胎破卵熱湯潑地殺害眾生或對聖像靈壇宮觀殺害眾生或禱祀鬼神或爲嗔怒殺害眾生或命絶手中或身亡刀下或斷其頭足或剝裂皮毛或猛火𤋎燒或沸湯燖煮或分生子母斷其胎育或固絶命根令其磨滅或殺賢人道士或殺老弱女男或殺債主𡨚家或殺四方良善或恐殺佈殺毒藥殺咒殺駡殺或自殺教殺諸如生殺舉手動身殺害無數無量無邊罪業深重不忍聽聞今日若有奉道男女傾心露懇朝天禮謝拜表上章大醮三官放生續命佈施財寶救濟貧窮燒香行道吟咏洞章步虛禮懺爲七世祖禰亡過父母一切宗親懺滌罪犯改惡崇善洗滌身心所求皆遂所望必成所救宗親咸得超度神仙接引逍遙無爲名上南宮得歸人道獲福無量元始上帝再告左右侍眞曰下界若有淸信奉道之民或爲水族介虫蛟龍魚鼈蝦螺𧉻蛤濕居毒獸一切魚龍建三淸寶座五帝靈壇燒香然燈上章拜表懺謝水居業重之罪者吾遣太乙救苦天尊於雲樓靑簡金文寶藏出天尊懿號徧使人天稱揚讚嘆吟咏洞章思神念道乞削落明眞九幽長夜之函使一切水族介虫離苦解脫滅無量罪咸獲超度是故燒香皈身皈命五體投地志心朝禮玉淸聖境虛無自然元始天尊上淸眞境太上道君靈寶天尊太淸仙境太上老君降生天尊太上昊天至尊金闕玉皇上帝上甯高道司命保生天尊大帝南極聖主紫微上宮天皇大帝中天星主紫微中宮北極大帝承天效法厚德光太后土皇地祇應感儲祥元天大慈聖后元君南極長生大帝統天元聖天尊東極靑宮大帝太乙救苦天尊眞明大聖九天應元雷聲普化天尊九天雷祖大帝除災利物天尊紫微碧玉宮太乙天帝保制刼運天尊六天洞淵大帝伏魔上上太乙天尊綠波天主帝君普施法潤天尊九天可韓司丈人朱陵度命天尊九天採訪使應元保運妙化天尊東方九炁天中靑靈始老洞空天尊南方三炁天中丹靈眞老洞淸天尊西方七炁天中皓靈皇老洞虛天尊北方五炁天中五靈玄老洞微天尊中央一炁天中玄靈元老洞眞天尊西方八卦護身天尊西方太妙至極天尊行明上道天尊蕭然紫桂天尊凝尊金容天尊凝光金洞天尊三光神耀天尊紫淸九仙天尊天中大行天尊廣運道空天尊十眞道運天尊仙道運度天尊朱光重玄天尊大廣運明天尊隨順世間天尊玄寂一乘天尊金殿妙尊天尊逍遙三乘天尊觀靈仙行天尊飛天法王天尊淸元訓度天尊太和一乘天尊眞運明行天尊金慈玉寶天尊開明解智天尊解脫重玄天尊最勝空明天尊解脫暉光天尊戒生法王天尊妙寶金成天尊寂然太眞天尊洞元萬果天尊素玉妙樂天尊玄應洞聽天尊普慧光暎天尊天仙無礙天尊眞覺仙靈天尊徧悟玄會天尊善菓隨受天尊妙勝重玄天尊妙道明光天尊凝寂金霄天尊因緣無隱天尊光明高運天尊大乘無爲天尊靑華主算天尊運明惠通天尊萬仙救生天尊金景妙寂天尊行成仙道天尊徧周六道天尊明化神運天尊上景眞空天尊妙彩朱威天尊運道丹成天尊洞元仙嚴天尊洞元萬功天尊丹質妙光天尊朱湛妙果天尊法海廣華天尊方期洞元天尊無等應感天尊運明仙慶天尊妙寂金鏡天尊三天照明天尊洞靈朱明天尊慧功普朗天尊洞靈果明天尊普度丹景天尊慧炬上靈天尊拔苦慈慧天尊妙湛金彩天尊仙道廣度天尊道運高應天尊道運眞行天尊丹元無礙天尊度人北元天尊無邊徧被天尊開化玉宮天尊妙道應明天尊至照道運天尊大梵中仙天尊神通照道天尊救生上化天尊諸天玉眞天尊金仙嶷然天尊道運萬空天尊玉華妙樂天尊增益善智天尊眞相靜明天尊雲宮重玄天尊開朗神解天尊天皇眞君天尊救生中元天尊普朗眞人天尊虛無性常天尊玄紀戒生天尊隨方自然天尊最勝方便天尊漸妙玄會天尊德解洞玄天尊洞元仙寶天尊慧炬太眞天尊神至響明天尊遍空飛駕天尊太玄寶丹天尊一切增益天尊行明高運天尊隨願往生天尊慈悲救苦天尊大慈大悲救苦眞人以下眞人名號俱冠以大慈大悲四字在上救度眞人大惠眞人景虛眞人平等眞人大慈眞人好生眞人景上眞人等曜眞人靖慧眞人智明眞人妙惠眞人明虛眞人部錄天師上奏天師除死天師定生天師保護天師普濟天師元始天尊再告左右侍眞曰吾今以此天尊眞人天師名號遣金華眞人齎往下方散布萬國九洲使一切人民懺悔朝謝或有淸信賢者每遇本命生辰燒香諷經醮謝天地洞府神仙卽有記名神王落死神王上生神王錄其功德奏上諸天金帛豐足永保安甯或爲儲君太子公主天親迎祥集慶大醮星辰獲福無量人各恭敬志心朝禮麻姑山丹霞洞天仙官仙都山玄都拆仙洞天仙官靑田山靑田大鶴洞天仙官鍾山朱湖太生洞天仙官良常山良常方會洞天仙官紫葢山紫玄洞照洞天仙官天目山太極玄葢洞天仙官桃源山白馬玄光洞天仙官金華山金華洞元洞天仙官仙都山玄都祈仙洞天仙官海上東嶽泰行山靑帝洞仙官海上南嶽長離山赤帝洞仙官海上西嶽麗農山白帝洞仙官海上北嶽廣野山黑帝洞仙官海上中嶽崑崙山黃帝洞仙官元始上帝再告左右侍眞曰吾今遣太乙眞人齎此經懺散布萬國九洲徧使人天禮念延生保命集福消災若有奉道之民遇三元八節本命生辰轉禮三淸寶號十方眞人名位者身堅體固永保長存獲福無量冲妙先生燒香朝謝禮拜謝金闕上帝而獻頌曰挺秀雍熙運日奉至尊前身居龍鳳閣名籍繼諸仙燒香謝天蔭長誦希夷篇千生臻五福名列淸微天永處逍遙境長享福自然太上靈寶朝天謝罪法懺卷三終讚元始大道金口宜揚威力祥光莫能量句句消罪殃道君上皇
