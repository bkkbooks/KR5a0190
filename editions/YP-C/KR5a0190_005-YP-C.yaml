body:
  text: 太上靈寶朝天謝罪法懺卷五爾時金闕大聖元始上帝在九淸妙境五雲天宮御寶玉座大會羣仙敷演眞一妙法廣度眾生咸使超悟是時太上老君與諸天大聖妙行眞人九天上眞四司五帝一切神仙皆駕五色璚輪八景翠輿飛雲寶葢十絶靈旛龍旂鳳葆燒香散花遊空步虛吟咏洞章旋繞刼仭寶臺朝讚齊唱元始上帝咸皆欣慶是時至尊以大威德放七寶神光照耀太空下及無極世界九幽長夜地獄善惡報應一一皆見於是東方九炁天君侍眞靈官上朝金闕於是南方三炁天君侍眞靈官上朝金闕於是西方七炁天君侍眞靈官上朝金闕於是北方五炁天君侍眞靈官上朝金闕於是中央一炁天君侍眞靈官上朝金闕列班焚香進呈天下兆民生死罪福之籍須臾萬變宮殿臺榭皆悉水精琉璃珊瑚琥珀雕琢裝嚴麒麟獅子備衞左右各赴寶座講說酆都地獄生死之籍忽聞地獄死魂受對拷罰痛聲號絶又見死魂無托冥闇之中鬼官不錄是時五帝上問此輩罪人是何業報受拷痛切難忍伏願天慈特垂救度元始上帝謂帝君曰下元生人死魂受拷爲前生不忠不孝君臣不義父子不慈不敬三光不信罪福欺師謗道返逆宗親廣殺物命縱姿貪淫司命奪算夀無定年死魂報對刼盡無解此人爲前生啖酒嗜肉殺戮無度不造善功專行不道年算未盡被六天洞宮鬼神乘人罪釁放其毒氣夭傷人命水火盗賊疫癘刀兵厄難困苦官私口舌枷鎖迍邅令人所爲不遂年月歳久遭遇不少又見風雷之獄常有黑風震雷霹𩆝飛戈衝突罪人分散肢體穿穴五臟萬刼受苦晝夜不息又見火翳之獄有諸罪人吞火食炭爲火所燒頭面焦爛身帶火山皮膚骨肉節節生火萬刼受苦晝夜不息又見金剛之獄有諸罪人金搥鐵杖亂拷無數肢體壞爛筋骨零落鐵乂穿膓金鎚塞心萬刼受苦晝夜不息又見溟泠之獄有諸罪人沉没寒氷劔㦸霜刃衝斷筋骨百毒之汁以灌其上五體零落心腹破壞萬刼受苦晝夜不息又見銅柱地獄有諸罪人身上銅柱大火猛𦦨令諸罪人手抱足登表裏焦爛膓背膿血萬刼受苦晝夜不息又見屠割地獄有諸罪人身被倒懸刀劔割體四肢脇脉皮膚五臟皆有刀刃割截其中罪人血流滿地非可堪忍萬刼受苦晝夜不息又見火車地獄有諸罪人五車裂體四肢分散或身處火車東西南北一一車轉皆有刀刃隨輪運轉割截罪人加誅猛火燒炙焦爛萬刼受苦晝夜不息又見鑊湯地獄有諸罪人身被鐵乂乂入鑊湯五體𤋎煮四肢爛潰膿血臭穢不可堪忽萬刼受苦晝夜不息是時元始上帝十方救苦眞人施大威光假六通慧力令諸罪魂閉目靜思自識宿命生存之日造諸惡業或手弑君父不孝二親或誹謗眞仙或殘傷兄弟或謀反師尊或淫犯骨肉或刼賊殺害或屠割孤貧以强凌弱以貴虐賤或穢慢靈文或陰賊嫉妬或惡口兩舌或鬭亂善人積刼以來所犯諸罪一時頓憶各各明了倍增苦惱願求解脫咸皆救度元始上帝再吿左右侍眞曰吾見諸罪人曠刼以來不信經懺惟罪是修遂使名書黑簿身没九幽魂滯三途末由解脫若有淸信男女發無上心爲先逝亡魂父母眷屬建齋行道拜表上章濟度孤貧放生續命者吾遣太乙救苦天尊於紫微上宮開三天奧藏七部瓊篇蘂簡琅王函出天尊懿號下降人間讚嘆諷誦吟咏洞章消滅罪犯削落九幽長夜玉匱之函遍使一切罪魂離苦解脫隨願往生逍遙無爲咸獲超度是故燒香皈身皈命五體投地志心朝禮玉淸聖境虛無自然元始天尊上淸眞境太上道君靈寶天尊太淸仙境太上老君降生天尊太上昊天至尊金闕玉皇上帝上甯高道聖祖司命保生天尊南極聖主紫微上宮天皇大帝中天星主紫微中宮北極大帝承天效法厚德光太后土皇地祗應感儲祥元天大慈聖后元君南極長生大帝統天元聖天尊東極靑宮大帝太乙救苦天尊眞明大聖九天應元雷聲普化天尊九天雷祖大帝除災濟物天尊紫微碧玉宮太乙天帝保制刼運天尊六天洞淵大帝伏魔上上太乙天尊綠波天主帝君普施法潤天尊九天可韓司丈人朱陵度命天尊九天採訪使應元保運妙化天尊東方九炁天中靑靈始老洞空天尊南方三炁天中丹靈眞老洞淸天尊西方七炁天中皓靈皇老洞虛天尊北方五炁天中五靈玄老洞微天尊中央一炁天中玄靈元老洞眞天尊東北方紫淸降福天尊東北方度仙上聖天尊慈暎度苦天尊高上天師天尊金靜玉寶天尊照庾仙道天尊上元四明天尊妙尊金眞天尊洞玄內秘天尊先相寶開天尊萬元洞明天尊無等寶照天尊神通眞觀天尊太虛一乘天尊湛然丹靈天尊應眞法寂天尊中玄道運天尊解脫思議天尊慧元三天天尊神智道運天尊權實洞玄天尊上洞飛經天尊上帝地皇天尊八妙寂然天尊無量妙行天尊上洞三天天尊金光常湛天尊太玄明解天尊明眞玉虛天尊聖眞小有天尊丹紫緣感天尊上宮平等天尊玄紀七聖天尊上元上品天尊寶藏法海天尊寶臺法海天尊隨聲救苦天尊萬靈寶眞天尊朱鏡妙尊天尊西靈寶眞天尊運晨明道天尊眞運通明天尊金聖凝湛天尊輪東法華天尊思眞延夀天尊金靈妙寂天尊萬運明廣天尊明玄神運天尊眞空道訓天尊道應慧朗天尊自然神寶天尊妙寶玄元天尊化明至道天尊明朗上運天尊慧明高運天尊最勝光相天尊常道三有天尊黃老地皇天尊道運玄會天尊太元一相天尊眞道魔成天尊神慧道運天尊眞法成天天尊上靈璚華天尊高運明行天尊虛玄光明天尊七映北眞天尊開明一切天尊本際上靈天尊道明眞𥥊天尊秘藏善開天尊救苦東華天尊淸虛玉老天尊决定太淸天尊虛道慧運天尊救生正眞天尊高勝度命天尊八明北眞天尊廣敷眞戒天尊廣明眞道天尊行明大運天尊戒生化成天尊丹紫空道天尊妙尊空華天尊無量北眞天尊明化高道天尊眞淵無滯天尊上元化度天尊受持玄會天尊仙靈普慈天尊五老梵行天尊威化金絢天尊護魂無滯天尊無碍自然天尊上品福慶天尊寶應仙飛天尊妙元朱光天尊大聖長樂天尊九幽拔罪天尊隨願往生天尊尋聲救苦天尊大慈大悲救苦眞人大慈大悲救度眞人大慈大悲大惠眞人大慈大悲解脫眞人大慈大悲洞玄眞人大慈大悲洞神眞人大慈大悲濟苦眞人大慈大悲降魔眞人大慈大悲普照眞人大慈大悲金景眞人大慈大悲玉光眞人大慈大悲光明眞人救死天師護生天師度命天師度人天師好生天師好善天師元始上帝告左右侍眞曰吾今遣太華眞人以此天尊眞人天師位號齎往下界散佈萬國九洲一切人天轉禮誦念上消天災下散地禍若有修眞之士信道之民於本命生辰爲三公輔弼將相寀僚大醮星辰轉經禮懺永臻五福常保三元品秩穹崇夀齡延永獲福無量志心朝禮地脉山福地仙官聖眾葢竹山福地仙官聖眾淸遠山福地仙官聖眾曰安山福地仙官聖眾石磕山福地仙官聖眾東仙源福地仙官聖眾靑嶼山福地仙官聖眾郁木洞福地仙官聖眾赤水山福地仙官聖眾丹霞山福地仙官聖眾召山福地仙官聖眾焦源福地仙官聖眾靈墟山福地仙官聖眾沃洲福地仙官聖眾老姥岑福地仙官聖眾若耶溪福地仙官聖眾金庭山福地仙官聖眾馬嶺山福地仙官聖眾鵝羊山福地仙官聖眾洞眞墟福地仙官聖眾光天壇福地仙官聖眾洞宮福地仙官聖眾淸玉壇福地仙官聖眾陶公山福地仙官聖眾元始上帝吿左右侍眞曰吾今遣太華眞人齎此經懺散佈萬國九洲偏使人天禮誦延生集福保命消災若有奉道之民遇三元八節本命生辰修齋禮拜念誦三淸寶號天尊名位願三軍萬姓普天兆庶一切𠲒生永臻夀祿獲福無量冲妙先生燒香朝禮拜謝金闕上帝而獻頌曰煥赫空洞章靈音震九天至眞開寶藴傳受希夷篇寶偈經仍遇靈文拔祖先超度長夜魂上登朱陵府䖍心尊所奉朝謝虛皇前太上靈寶朝天謝罪法懺卷五終
