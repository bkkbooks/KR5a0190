body:
  text: 賜福降禎祥大聖元始宥罪大天尊三稱太上靈寳朝天謝罪大懴卷之四爾時元始上帝在大羅天上玉京金闕紫微天臺大會羣仙敷演妙法救度天人咸使悟道不厯諸苦施大威德放大光明普照萬國一切罪福俱在目前甚深微妙方便開度一切地獄窮魂苦毒無量痛楚難言並䝉恩救拔不溺沉淪咸得超度是時元始上帝慈悲廣洽更開要道使過去未來俱霑利益再吿左右侍眞曰人之禀生同資一氣及乎誕育命係三元夀夭吉凶富貴貧賤因緣罪福善惡生死各由宿命根源悉有報應隨其業力永不差殊如影隨形似聲應響上元正月十五日上元天官主錄百司上詣天闕進呈世人罪福之籍七月十五日中元地官主錄百司上詣天闕進呈世人罪福之籍十月十五日下元水官主錄百司上詣天闕進呈世人罪福之籍三元之日與三界十方四司五帝善惡童子一切靈官上朝金闕元始御前考校男女生死之籍罪福因緣及九幽地獄水府窮魂姓名黑簿此時若有善信男女能發自然道意建造紫微寶臺玉京寶山樓閣臺殿百寶莊嚴香花供𠐒燒香行道吟詠洞章然燈放生步虛法事布施發願謝過上章大建齋醮䖍吿天地晝夜不怠者吾當遣十天眞人諸天神仙三界四司救苦靈童下降人間齊到道壇爲其滅罪保佑生人使國土安甯男女歡泰眾善齊降諸惡不生地獄苦魂一時解脫徑生天上快樂無爲率土太平功德巍巍獲福無量元始上帝再吿左右侍眞曰吾見十方無極世界十方天王造三十三層天臺寶盤悉以紫金珠玉錦縠紫綱寶葢紫節旌幢百花飲食器物百珍仙樂摇曳徧滿虛空來詣道場羅列供𠐒爾時天尊以神通威力變此會中國土悉是琉璃洞徹內外皆同一色遠近平等不殊三界十方同霑福慶喜樂難言九幽罷對五苦停酸國土安甯人民長夀元始上帝再吿左右侍眞曰下界若有善信男女請道士法師當於三元節日宣說經懺罪福因緣懺悔自己受身不凈臭穢四大浮脆假合念念無常三業六根搆造諸罪漸染成愆輪迴生死墮落三塗九幽地獄受諸苦惱吞火食炭鑊湯煎煮足履刀山手攀劔樹磑磨碓擣鋸解錐劖鐵鳥啄睛鐵犁耕舌牛頭亂拷鐵杖負身膿血流離身體爛壞沉淪黑闇流轉泥犁負石塡河晝夜拷掠一入酆都地獄萬刼難原皆是眾生業力自受若有善信男女能發善心爲七世祖禰及現存己身父母骨肉五苦三塗窮魂餓鬼畜生囚徒老病眾生造玉京高座紫微天臺掛旛獻花百珍供𠐒醮謝星宿拜表上章禮懺燒香滅諸罪原咸得超度元始天尊吿左右侍眞曰若有善信男女於三元節日爲一切人天建設齋醮轉經禮懺供𠐒天尊神仙列曜星宿地府百司爲祖考父母發片善心精誠不退過去未來三世父母獲福無量滅諸罪犯元始上帝吿左右侍眞曰吾見下土兆民多有凶禍邪鬼所害可爲先亡祖考父母尊親五臘之日是天地開赦宜建齋醮行道禮懺上章救拔先祖咸得超度獲福無量正月一日天臘之日五帝神仙集於靑天安寶華林靑靈闕中校定世人罪福之籍五月五日地臘之日五帝神仙集於丹天梵寶昌陽丹靈闕中校定世人罪福之籍七月七日道德臘之日五帝神仙集於素天金門素靈闕中校定世人罪福之籍十月一日民歳臘之日五帝神仙集於玄天洞陰黑靈闕中校定世人罪福之籍十二月遇臘日是王侯臘之日此日五方五帝集於玄都玉京元靈戊己金闕元始上帝八景殿中校定世人罪福之籍此五臘日皆是天地合攢之日定吉凶生死簿籍若有男女爲過去先祖父母禮懺上表謝罪滅除黑簿罪目升度七祖父母入名上淸皆得超度夫五臘日者皆生人九祖父母幽獄鬼魂此日爲酆都北陰大帝引出責問久處陰司年代積罪結釁端由及子孫姓名墳墓所在如積刼未有追贖因此日延累生人引問得子孫親姻九族姓名爲生人罪狀積釁幽都九族延滅此日可爲先祖亡故父母上表懺謝宿愆追拔幽塗皆亡人一一得之常日祭祀不可得達葢爲酆都幽深難爲通徹沐賴眞猷皆得宿愆解釋幽司不欲久滯死魂久滯則天曹責及幽司官吏亦責及生人轉福爲禍災難自此而生若有至孝男女此日修奉齋醮則黑簿除名獲福無量皆得超度元始上帝吿左右侍眞曰下界眾生識見不同習惡造善根基各異今說要言各宜信奉若眾生好殺害損傷者卽以慈悲門攝之若偷盗刼奪財物者卽以分義門攝之若邪淫放蕩者卽以貞潔門攝之若慳貪悋惜者卽以布施門攝之若愚癡顚倒者卽以方便門攝之若綺言浮華者卽以簡正門攝之若妄語虛誑者卽以信順門攝之若惡口咒詛者卽以誦念門攝之若兩舌惡罵者卽以讚嘆門攝之若飲酒食肉過度者卽以齋戒門攝之若誹謗訾毁者卽以講說門攝之若倨傲輕慢者卽以禮拜門攝之若剛强豪健者卽以柔弱門攝之若不信罪福宿命者卽以因緣門攝之若執繫有無者卽以中道門攝之若是非彼我者卽以平等門攝之若貪濁穢汙者卽以淸淨門攝之若堅固不移者卽以輪轉門攝之若造作不休者卽以無爲門攝之若扃守不變者卽以圓滿門攝之若躁競不安者卽以靜定門攝之若煩惱不釋者卽以解脫門攝之若憂悲不樂者卽以逍遙門攝之若輕慢三寶者卽以皈依門攝之若以此二十四門常攝一切眾生不亦樂乎元始上帝曰吾本以無攝爲攝勸化眾生眾生旣悟亦無攝因若能奉持獲福無量元始上帝再吿左右侍眞曰下界兆庶若有淸净奉道之民爲九祖先遠父母幽魂或於古觀靈壇或在本家淨室建三淸寶座點七曜明燈燒香行道吟詠洞章轉禮經懺大醮諸天精誠不怠者吾遣太乙救苦天尊於九炁天宮開七寶雲樓靑簡金文出天尊懿號下降人間徧使人人禮念爲削落九幽長夜玉匱之函使七祖超度魂上南宮神仙接引逍遙無爲獲福無量是故燒香歸身皈命五體投地志心朝禮玉淸聖境虛無自然元始天尊上淸眞境太上道君靈寶天尊太淸仙境太上老君道德天尊太上昊天至尊金闕玉皇上帝上寧高道聖祖司命保生天尊南極聖主紫微上宮天皇大帝中天星主紫微中宮北極大帝承天效法厚德光太后土皇地祗應感儲祥元天大慈聖后元君南極長生大帝統天元聖天尊東極靑華大帝太乙救苦天尊貞明大聖九天應元雷聲普化天尊九天雷祖大帝除災濟物天尊紫微碧玉宮太一天帝保制刼運天尊六天洞淵大帝伏魔上上太乙天尊六波天主帝君普施法潤天尊九天可韓司丈人朱陵度命天尊九天採訪使應元保運妙化天尊東方九炁天中靑靈始老洞空天尊南方三炁天中丹靈眞老洞淸天尊西方七炁天中皓靈皇老洞虛天尊北方五炁天中五靈玄老洞微天尊中央一炁天中玄靈元老洞眞天尊北方消災解危天尊北方玄上玉宸天尊玄明眞仙天尊玄會慈恩天尊朱光妙果天尊妙果四極天尊無礙十華天尊運明靜行天尊運明眞文天尊妙果正因天尊黃道運明天尊法海寶福天尊運明太虛天尊萬行靜定天尊金相凝神天尊靈融應體天尊上運至道天尊靈眞丹天天尊運明妙空天尊元一天皇天尊无等開元天尊至道智明天尊濟物高勝天尊淸響無等天尊流慈自然天尊七暎妙光天尊太洞七元天尊上洞朱極天尊雲宮平等天尊道運光空天尊妙寶金緣天尊妙善眞濟天尊丹紫無爲天尊大運化道天尊紫極中華天尊延夀仙靈天尊法海瓊音天尊妙玄北眞天尊眞觀神眞天尊妙玄道運天尊西明感化天尊期度仙道天尊廣明大道天尊開度解脫天尊仙靈普朗天尊朱宮妙樂天尊救生空觀天尊明智玄通天尊果成仙道天尊徧道上運天尊方便冥感天尊仙眞南極天尊𤣥通長樂天尊正眞法成天尊一切常度天尊無爲丹元天尊靈顔妙光天尊上靈光照天尊明廣慧道天尊拔苦慈解天尊四宮眞境天尊大洞體玄天尊洞玄開度天尊金光妙湛天尊結成騫林天尊雲宮法燈天尊至玄運道天尊慧光三天天尊自然流鈴天尊靜明玉帝天尊普朗業行天尊丹霍法成天尊寶林一乘天尊應會開闡天尊隨方傳法天尊中千常一天尊道運眞空天尊上天妙嚴天尊長樂丹元天尊救生萬化天尊文眞廣運天尊地皇神尊天尊皓素無等天尊華景一乘天尊正一三天天尊玉宮雲營天尊延夀慧眞天尊重玄德眞天尊寶明大度天尊朱因高尊天尊無等淸響天尊化成仙道天尊運明妙照天尊戒生明行天尊上道運明天尊妙果朱素天尊寂然紫度天尊金剛妙彩天尊拔苦慈恩天尊眞玄二炁天尊度厄應變天尊九幽拔罪天尊隨願往生天尊慈悲救苦天尊大慈大悲救苦眞人以下眞人俱冠以大慈大悲救度眞人大惠眞人明皇眞人照理眞人普度眞人至極眞人普救眞人慈覺眞人玉臺眞人金玄眞人妙玄眞人自在眞人變化天師神妙天師皇上天師萬福天師太極天師王晨天師元始上帝告諸神仙曰吾今降此天尊眞人天師位號遣太淸眞人齎往下方散布萬國九洲一切人天轉誦若有善信男女奉道之人每遇八節三元生辰本命轉禮經懺醮謝天地爲三軍萬姓一切含生燒香朝謝使門戸昌隆世世榮盛子孫聰慧夀祿延永功德巍巍永消世厄人各恭敬志心朝禮東海廣德之神龍宮官屬南海洪聖廣利之神龍宮官屬西海廣潤之神龍宮官屬北海廣澤之神龍宮官屬江瀆廣源之神龍宮官屬河瀆靈源之神龍宮官屬淮瀆長源之神龍宮官屬濟瀆淸源之神龍宮官屬浙江水府之神龍宮官屬吳江水府之神龍宮官屬楚江水府之神龍宮官屬荆江水府之神龍宮官屬羊子江水府之神龍宮官屬湘江水府之神龍宮官屬淞江水府之神龍宮官屬南江水府之神龍宮官屬漢江水府之神龍宮官屬元始上帝再吿左右侍眞曰吾今降下此經散布十方世界徧使人天禮念獲生生福滅世世罪所求皆遂所願皆成世間若有奉道之民信善之家每遇本命生辰八節三元燒香禮誦大建齋醮諷詠三淸寶號眞人名位上願三公輔弼將相寀寮拜表上章迎祥集福永臻富貴長保遐齡冲妙先生燒香朝謝金闕上帝而獻頌曰天生明哲永贊昌期冰稜玉峭鳳質鸞姿爕調元化力贊雍熙農歌綠野兵戢四夷長臻五福永集天祺太上靈寶朝天謝罪法懺卷四終讚元始天王三界眞仙說法普度四生愆妙法廣無邊天師天仙消罪錫延年大聖元始宥罪大天尊三稱
