front:
  text: 太上靈寶朝天謝罪法懺卷一爾時元始上帝太上道君太上老君在大羅天上玉淸聖境大福天中七寶紫微之臺大會羣仙講演正一懺法施大威力布大祥光普照無極世界善惡因緣開一切眾生令知宿命罪福過去未來三世報應之事是時諸天大聖燒香朝拜列班侍衞仰聽法音元始上帝放九色神光照徹諸天下及萬國威神變化洞徹無閡皎在目前猶如指掌左右羣仙乘此威光照諸天下善惡因緣內外備盡見有大聖高尊頂負圓光身相嚴妙或駕景乘空騰龍馭鶴飛雲布虛鸞輿鳳葢遨遊八極逍遙無爲神通自在或見天仙地仙金童玉女無鞅數眾福德快樂或見諸仙持旛持節燒香散花分身變化或見飛天神王善惡童子巡遊人間滌錄善惡以奏諸天或見日月宮殿星宿寶宮山河湖嶽靈官考較人民善惡功過豪分不失時有十華眞人與諸天大聖燒香朝拜上奏至尊今日得詣瓊軒觀聽妙會參侍左右願施威力建大法橋接引羣倫咸使得道永出沉迷是時元始上帝吿左右侍眞曰卿等羣仙隨吾祥光下觀萬國大地山河兆民善惡報應崇建功德廣種福田者一一皆受諸天人福見有帝王后妃將相大臣正殿燒香廣陳供養修奉齋醮轉禮經懺爲一切人天禳災祈福見有帝王后妃將相大臣卑身下物廣持百寶供養諸天見有帝王后妃將相大臣建立宮殿塑造聖像轉經禮懺爲一切人天廣求福利見有帝王后妃將相大臣散施財寶救濟貧窮老病困苦見有帝王后妃將相大臣常行慈悲不行殺害不奢不費常行儉約見有道士賢者修建靈觀星壇冩經造像見有道士賢者斷糓休糧淸淨身心誦習經典見有道士賢者放生續命濟惠貧乏見有道士賢者翹懃星漢以求輕舉見有道士賢者忠孝君親慈愛和友見有帝王國主文武大臣遊獵殺害傷殘百姓見有帝王國主文武大臣酷雪嚴刑人民困幣見有帝王國主文武大臣貪淫貪慾恣縱六情宴樂無度見有帝王國主文武大臣毀壞宮觀燒除法宇見有帝王國主文武大臣輕慢出家凌辱法師苦痛刑害見有帝王國主文武大臣輕慢天地日月星辰鴆毒善人見有男女誹謗出家法身於宮觀中行諸淫慾殺害群毛穢污福地見有男女殺害父母忤逆不孝違天負地不信罪福見有男女偷盗常住三寶供養財物花菓旛幢見有男女悖道叛師違盟負誓抵債欺心見有男女枷鎖牢獄鞭笞拷打殘害身形見有男女六形不具癡聾瘖瘂手足攣縮見有男女愚痴憨騃風癩顚狂見有男女毒蟲猛獸吞螫搏噬見有男女中道分離不孝於親見有男女子母分張賣身奴婢見有男女身體破裂膿血潰爛又見地獄足履刀山肢體斷壞又見地獄手攀劔樹肢節分張又見地獄吞火食炭遍身煙出又見地獄碓擣磑磨屑屑如粉又見地獄身抱銅柱形體焦枯又見地獄身卧鐵床肢流火爛又見地獄鑊湯煎煮淸潰爛壞又見地獄鋸𨮂身形遍體流血又見地獄硤石逼身毛孔迸血又見地獄身湼寒氷遍身破裂又見地獄頭帶火山身面焦枯又見地獄鐵鳥啄睛皮肉分張又見地獄拔出其舌鐵錐刺之又見地獄挺及溟波以灌四瀆又見地獄負石塡河晝夜不息又見有受身餓鬼者又見有受身六畜牛羊猪狗者又見有受身邊夷下賤者又見有受身六疾聾肓瘖瘂手攣腳跛者又見有受身蟲獸蠅蝱者又見有受身溷虫於泥中者又見有受身惡虫鳥獸魚龞蝦蠏者是時法會中一切大聖神仙見諸天諸地中有如此報應因緣罪福不同不知前生何修今生何犯前生何福今生何罪或是先世種因殃流子孫或是一身種釁受此業報伏願天尊大慈垂賜方便令一切羣生曉悟宿命因緣罪福報應諸天賞罰毫分不差若啟䖍心依凜聖言皆獲超度元始天尊再謂左右侍眞曰下界若有志人信善發無上道意大捨財寶救濟貧乏放生續命建七寶妙臺立三淸聖像建節燒香大醮天地百靈天宮星宿百珍供養者吾遣太乙救苦天尊於太極宮中開丹簡紫文出天尊懿號稱揚讚嘆吟咏洞章乞削落九幽長夜之魂解釋七祖父母厯刼辛苦罪殃纒結併皆赦原魂生天堂逍遙無爲衣食自然增無量福消無邊罪功德巍巍皆得超度是以燒香皈身皈命五體投地志心朝禮玉淸聖境虛無自然元始天尊上淸眞境太上道君靈寶天尊太淸仙境太上老君降生天尊太上昊天至尊金闕玉皇上帝上靈高道聖祖司命保生天尊大帝南極聖主紫微上宮天皇大帝中天星主紫微中宮北極大帝承天效法厚德光太后土皇地祗應感儲祥元天大慈聖后元君南極長生大帝統天元聖天尊東極靑宫大帝太乙救苦天尊眞明大聖九天應元雷聲普化天尊九天雷祖大帝除災利物天尊紫微碧玉宮太乙天帝保制刼運天尊六天洞淵大帝伏魔上上太乙天尊綠波天主帝君普施法潤天尊九天可韓司丈人朱陵度命天尊九天採訪使應元保運妙化天尊東方九炁天中靑靈始老洞空天尊南方三炁天中丹靈眞老洞淸天尊西方七炁天中皓靈皇老洞虛天尊北方五炁天中五靈玄老洞微天尊中央一炁天中玄靈元老洞眞天尊東方玉淸降福天尊東方玉寶皇上天尊玉淸妙眞天尊上元普朗天尊洞明朱極天尊安神丹元天尊眞相七朗天尊金仙妙彩天尊又玄重玄天尊靈眞妙成天尊上宮玄光天尊大道明廣天尊解脫玄化天尊開靜紫淸天尊法海經寶天尊丹元洞視天尊妙樂丹素天尊雲宮大行天尊金闕妙樂天尊太淸眞道天尊眞嚴常濟天尊逍遙三光天尊太元玄老天尊正啟空寂天尊最妙丹元天尊瓊威法海天尊高運空霄天尊保命開運天尊妙尊靜玄天尊應元渾成天尊洞玄八景天尊道運玄化天尊金玄凝光天尊德光化成天尊因果玄會天尊太玄道運天尊眞空東華天尊應明大運天尊眞元萬道天尊洞元應玄天尊高皇丹天天尊至運明化天