body:
  text: 啟元天師道光天師開化天師進山天師重光天師淸朗天師元始上帝吿諸神仙曰吾今以此天尊寶號眞人天師名位遣玉淸眞人齎往下界萬國九洲散佈人天傳冩禮誦若有修眞之士集福之民或遇八節三元本命之日上爲帝王帝主燒香散花珍異百菓大醮星辰供養名山洞府得道神仙安鎭國祚與天齊年萬邦熙洽四海同文神昇金闕名列玉淸天無氛穢萬國咸甯功德巍巍福禧無極志心朝禮王屋山小有淸虛洞天仙官委羽山大有空明洞天仙官西城山太玄極眞洞天仙官西玄山三玄極眞洞天仙官靑城山寶仙九室洞天仙官天臺山上淸玉平洞天仙官羅浮山朱明耀眞洞天仙官茅山金壇華陽洞天仙官林屋山左神幽靈洞天仙官括蒼山神德隱玄洞天仙官霍撞霍靈洞天仙官東嶽泰山靑帝眞君蓬玄太空洞天仙官南嶽衡山赤帝眞君朱陵太虛洞天仙官西嶽華山白帝眞君太極總山洞天仙官北嶽恆山黑帝眞君太乙總玄洞天仙官中嶽嵩山黃帝眞君上帝司眞洞天仙官峩眉山虛靈太妙洞天仙官四明山赤水洞天仙官陽明山極玄洞天仙官
