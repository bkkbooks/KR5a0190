body:
  text: 志心朝禮玉清聖境虛無自然元始天尊上清真境太上道君靈寶天尊太清仙境太上老君道德天尊太上昊天至尊金闕玉皇上帝南極星主紫微上宫天皇大帝中天星主紫微中宫北極大帝承天效法厚德光大后土皇地祇南極長生大帝統天元聖天尊東極青華大帝太一救苦天尊貞明大聖九天應元雷聲普化天尊九天雷祖大帝除災濟物天尊紫微碧玉宫太一大天帝保制劫運天尊六天洞淵大帝伏魔上上太一天尊六波天主帝君普施法潤天尊九天可韓司丈人朱陵度命天尊九天採訪使應元保運妙化天尊東方九氣天中青靈始老洞空天尊南方三氣天中丹靈真老洞清天尊西方七氣天中皓靈皇老洞虛天尊北方五氣天中五靈玄老洞微天尊中央一氣天中玄靈元老洞真天尊志心朝禮東方玉寶皇上天尊志心朝禮玉音妙真天尊志心朝禮上元普朗天尊志心朝禮洞明朱極天尊志心朝禮安樂丹元天尊志心朝禮真相七朗天尊志心朝禮金仙妙彩天尊志心朝禮又玄重玄天尊志心朝禮靈真妙成天尊志心朝禮上宫玄光天尊志心朝禮大道明廣天尊志心朝禮解脫玄化天尊志心朝禮開靜紫清天尊志心朝禮法海經寶天尊志心朝禮丹元洞視天尊志心朝禮妙樂丹素天尊志心朝禮雲宫大行天尊志心朝禮金簡妙樂天尊志心朝禮太清真道天尊志心朝禮真嚴常濟天尊志心朝禮逍遙三光天尊志心朝禮太元玄老天尊志心朝禮正啓空寂天尊志心朝禮最妙丹元天尊志心朝禮瓊威法海天尊志心朝禮髙運空霄天尊志心朝禮保運開命天尊志心朝禮妙尊靜玄天尊志心朝禮應化渾成天尊志心朝禮洞玄八景天尊志心朝禮道運玄化天尊志心朝禮金玄凝光天尊志心朝禮德光合成天尊志心朝禮因果玄㑹天尊志心朝禮太玄道運天尊志心朝禮真空東華天尊志心朝禮應明大運天尊志心朝禮真元萬道天尊志心朝禮洞陽應玄天尊志心朝禮髙皇丹天天尊志心朝禮至運明化天尊志心朝禮上品內明天尊志心朝禮懸珠妙光天尊志心朝禮至德應功天尊志心朝禮仙嚴常濟天尊志心朝禮解脫運明天尊志心朝禮上運應道天尊志心朝禮聖王臨軒天尊志心朝禮升玄洞靈天尊志心朝禮凝彩金相天尊志心朝禮妙樂朱宫天尊志心朝禮無量克成天尊志心朝禮救生法雲天尊志心朝禮長生大聖天尊志心朝禮運明太玄天尊志心朝禮妙觀仙京天尊志心朝禮功至德成天尊志心朝禮隱明聖真天尊志心朝禮髙運文朗天尊志心朝禮道空真際天尊志心朝禮照迷靈仙天尊志心朝禮妙金寶藏天尊志心朝禮如意化成天尊志心朝禮文明玄道天尊志心朝禮遍明廣運天尊志心朝禮運明廣行天尊志心朝禮上宫瓊煥天尊志心朝禮妙樂凝玄天尊志心朝禮金藏妙彩天尊志心朝禮妙道化明天尊志心朝禮長存紫元天尊志心朝禮常開祕藏天尊志心朝禮西靈感化天尊志心朝禮瓊煥法海天尊志心朝禮自在神通天尊志心朝禮冠法太清天尊志心朝禮金宫妙彩天尊志心朝禮廣道景明天尊志心朝禮保生開遍天尊志心朝禮瓊海㑹法天尊志心朝禮東華法寶天尊志心朝禮開光丹景天尊志心朝禮道廣神廣天尊志心朝禮開朗智功天尊志心朝禮三宫法通天尊志心朝禮丹真天皇天尊志心朝禮延算元慧天尊志心朝禮響道濟運天尊志心朝禮上運行澄天尊志心朝禮洞玄八威天尊志心朝禮玉宫開化天尊志心朝禮隨行應緣天尊志心朝禮道開空洞天尊志心朝禮運明慧行天尊志心朝禮真仙普朗天尊志心朝禮真品澄清天尊志心朝禮真文八㑹天尊志心朝禮遍道真㑹天尊志心朝禮因果寶祕天尊志心朝禮丹天煥明天尊志心朝禮太元上真天尊志心朝禮隨願往生天尊志心朝禮慈悲救苦真人志心朝禮慈悲救度真人志心朝禮慈悲大惠真人志心朝禮慈悲真人志心朝禮妙覺真人志心朝禮慈慧真人志心朝禮慧相真人志心朝禮明解真人志心朝禮善覺真人志心朝禮慈念真人志心朝禮智觀真人志心朝禮慈愛真人志心朝禮常樂真人志心朝禮啓元天師志心朝禮道光天師志心朝禮開化天師志心朝禮進仙天師志心朝禮重光天師志心朝禮朗清天師元始上帝告諸神仙曰吾今以此天尊寶號真人天師名位遣玉清真人齎往下界萬國九州散布人天傳寫禮誦若有修真之士集福之民或遇八節三元本命生日上為帝王國主燒香散花珍異百果大醮星辰供養名山洞府得道神仙安鎮國祚與天常存萬邦熙洽四海同文神升金闕名列玉清天無氛穢萬國咸寧功德巍巍福禧無極志心朝禮王屋山小有清虛洞天仙官委羽山大有空明洞天仙官西域山太玄極真洞天仙官西玄山三玄極真洞天仙官青城山寶仙九臺洞天仙官天台山上清玉平洞天仙官羅浮山朱明耀真洞天仙官茅山金壇華陽洞天仙官林屋山左神幽墟洞天仙官括蒼山神德隱玄洞天仙官霍橦山霍林洞天仙官東嶽泰山青帝真君蓬玄太空洞天仙官南嶽衡山赤帝真君朱陵太虛洞天仙官西嶽華山白帝真君太極總仙洞天仙官北嶽常山黑帝真君太一總玄洞天仙官中嶽嵩山黃帝真君上帝司真洞天仙官峨眉山虛靈太妙洞天仙官廬山仙靈詠真洞天仙官四明山赤水洞天仙官陽明山極玄洞天仙官元始上帝再告左右侍真曰吾今以此經散布萬國九州十方世界若有奉道之民發無上道意遇三元八節之日為帝王國主儲君太子燒香朝禮轉念三清寶號天尊真人名位者安鎮國祚保天長存世世不絶長為人君冲妙先生朝謝金闕上帝而獻頌曰上帝降命聖算綿長金枝挺秀玉葉彌芳五星順序七曜垂芒赫赫煌煌空洞靈章福我聖皇寶祚無疆天清地寧萬宇輝光太上靈寶朝天謝罪大懴卷之一
