front:
  text: 太上靈寶朝天謝罪大懴卷之一露一爾時元始上帝太上道君太上老君在大羅天上玉清聖境大福天中坐七寶紫微之臺大㑹群仙講演真一妙法施大威力布大祥光普照無極世界善惡因緣開示一切衆生令知宿命罪福過去未來三世報應之事是時諸天大聖燒香朝拜列班侍衛仰聽法音元始上帝放九色神光徹照諸天下及萬國威神變化洞徹無閡皎在目前猶如指掌左右群仙乘此威光得見諸天善惡因緣內外備盡見有大聖髙真項負圓光身相嚴妙或駕景乘空騰龍馭鶴飛雲步虛鸞輿鳯蓋遨遊八極逍遙無為神通自在或見天仙地仙金童玉女無鞅數衆福德快樂或見諸仙持旙執節燒香散華分身變化或見飛天神王善惡童子巡遊人間條録善惡以奏諸天或見日月宫殿星宿寶宫山河海嶽靈官考校人民善惡功過毫分不失時有十華真人與諸天大聖燒香朝拜上奏至尊今日得詣瓊軒觀聽妙㑹忝侍左右願施威力䢖大法橋接引群倫咸使得道永出塵迷是時元始上帝告左右侍真曰卿等群仙隨吾祥光下觀萬國大地山河兆民善惡報應崇建功德廣種福田者一一皆受諸天人福見有帝王后妃將相大臣正殿燒香廣陳法㑹修奉齊醮轉經禮懴為一切人天禳災祈福見有帝王后妃將相大臣卑身下物廣持百寶供養諸天見有帝王后妃將相大臣建立宫觀塑造聖像轉經禮拜為一切人天廣求福利見有帝王后妃將相大臣散施財寶救濟貧窮老病困苦見有帝王后妃將相大臣常行慈悲不殺不害不奢不費常行儉約見有道士賢者修建靈觀星壇寫經造像見有道士賢者斷榖休糧清淨身心誦習經典見有道士賢者放生續命濟惠貧乏見有道士賢者翹勤星漢以求輕舉見有道士賢者忠孝君親慈愛知友見有帝王國主文武大臣遊獵殺害傷殘百姓見有帝王國主文武大臣酷虐嚴刑人民困弊見有帝王國主文武大臣貪淫貪欲恣縱六情宴樂無度見有帝王國主文武大臣毀壞宫觀燒除法宇見有帝王國主文武大臣輕慢出家陵辱法師苦痛刑害見有帝王國主文武大臣輕慢天地日月星辰鴆毒善人見有男女誹謗出家法身於宫觀中行諸淫欲殺害群毛穢汙福地見有男女殺害父母五逆不孝違天負地不信罪福見有男女偷盜常住三寶供養財物花果旙幢見有男女背道叛師違盟負誓抵債欺心見有男女枷鎖牢獄鞭笞拷掠殘害身形見有男女六形不具癡聾瘖啞手足攣縮見有男女愚癡憨騃風癩顛狂見有男女毒蟲猛獸吞螫搏噬見有男女中道分離不終於親見有男女子母分張賣身奴婢見有男女身體破裂蟲爛膿血又見地獄足履刀山肢體斷壞又見地獄手攀劍樹肢節分張又見地獄吞火食炭遍身煙出又見地獄碓搗磑磨屑屑如粉又見地獄身抱銅柱形體焦枯又見地獄身卧鐵床脂流火爛又見地獄鑊湯煎煮漬潰爛壞又見地獄鋸解身形遍體流血又見地獄硤石逼身毛孔迸血又見地獄身涅寒氷遍身破裂又見地獄頭戴火山身面焦枯又見地獄鐵鳥啄睛皮肉分張又見地獄拔出其舌鐵錐剌之又見地獄摙汲溟波以灌四瀆又見地獄負石填河晝夜不息又見有受身餓鬼者又見有受身六畜牛羊猪狗者又見有受身邊夷下賤者又見有受身六疾聾盲瘖啞手攣腳跛者又見有受身蟲獸蠅虻者又見有受身溷蟲淤泥中者又見有受身惡蟲鳥獸魚龞蝦蟹者是時法㑹中一切大聖神仙見諸天諸地中有如此報應因緣罪福不同不知前生何修今身何犯前生何福今身何罪或是先世種因殃流子孫或是一身積釁受此業報伏願天尊大慈賜垂開悟令一切群生曉悟宿命因緣罪福報應諸天賞罰毫分不差若啓心救拔依禀聖言皆獲超度元始天尊再謂左右侍真曰下界若有至人信士發無上道意大捨財寶救濟貧乏放生續命䢖七寶妙臺立三清聖像建節燒香大醮天地百靈天宫星宿百珍供養者吾遣太一救苦天尊於太極宫中開丹簡紫文出天尊懿號稱揚讃歎吟詠洞章乞削落九幽長夜之魂解釋先祖父母歷劫辛苦罪殃纏結並皆原放魂生天堂逍遙無為衣食自然增無量福消無量罪功德巍巍皆得超度是故燒香歸身皈命五體投地
