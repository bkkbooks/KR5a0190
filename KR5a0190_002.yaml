body:
  text: 玉清聖境虛無自然元始天尊上清真境太上道君靈寶天尊太清仙境太上老君道德天尊太上昊天至尊金闕玉皇上帝南極星主紫微上宫天皇上帝中天星主紫微中宫北極大帝承天效法厚德光大后土皇地祇南極長生大帝統天元聖天尊東極青華大帝太乙救苦天尊貞明大聖九天應元雷聲普化天尊九天雷柤大帝除災濟物天尊紫微碧玉宫太一大天帝保制劫運天尊六天洞淵大帝伏魔上上太一天尊六波天主帝君普施法潤天尊九天可韓司丈人朱陵度命天尊九天採訪使應元保運妙化天尊東方九氣天中青靈始老洞空天尊南方三氣天中丹靈真老洞清天尊西方七氣天中皓靈皇老洞虛天尊北方五氣天中五靈玄老洞微天尊中央一氣天中玄靈元老洞真天尊志心朝禮南方玄真萬福天尊志心朝禮湛寂法雲天尊志心朝禮智力方便天尊志心朝禮東華開化天尊志心朝禮三天獨尊天尊志心朝禮太清道成天尊志心朝禮朱玄妙道天尊志心朝禮惠遍道運天尊志心朝禮敷恩丹景天尊志心朝禮太清五帝天尊志心朝禮真戒寶敷天尊志心朝禮應明髙運天尊志心朝禮愛樂大洞天尊志心朝禮玄廣道運天尊志心朝禮天皇上帝天尊志心朝禮法性遍開天尊志心朝禮遍悟上元天尊志心朝禮道運神開天尊志心朝禮凝彩神映天尊志心朝禮無為應妙天尊志心朝禮救苦慈航天尊志心朝禮神道妙運天尊志心朝禮玄範法通天尊志心朝禮至德寶明天尊志心朝禮常開光明天尊志心朝禮鏡心妙光天尊志心朝禮浮雲法王天尊志心朝禮開慈靈廣天尊志心朝禮璚琚法寶天尊志心朝禮玄道明文天尊志心朝禮萬運遍道天尊志心朝禮真人仙映天尊志心朝禮真尊仙道天尊志心朝禮玉山紫館天尊志心朝禮常行運明天尊志心朝禮無滯至真天尊志心朝禮言成真道天尊志心朝禮上道明照天尊志心朝禮清源大願天尊志心朝禮等觀重玄天尊志心朝禮不二至性天尊志心朝禮明遍慧道天尊志心朝禮果成虛無天尊志心朝禮道運慧空天尊志心朝禮玄通妙達天尊志心朝禮南極寶輪天尊志心朝禮真空真寂天尊志心朝禮化被無際天尊志心朝禮運明神行天尊志心朝禮太清七寶天尊志心朝禮開清護生天尊志心朝禮金明極緣天尊志心朝禮靜定德重天尊志心朝禮玉帝太玄天尊志心朝禮無礙等真天尊志心朝禮三界寂然天尊志心朝禮解脫照空天尊志心朝禮救物應念天尊志心朝禮明響真道天尊志心朝禮湛然三元天尊志心朝禮空洞無礙天尊志心朝禮霞煥上宫天尊志心朝禮法寶靈顔天尊志心朝禮金神玉寶天尊志心朝禮太清洞視天尊志心朝禮煥明丹天天尊志心朝禮妙金光素天尊志心朝禮七映北元天尊志心朝禮正真戒生天尊志心朝禮上仙延算天尊志心朝禮中宫大行天尊志心朝禮響明上道天尊志心朝禮大行西靈天尊志心朝禮廣訓仙靈天尊志心朝禮重悟紫清天尊志心朝禮垂範玉清天尊志心朝禮晨極天皇天尊志心朝禮大慧玄明天尊志心朝禮丹光決定天尊志心朝禮德解上元天尊志心朝禮玄輝仙德天尊志心朝禮譬喻方便天尊志心朝禮紫清普果天尊志心朝禮護生開霞天尊志心朝禮寂然化虛天尊志心朝禮空清諸有天尊志心朝禮明響神道天尊志心朝禮玄會冥感天尊志心朝禮黃光運明天尊志心朝禮度脫真品天尊志心朝禮慧道照明天尊志心朝禮隨願往生天尊志心朝禮慈悲救苦真人志心朝禮慈悲救度真人志心朝禮慈悲大惠真人志心朝禮慈觀真人志心朝禮等救真人志心朝禮慧空真人志心朝禮寶相真人志心朝禮玄覺真人志心朝禮空朗真人志心朝禮等相真人志心朝禮慈朗真人志心朝禮曜靈真人志心朝禮清定天師志心朝禮定邪天師志心朝禮收鬼天師志心朝禮制魔天師志心朝禮斬邪天師志心朝禮啓天天師元始上帝告諸天神王曰吾今以此經遣金華真人齎往下方散布十方三界使一切人民轉誦或有奉道之民清信男女遇本命生日為皇后貴妃太子天親大醮天地日月星辰名山洞府得道神仙詠誦天尊真人天師名號者即有十天善神營護修奉之民上奏天府永消世厄長沐天恩鎮居鳯閣日奉伏明功德巍巍獲福無量志心朝禮太白山真德洞天仙官西山天寶極真洞天仙官大溈山好生玄上洞天仙官灊山天柱司玄洞天仙官鬼谷山太玄司真洞天仙官武夷山升真元化洞天仙官玉笥山太秀法樂洞天仙官華蓋山容城大玉洞天仙官蓋竹山長曜寶元洞天仙官都嶠山寶玄洞天仙官白石山瓊秀長真洞天仙官句漏山玉闕寶圭洞天仙官九嶷山朝真太虛洞天仙官洞陽山洞陽永觀洞天仙官幕阜山洞真太玄洞天仙官大酉山大酉華妙洞天仙官金庭山金庭崇妙洞天仙官元始上帝再告左右侍真曰吾今以此經散布萬國九州遍使人天禮念迎祥集福保命延生若有善信男女遇三元八節燒香轉禮三清寶號金華真人名位上願皇后貴妃太子天親禮拜供養集福延生永光寶曆世世不絶長居紫庭沖妙先生燒香朝謝金闕上帝而獻頌曰西靈聖母貴曵瓊琚鸞臺鳯閣密從宸輿虹光貫斗月瑩太虛穆清官禁永鎮天居太上靈寶朝天謝罪大懴卷之二
