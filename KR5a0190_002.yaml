front:
  text: 太上靈寶朝天謝罪大懴卷之二露二爾時元始上帝於赤明劫初在玉清大羅天上南丹開陽上館火鍊宫中大會群仙四方天帝無量天人玉童玉女持符執節燒香散花吟詠洞章旋繞天寶妙臺龍燭鳯燈羅列照耀至尊聖德巍巍歎未聞見是時元始上帝以大威力布大祥光普照十方無量國土皆同一相表裏開通一如琉璃清瑩無礙十方大聖一切侍真隨至尊祥光下見十方萬國九州山河大地人民苦樂地獄天堂罪福果報如在目前是時諸天神王三府靈官列班朝禮進呈天下國土人民罪福之籍一一分明並無差忒是時有玉清真人金華真人與會中一切神仙燒香局蹐朝拜至尊今日忝預法筵面禮慈光觀聽法音開導塵迷咸使悟道實為夙慶元始上帝告左右侍真曰吾嘗在玉清天中下觀一切兆民積善崇福者皆有福報見有廣造經像立觀度人布施齋戒濟生度死普救一切者生天王國主身供養三寶燒香然燈誦經禮拜廣建福田救災拔難者生皇后國母身信樂經法持齋念道布施貧乏者生冨貴聰明身常行慈悲濟生度死崇奉三寶燒香不怠者生清淨出家身信奉修行供養星辰者生長命清淨端正身成就宫觀建立靈壇者生大冨貴聰明身布施救貧成就功德無所吝惜者生天人中身不殺不盜不嫉不害者生長命具足身供養三寶憐念一切慈悲於物者生高上豪貴身子孫昌盛長命冨貴者從供養天尊大道星辰中來夫妻和睦男女柔順者從不隔恩愛中來在處得人敬仰甘膳美衣者從敬奉天地禮信三寶中來見世尊勝豪貴人見畏懼者從敬信三寶中來出家法身為人敬奉者從説法教化中來冨貴巍巍永劫不衰者從布施成就功德中來身心清淨智慧明了者從護持經法中來所居快樂無諸災厄者從放生救物不害衆生中來子孫豐足冨貴長壽者從廣行布施求福中來女人降生貴子夫婦常敬愛者從道場教化信心中來形容端正笑語柔和衆人恭敬者從供養三寶持奉經戒中來巳上福報皆生世祖禰隂德種植致得今身之報或一身積善致使宿命善因得福無量元始上帝再謂左右神仙曰吾見毀壞天尊星辰大道形像者死入九幽地獄酆都考罰萬劫方生病癩百蟲啖噬臭穢身訾毀三洞經籙法典攺換品帙者死入地獄考罰百劫方生野獸舌根爛壞身誹謗出家法身者見世蟲癩過去生六畜身破壞宫觀靈壇毀拆真館者見世眉鬚墮落身體爛壞過去生毒蛇餓虎身不敬天尊大道星辰者見世愚癡憨疾過去生六畜鳥獸身不信經法宿命報對者見世為奴婢過去生蠻夷虜狄身輕慢出家法身穢汙三寶福地者見世跛躄過去生豬狗身淫犯出家陵辱法師者見世形容腥臭過去生糞穢厠溷毒蟲身邪淫好色不别尊卑者見世風邪過去生六畜豬羊牛馬身偷盜常住財物及四輩信施衣帛者過去生顚狂愚癡身偷盜三寶花果蔬菜齋食者見世得消渴飢病過去生餓虎毒蛇身偷盜齋醮供養法食者見世逢霹靂惡鬼殺害過去生蟒蛇毒蟲身又生餓狗毒猲身罵詈出家法身惡言陵辱者見世得風癎惡疾過去生狂狗猛獸身破齋犯戒者見世遭逢牢獄過去生蠅蛆螻蟻身殺害衆生恣心宰殺者見世得短命疾病牢獄考決身食肉貪殺六畜者見世百病困苦過去生麋鹿野獸身嗜酒過度好食葷辛臭穢者見世風狂猛火焚燒過去生猿猴身死入地獄鑊湯中又見一切衆生見世手腳斷壞拳縮跛足者從不敬三寶星辰中來兩眼雙盲舌根爛壞者從毀訾經教輕忽三寶中來瘖啞不能言語鼻塞不聞香臭者從誑説出家不信經法中來眉毛墮落唇攐舌露鼻梁崩倒者從破壞道場誹謗三寶中來顛狂迷妄形容醜陋者從嗊嗃傲慢非笑出家法身中來劫賊相逢傷害財物者從劫奪三寶常住財物中來水溺漂沉魚龍傷害者從損壞三寶常住中來火燒灼爛毒蛇吞噬者從殺害出家毀拆觀舍中來毒蟲入口吐血穢汙者從惡口呪詛呌喚鬼神中來毒蟲入孔竅食啖虎狼猛獸傷害者從隂謀毒害欺心中來父母妻子離隔常不同居晝夜相罵者從嫉妬姦淫破人和合離人骨肉中來媅淫不避親疏好醜者從豬狗六畜中來嗜肉好殺嗜酒猖狂者從魚鱉蝦蟆毒蟲猛獸中來身體穢汙不淨臭穢者從科蚪毒蟲中來牛馬六畜者從殺生負諱抵債中來野獸麞鹿蝮蝎蟒蛇者從嫉妬毒害隂謀中來餓虎豺狼者從欺陵劫奪殺傷中來厠溷穢蟲蝦蟆科蚪螻蟻者從輕褻三寶不生敬信中來猘犬野豬魚鱉怪蟲者從背師棄本違犯經教中來燕雀鳩鴿者從評論經法自作口業中來鷹鸇鷙鳥者從犯觸出家破毀經教中來墮子落胎腹大項細者從非笑三寶傲誕出家中來牢獄枷鎖考掠切身者從諂毒阿黨殘虐貧下中來鞭棓楚撻枷鎖牢獄者從毒害貪虐中來貓犬野犴豺狼狐貉者從貪吝虛誕矯詐中來鼠鼬蜈蚣蚰蜒生身者從隂毒妬害中來蜂蠆蠍毒蝘蜓蜥蜴者從呪詛出家欺忽三寶中來蜘蛛曲蟺蚊虻蚤蝨者從慢法輕道笑謗經籍中來邊夷下賤秃頭斷髮眼深鼻長身體腥穢者從殺生邪淫不信因緣中來元始天尊告左右侍真曰巳上罪業死經地獄受諸考罰歷劫受罪方得此身亦有見世業報生身所犯業報因緣一一明示各須澄心懴悔獲福無量元始天尊再告左右侍真曰下界若有奉道信心男女發無上誠心為皇后貴妃七廟天宗歷世貴族建三清寶座五帝星壇挂幡獻花百珍異果然香點燈大醮星辰拔贖魂儀者吾遣太乙救苦天尊開朱陵之闕丹簡紫籙出天尊懿號讃歎稱揚吟詠洞章解釋九幽滯𩲸宿業釋散五道開通逍遙無為超生福果一切罪犯並得消除是故燒香歸身歸命五體投地志心朝禮
