  - {type: variant, offset: 1830, length: 161, content: 元始上帝再告左右侍眞曰吾今以此經散布萬國九州十方世界若有奉道之民發無上道意遇三元八節之日爲帝王國主儲君太子燒香朝禮轉念三清寳號天尊眞人名位者安鎭國祚保天長存世世不絶長爲人君冲妙先生朝謝金闕上帝而獻頌曰上帝降命聖筭緜長金枝挺秀玉葉彌芳五星順序七曜垂芒赫赫煌煌空洞靈章福我聖皇寳祚無疆天清地寧萬宇輝光太上靈寳朝天謝罪大懴卷之一, CK-KZ: ''}
