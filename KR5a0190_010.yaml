body:
  text: 志心朝禮玉清聖境虛無自然元始天尊上清真境太上道君靈寶天尊太清仙境太上老君道德天尊太上昊天至尊金闕玉皇上帝南極星主紫微上宫天皇大帝中天星主紫微中宫北極大帝承天效法厚德光大后土皇地祇南極長生大帝統天元聖天尊東極青華大帝太乙救苦天尊貞明大聖九天應元雷聲普化天尊九天雷祖大帝除災濟物天尊紫微碧玉宫太一大天帝保制劫運天尊六天洞淵大帝伏魔上上太一天尊六波天主帝君普施法潤天尊九天可韓司丈人朱陵度命天尊九天採訪使應元保運妙化天尊東方九氣天中青靈始老洞空天尊南方三氣天中丹靈真老洞清天尊西方七氣天中皓靈皇老洞虛天尊北方五氣天中五靈玄老洞微天尊中央一氣天中玄靈元老洞真天尊志心朝禮下方真皇洞神天尊志心朝禮積功成聖天尊志心朝禮凝神照境天尊志心朝禮和神利物天尊志心朝禮總領衆靈天尊志心朝禮幽照無極天尊志心朝禮善斷迷惑天尊志心朝禮好解羅網天尊志心朝禮瓊瑶寶蓋天尊志心朝禮朱景洞照天尊志心朝禮體悟萬行天尊志心朝禮洞淵微妙天尊志心朝禮萬行圓滿天尊志心朝禮無量玉皇天尊志心朝禮大乘空惠天尊志心朝禮還功報德天尊志心朝禮隱迹全道天尊志心朝禮髙皇洞晨天尊志心朝禮紫霞浮蓋天尊志心朝禮法雲流潤天尊志心朝禮闡揚妙法天尊志心朝禮尊妙無雙天尊志心朝禮玄智逺照天尊志心朝禮變見法界天尊志心朝禮威降慈緣天尊志心朝禮湛寂體玄天尊志心朝禮玉京垂惠天尊志心朝禮保度應運天尊志心朝禮太微光範天尊志心朝禮真相具足天尊志心朝禮導世無遺天尊志心朝禮法緣常濟天尊志心朝禮勸發無礙天尊志心朝禮大光常照天尊志心朝禮道氣含育天尊志心朝禮降伏強梁天尊志心朝禮延光布像天尊志心朝禮永證道源天尊志心朝禮妙福無邊天尊志心朝禮志節微妙天尊志心朝禮常傳真戒天尊志心朝禮道惠圓滿天尊志心朝禮光德具足天尊志心朝禮無量增益天尊志心朝禮華蓋浮雲天尊志心朝禮沖和淨樂天尊志心朝禮玄隱無為天尊志心朝禮幽源不測天尊志心朝禮永住無相天尊志心朝禮陶化四生天尊志心朝禮太虛常寂天尊志心朝禮紫虛觀微天尊志心朝禮證真靜意天尊志心朝禮紫府凝神天尊志心朝禮恆遊寂處天尊志心朝禮信樂正法天尊志心朝禮勝業潛耀天尊志心朝禮默念無為天尊志心朝禮髙真定智天尊志心朝禮玄臺勤德天尊志心朝禮群靈普衛天尊志心朝禮揮靈妙用天尊志心朝禮凝神生惠天尊志心朝禮乘景浮生天尊志心朝禮救度八難天尊志心朝禮延壽無盡天尊志心朝禮寂住玄都天尊志心朝禮和光隱妙天尊志心朝禮窈冥神化天尊志心朝禮清淨真意天尊志心朝禮慧業廣德天尊志心朝禮至極安樂天尊志心朝禮端靜凝和天尊志心朝禮最勝妙果天尊志心朝禮善救世界天尊志心朝禮湛相淳和天尊志心朝禮百寶勝嚴天尊志心朝禮廣布神化天尊志心朝禮髙虛最妙天尊志心朝禮開化玄宗天尊志心朝禮南丹暉惠天尊志心朝禮朱靈寶德天尊志心朝禮妙力寶王天尊志心朝禮虛極垂感天尊志心朝禮慈和忍愛天尊志心朝禮尊貴無邊天尊志心朝禮寧撫萬神天尊志心朝禮宴豫景像天尊志心朝禮總朝上帝天尊志心朝禮玄理垂文天尊志心朝禮西那靈應天尊志心朝禮善導洪源天尊志心朝禮雲華見相天尊志心朝禮凝寂金闕天尊志心朝禮善消魔試天尊志心朝禮元皇真一天尊志心朝禮靈應無極天尊志心朝禮無滯無著天尊志心朝禮玉清金相天尊志心朝禮北真錬妙天尊志心朝禮無礙慈惠天尊志心朝禮九幽拔罪天尊志心朝禮隨願往生天尊志心朝禮慈悲救苦真人志心朝禮慈悲救度真人志心朝禮慈悲大惠真人志心朝禮慈悲轉輪真人志心朝禮玄通真人志心朝禮太妙真人志心朝禮九光真人志心朝禮普慈真人志心朝禮拔難真人志心朝禮護命真人志心朝禮救死真人志心朝禮廣惠真人志心朝禮度命真人元始上帝告五帝神仙三界衆聖曰吾今演説天尊寶號真人名位遣救苦真人齎此真經降下人間散布十方使一切天人解悟皆得神仙若有奉道之人修真男女每遇三元五臘本命生辰為上世亡魂六親父母追薦幽魂懴謝夙生罪犯或陷身在六畜群毛水族蛟蜃濕居鱗甲一切蠢動之中乞出離苦惱返生人道神仙接引魂度南宫夙劫重殃咸皆釋放獲福無量志心朝禮德山福地仙官聖衆藍水福地仙官聖衆玉峰福地仙官聖衆天目山福地仙官聖衆商山福地仙官聖衆張公洞福地仙官聖衆魚湖洞福地仙官聖衆中條山福地仙官聖衆司馬悔山福地仙官聖衆綿竹山福地仙官聖衆甘山福地仙官聖衆瑰山福地仙官聖衆金城山福地仙官聖衆雲山福地仙官聖衆北邙山福地仙官聖衆武當山福地仙官聖衆女几山福地仙官聖衆少室山福地仙官聖衆廬山福地仙官聖衆西山源福地仙官聖衆南田山福地仙官聖衆玉蟠山福地仙官聖衆别本作玉琉抱犢山福地仙官聖衆元始上帝再告左右真人曰吾今遣救苦真人齎此寶經散布下方使一切人天轉禮為上世亡魂六親眷屬追薦懴悔幽魂受度仙化成人超淩三界逍遙上清若有男女世人三元八節拜表上章虔謝天地修奉清齋誦詠三清寶號諸天真人為地獄幽魂群毛六畜水族濕居一切蠢動懴除罪犯乞洗滌夙殃者普使拔出地戶永離鬼官轉化成人普得超度沖妙先生燒香朝謝金闕上帝而獻頌曰玉帝垂靈貺天宣告萬靈救拔九幽苦廣演三洞經名奏南丹府魂超北寒庭永離炎鑊獄徑出氷池城神仙同救度逍遙上太清太上靈寶朝天謝罪大懴卷之十
