front:
  text: 太上靈寶朝天謝罪大懴卷之十露十爾時元始上帝在大羅天上金闕之內寶臺之中大集群仙廣演妙法救度人倫時有天仙地仙水仙三府靈官五嶽四瀆地府百司各整威儀理劒整佩參駕雲龍上朝天闕列班燒香立侍瓊軒各進呈四方分野兆民生死罪福之籍是時元始上帝示大威神逺布祥光照耀萬國山河大地細微罪業無不盡見是時金華真人玉清真人妙行真人救苦真人燒香朝拜至尊上奏言曰今覩下土衆生多不信奉恣縱身心長行苦毒殺害衆生三毒口業罪殃深重為十直之神司命司録寫其罪犯上奏天府歷劫纏結無由解脫禍福賞罰毫分不差見諸衆生在世積善長行隂騭者天氣蓋之地氣載之星辰照之鬼神敬之五福隨之千災離之或見在世積諸罪業行諸苦毒者天不蓋之地不載之星辰不照之鬼神害之五福逺之千災隨之臣等觀見甚可哀傷伏願上帝天慈大開方便普為救度咸使了悟至道出離垢濁是時至尊告諸大真人曰吾憫下方世界一切群生猶如赤子皆令得道只為衆生罪殃深厚長居不淨恣縱情欲多有穢汙在世生身長行淫欲或在宫殿星辰靈觀行諸淫欲或在神廟社壇行諸淫欲或捉人殘害離人子母奪人男女别人恩愛隔人憐念或六親通同或骨肉會合或誘人奴婢不擇妍醜或不擇賢愚或疆抑男女或分割夫妻或染汙出家或裸露天地侵陵四輩行多淫欲意想惡夢交接無所不至放縱六情無量無邊結在身心昏迷六識精氣衰竭罪犯深重今日懴滌咸乞消滅元始上帝再告左右侍真曰吾見下方男女捨身生身動意常行偷盜或偷盜天尊聖像經法財物或偷盜出家法師財物或偷盜靈觀星壇財物或偷盜修造尊像財物或偷盜莊田常住財物或偷盜齋醮供養財物或偷盜廟祀鬼神財物或偷盜父母男女財物或迫脅勢力財物或行官事誑呼財物或非義強抑財物或下脫矯妄財物或貪愛借貸財物或借貸扺拒不償財物或欺負黯黮陵忽非義財物凡起一念偷盜不論多少無量無邊罪業隱藏在身未曽發露首謝今日燒香禮懴悔過一切罪咎咸乞蕩除元始上帝再告左右侍真曰吾觀下界衆生積財如山心常不足貪愛無猒役心運智勞苦四大略無惠心立身在世貪心刻削或見天尊星辰生慳貪心或見靈觀經法生慳貪心或見道士法師生慳貪心或見父母男女生慳貪心或見貧窮孤老生慳貪心或見死亡殘疾生慳貪心或見牢獄枷鎖生慳貪心或見荒年飢餓生慳貪心或見行旅囚徒生慳貪心或見水火急難生慳貪心或見奴婢役夫生慳貪心或見天仙星宿不肯布施或見天尊靈壇不肯布施或見經籙齋醮不肯布施或見寫經造像不肯布施或見大德法師不肯布施或見貧窮孤老不肯布施或見囚徒枷鎖不肯布施或見疾病困苦不肯布施或見水火急難不肯布施或見行旅急切不肯布施或見荒年飢餓不肯布施夫人生一日之活百年生計生既不將一錢來死亦不將一錢去一朝身殁萬事皆空幾許愚癡慳貪吝惜略無慈心氣絶死亡七寶珍玩屋宅庫藏莊田地土盡屬他人妻子悲啼骨肉分散有何所益生存積業一一受報不忍聽聞吾又見下界衆生終日積罪業貪毒縈心刻削孤貧略無恤念或於天尊聖像前生諸瞋怒心或於宫觀經法前生諸瞋怒心或見道士出家生諸瞋怒心或見寫經造像生諸瞋怒或見齋醮道場生諸瞋怒或見廟庭鬼神生諸瞋怒或見老病孤貧生諸瞋怒或見牢獄囚徒生諸瞋怒或見生死急難生諸瞋怒或見水火凶災生諸瞋怒或見荒年飢餓生諸瞋怒或見奴婢役夫生諸瞋怒或見孤貧求乞生諸瞋怒或見牛馬六畜生諸瞋怒如是等心業無量無邊立身處世舉心措意略無慈忍今日歸命懴謝咸乞滅除元始上帝曰吾觀下界衆生處世立身六識暗昧略無片善或於天尊聖像前行諸愚癡或於星辰大道前行諸愚癡或於宫觀玄壇前行諸愚癡或於經籙道場行諸愚癡或見道士出家行諸愚癡或見虛空賢聖行諸愚癡或見父母妻兒行諸愚癡或見天地日月星辰行諸愚癡或罵詈天地呪詛鬼神或逆叛君父不孝宗親或返凶作禍立法亂常內淫骨肉外殺他人不信罪福因緣宿命報對謂自己長存不生不滅不分善惡不識賢愚如此愚癡不忍觀見諸大真人燒香朝謝金闕上帝自今日巳後普願下界一切衆生身心口意三業並皆釋放常得六根清淨永無爭競常行柔軟心調和心慈愛心不放逸心不傲慢心無貪吝心長行歡喜心常生不殺救護心常行孝義忠信心常行濟貧拔難心常生利物饒潤心若人行如是心即有十天善神衛護永消世厄散滅罪殃永無憂怖神仙接引皆得超度元始上帝再告左右侍真曰自今巳後下界群生若有善信奉道之人為一切愚癡罪障惡業及飛走群毛鳥獸六畜等建立靈壇誦經禮懴然燈燒香拜表上章醮謝天地日月星辰五嶽四瀆酆都冥官精心不退者吾遣太乙救苦天尊開北靈紫館琅玕藏中出碧簡金文天尊懿號稱揚讃歎吟詠洞章思真念道乞削落九幽長夜靈官之府玉匱之函使五苦並原三塗解釋脫落群毛永離罪業盡得超度返身人道不滯苦難長處逍遙所願遂心是故燒香歸身歸命五體投地
