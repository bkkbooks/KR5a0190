front:
  text: 太上靈寶朝天謝罪大懴卷之六露六爾時元始上帝在大羅天宫黃金殿內七寶幃中大顯威神祥光輝爍照曜天地真仙侍衛無鞅數衆建節捧香羅列左右步虛旋繞讃歎至尊時見天仙地仙水仙各整威儀上朝金闕進呈萬國九州兆民生死罪福之目姓名功過毫分不失是時元始上帝謂左右侍真曰吾觀一切有情皆是虛假念念滅壞曾不暫停苦惱輪回凡夫不覺三途往返萬劫辛酸受身生身煩惱纏縛皆由妄想顚倒執見關心生死存亡不能自出甚可哀傷是時法㑹中有金華真人廣福真人端簡整佩出班燒香朝拜金闕上帝臣等積善深厚位列玉清得侍左右恭聽法音開示群品今見下方一切衆生不顧宿命不遵經法是非爭競六識昏迷五毒縈心造業之時無所畏懼或呌喚鬼神以為救助或上指三光七祖以為盟誓六親相殘傷殺無道臨命終時戀其室宅財寶愛惜本身顧憐妻女心迫情切或發惡願債主𡨚家俱在目前沉淪五道無由解脫伏願天慈大開恩宥救度群倫出離幽冥咸使悟道是時元始上帝告侍真曰吾觀下界衆生妄想顚倒皆從心起强生分别繫念在心觸境生迷舉心皆妄當自定志智慧觀身骨肉肌膚形骸毛髮六根四大五藏百神諦想思惟總無實處共相假合結聚成身表裏尋求我在何處身既是假心即成空空假非真悉為妄想是非憎愛貪著色聲香味觸法嫉妬慳貪殺盜邪淫綺言惡罵凡諸作業泯爾皆除內外清虛自悟真道元始上帝告侍真曰汝等定智觀身總無實處人之執見者為六根三業未淨一曰眼根二曰耳根三曰鼻根四曰舌根五曰身根六曰意根夫六根者能生諸業猶如草木生諸花葉子實展轉六情六賊六欲能生諸業若能用智慧思惟六根諸業皆盡夫三業者一者身業二者心業三者口業身則殺盜邪淫心則慳貪瞋怒口則綺言妄語惡口兩舌共成十惡諦思十惡悉是浮虛但自三業及六根漸自除滅損之又損久能行之真道自悟元始上帝告左右侍真曰吾念下界衆生歷劫以來運心起意多有虛妄並不真淳多有綺言或於天尊聖像前行諸綺言或於經法道場前行諸綺言或於父母尊親前行諸綺言或於賢人長者前行諸綺言或於豪貴長者前行諸綺言或於聰明識解前行諸綺言或於諸天聖衆日月星辰前舉心皆行綺言其罪深重今日恭對三寶靈壇前懴謝咸乞蕩除吾念衆生立身運心綺言妄語惡口兩舌嫉妬勝巳鬪亂是非離人骨肉反虛成實轉僞為真今日懴悔皆令清淨得入信根元始上帝告左右侍真曰吾觀下界衆生立身以來眼耳鼻舌起意造惡殺生偷盜邪淫放蕩慳貪瞋怒愚癡顚倒綺言妄語惡口兩舌嫉妬勝巳飲酒食肉違犯三光皆真向僞信邪倒見禱祀鬼神不奉三寶訾毀嗊嗃輕慢傲誕媅滯色欲染習香味沉迷觸法內造外作展轉相生六根互起更相成愆罪根增長念念成非有無量罪數結習來久總在身中不可稱計一發念心皆得清淨猶如明鑑塵埃蒙蔽脂垢積聚生翳內外不明一旦遇良工拂拭磨洗表裏光徹逺近洞照還復如初何以故性本清淨人生亦爾神本清淨無諸滓穢但受形之後漸染成愆六根六情六賊六欲六識分别妄作穢弊生身障翳失其真性流浪生死動入罪根報對相纏便入地獄受諸苦惱萬劫輪轉吾以慈悲憐念衆生故從劫到劫轉輪人間或生夷夏或老或少或貴或賤種種方便教化度脫衆生經教流傳開悟一切使離苦惱永出泥犁但衆生智劣不能解悟我今為汝分别罪福因緣令一切衆生悉得解脫元始上帝謂衆真曰若有下方善信男女受持此經燒香懴悔洗滌身中一切苦惱悉得清淨消無量無邊宿根惡業諸天上聖一切神仙常欲令人勤燒香懴悔則有十天善神保護衆聖護持若罪根結身內外纏縛則惡神考害疾病纏身水火刀兵毒蟲猛獸枷鎖牢獄衆苦害身凡夫惟知外飾面目衣服手足不能內洗身心罪根惡業可不愚哉若夫面目手足衣服等事勤加洗濯必得清淨值遇神仙皆獲福慶元始上帝告左右侍真曰下界若有奉道男女於古觀靈壇或本居淨室為先亡祖考建三清寶座五帝靈壇誦經禮懴大醮諸天吾遣太乙救苦天尊開紫微寶藏玉簡丹文出天尊懿號讃歎稱揚吟詠洞章乞削落盟真九幽玉匱之函普使人天離苦解脫消歷劫罪獲無量福是故燒香歸身歸命五體投地
