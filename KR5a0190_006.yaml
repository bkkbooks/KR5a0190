body:
  text: 志心朝禮玉清聖境虛無自然元始天尊上清真境太上道君靈寶天尊太清仙境太上老君道德天尊太上昊天至尊金闕玉皇上帝南極星主紫微上宫天皇大帝中天星主紫微中宫北極大帝承天效法厚德光大后土皇地祇南極長生大帝統天元聖天尊東極青華大帝太乙救苦天尊貞明大聖九天應元雷聲普化天尊九天雷祖大帝除災濟物天尊紫微碧玉宮太一大天帝保制劫運天尊六天洞淵大帝伏魔上上太一天尊六波天主帝君溥施法潤天尊九天可韓司丈人朱陵度命天尊九天採訪使應元保運妙化天尊東方九氣天中青靈始老洞空天尊南方三氣天中丹靈真老洞清天尊西方七氣天中皓靈皇老洞虛天尊北方五氣天中五靈玄老洞微天尊中央一氣天中玄靈元老洞真天尊志心朝禮東南方好生度命天尊志心朝禮開拔苦魂天尊志心朝禮因緣髙仙天尊志心朝禮解悟普照天尊志心朝禮無名太玄天尊志心朝禮神化髙素天尊志心朝禮開功保命天尊志心朝禮戒生紫虛天尊志心朝禮大聖聖王天尊志心朝禮大洞成清天尊志心朝禮結威八神天尊志心朝禮明真智明天尊志心朝禮升玄真明天尊志心朝禮紫府仙靈天尊志心朝禮慧觀明仙天尊志心朝禮青宫妙真天尊志心朝禮無礙保生天尊志心朝禮保命戒生天尊志心朝禮日新大乘天尊志心朝禮法華妙樂天尊志心朝禮流電雲宫天尊志心朝禮霞想凝湛天尊志心朝禮萬變太和天尊志心朝禮朱湛妙霞天尊志心朝禮蓋天法王天尊志心朝禮六覺玄通天尊志心朝禮太清洞真天尊志心朝禮廣天妙運天尊志心朝禮法海寶心天尊志心朝禮天皇升極天尊志心朝禮道行真空天尊志心朝禮五老梵行天尊志心朝禮妙虛玄通天尊志心朝禮寶明慧解天尊志心朝禮救生正真天尊志心朝禮朱花妙彩天尊志心朝禮尊神戒生天尊志心朝禮權實真一天尊志心朝禮重玄應感天尊志心朝禮慈光朱日天尊志心朝禮妙果素月天尊志心朝禮度緣應變天尊志心朝禮妙定三天天尊志心朝禮玄照幽運天尊志心朝禮道德真空天尊志心朝禮本際上靈天尊志心朝禮七映北真天尊志心朝禮虛玄光相天尊志心朝禮開明一切天尊志心朝禮慧真延壽天尊志心朝禮寂然應玄天尊志心朝禮妙尊金華天尊志心朝禮威光淨明天尊志心朝禮道智洞玄天尊志心朝禮混成凝虛天尊志心朝禮雲宫清華天尊志心朝禮成就太玄天尊志心朝禮明黃道君天尊志心朝禮上品福慶天尊志心朝禮寶應仙飛天尊志心朝禮妙元朱光天尊志心朝禮仙靈普朗天尊志心朝禮仙道普度天尊志心朝禮智識玄靜天尊志心朝禮正觀上宫天尊志心朝禮大洞無量天尊志心朝禮智悟上京天尊志心朝禮照明萬方天尊志心朝禮明真玉洞天尊志心朝禮應心普救天尊志心朝禮决定太清天尊志心朝禮護魂無滯天尊志心朝禮妙典寶開天尊志心朝禮仙梵法王天尊志心朝禮玄照大明天尊志心朝禮金暉靈寂天尊志心朝禮救生觀空天尊志心朝禮上靈金華天尊志心朝禮素果妙樂天尊志心朝禮靈寶自然天尊志心朝禮華明光運天尊志心朝禮丹元無上天尊志心朝禮仙靈妙寂天尊志心朝禮運華明智天尊志心朝禮光明神威天尊志心朝禮戒生摧魔天尊志心朝禮方廣運朗天尊志心朝禮神功道明天尊志心朝禮東華法丹天尊志心朝禮潜功隨方天尊志心朝禮上明普景天尊志心朝禮神寶寂然天尊志心朝禮金輿玉寶天尊志心朝禮大羅靈真天尊志心朝禮玄運大照天尊志心朝禮寂然紫度天尊志心朝禮合成凝湛天尊志心朝禮遍明神道天尊志心朝禮金城凝寂天尊志心朝禮嚴淨無等天尊志心朝禮九幽拔罪天尊志心朝禮隨願往生天尊志心朝禮慈悲救苦真人志心朝禮慈悲救度真人志心朝禮慈悲大惠真人志心朝禮圓淨真人志心朝禮慈救真人志心朝禮慈照真人志心朝禮瓊華真人志心朝禮景玄真人志心朝禮明空真人志心朝禮明玄真人志心朝禮明上真人志心朝禮萬道真人志心朝禮景明真人元始上帝告左右侍真天地水府三官一切聖衆曰吾今以此諸天尊名號下降人間遣金華真人遍布萬國九州使一切人民禮誦若有清真之士奉道之人或遇三元八節五臘十直生日忌辰為七世幽魂先祖父母一切羣生修齊行道請道士法師步虛讃歎拜表上章禮謝天地日月星辰地府冥官水府仙者即有十直靈官奏上諸天蒙此功德拔離五苦度脫三塗上登朱陵府下入開光門神仙同接引萬世福長存普天皆獲慶浩劫荷天恩志心朝禮蓬萊山得道一切神仙榑桑山得道一切神仙方丈山得道一切神仙滄浪山得道一切神仙瀛洲上真得道一切神仙祖洲上真得道一切神仙聚窟洲上真得道一切神仙炎洲上真得道一切神仙鳯麟洲上真得道一切神仙玄洲上真得道一切神仙流洲上真得道一切神仙長洲上真得道一切神仙元洲上真得道一切神仙生洲上真得道一切神仙天下三十六靖廬仙官天下二十八治名山得道一切神仙元始上帝再告左右侍真曰吾今遣玉清真人齎此經降下人間使一切衆生散布供養四時轉念上消天災下禳毒害增福無量若有積善之民遇三元八節本命忌辰為亡過先祖父母幽魂追薦冥福燒香禮誦三清寶號諸大真人名位願上世亡魂使所生父母一切𡊥民生生獲福早遇神仙身臻五福長享自然沖妙先生朝謝金闕上帝而獻頌曰玉帝宣天㫖普放幽夜魂八難俱解釋五道悉開通酆都絶報對上朝朱陵宫羣生悟至道永享福無窮太上靈寶朝天謝罪大懴卷之六
