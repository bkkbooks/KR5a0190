body:
  text: 志心朝禮玉清聖境虛無自然元始天尊上清真境太上道君靈寶天尊太清仙境太上老君道德天尊太上昊天至尊金闕玉皇上帝南極星主紫微上宫天皇大帝中天星主紫微中宫北極大帝承天效法厚德光大后土皇地祇南極長生大帝統天元聖天尊東極青華大帝太乙救苦天尊貞明大聖九天應元雷聲普化天尊九天雷祖大帝除災濟物天尊紫微碧玉宫太一大天帝保制劫運天尊六天洞淵大帝伏魔上上太一天尊六波天主帝君普施法潤天尊九天可韓司丈人朱陵度命天尊九天採訪使應元保運妙化天尊東方九氣天中青靈始老洞空天尊南方三氣天中丹靈真老洞清天尊西方七氣天中皓靈黃老洞虛天尊北方五氣天中五靈玄老洞微天尊中央一氣天中玄靈元老洞真天尊志心朝禮西方太妙至極天尊志心朝禮行明上道天尊志心朝禮蕭然紫桂天尊志心朝禮凝尊金容天尊志心朝禮凝光金洞天尊志心朝禮三光神耀天尊志心朝禮紫清九仙天尊志心朝禮天中大行天尊志心朝禮廣運道空天尊志心朝禮上真道運天尊志心朝禮仙道運度天尊志心朝禮朱光重玄天尊志心朝禮大廣運明天尊志心朝禮隨順世間天尊志心朝禮玄寂一乘天尊志心朝禮金殿妙尊天尊志心朝禮逍遙三乘天尊志心朝禮觀行仙靈天尊志心朝禮飛天法王天尊志心朝禮清元訓廣天尊志心朝禮太和一乘天尊志心朝禮真運明行天尊志心朝禮金慈玉寶天尊志心朝禮開明解智天尊志心朝禮解脫重玄天尊志心朝禮最勝空明天尊志心朝禮解脫暉光天尊志心朝禮戒生法王天尊志心朝禮妙寶金城天尊志心朝禮寂然太真天尊志心朝禮洞元萬果天尊志心朝禮素王妙樂天尊志心朝禮玄應洞聽天尊志心朝禮普慈光映天尊志心朝禮天仙無礙天尊志心朝禮真覺仙靈天尊志心朝禮遍悟玄會天尊志心朝禮善果隨受天尊志心朝禮妙勝重玄天尊志心朝禮妙道明光天尊志心朝禮凝寂金寶天尊志心朝禮因緣無隱天尊志心朝禮光明髙運天尊志心朝禮大乘無為天尊志心朝禮青華主算天尊志心朝禮運明慧通天尊志心朝禮萬仙救生天尊志心朝禮金景妙寂天尊志心朝禮行成仙道天尊志心朝禮遍周六道天尊志心朝禮明化神運天尊志心朝禮上景真空天尊志心朝禮妙彩朱威天尊志心朝禮運道丹天天尊志心朝禮洞元仙嚴天尊志心朝禮洞元萬功天尊志心朝禮丹質妙光天尊志心朝禮朱湛妙果天尊志心朝禮法海廣華天尊志心朝禮方期洞元天尊志心朝禮無等應感天尊志心朝禮運明仙慶天尊志心朝禮妙寂金鏡天尊志心朝禮三天照明天尊志心朝禮洞靈朱明天尊志心朝禮慧功普朗天尊志心朝禮洞靈果明天尊志心朝禮普度丹景天尊志心朝禮慧炬上靈天尊志心朝禮拔苦慈慧天尊志心朝禮妙湛金彩天尊志心朝禮仙道廣度天尊志心朝禮道運髙應天尊志心朝禮道運真行天尊志心朝禮丹元無礙天尊志心朝禮度人北元天尊志心朝禮無邊遍被天尊志心朝禮開化王宫天尊志心朝禮妙道應明天尊志心朝禮至照道運天尊志心朝禮大梵中仙天尊志心朝禮神通照道天尊志心朝禮救生上化天尊志心朝禮諸天玉真天尊志心朝禮金山嶷然天尊志心朝禮道運萬空天尊志心朝禮玉華妙樂天尊志心朝禮增益善智天尊志心朝禮真相靜明天尊志心朝禮雲宫重玄天尊志心朝禮開朗神解天尊志心朝禮天皇真君天尊志心朝禮救生中元天尊志心朝禮普朗真人天尊志心朝禮虛無性常天尊志心朝禮玄紀戒生天尊志心朝禮隨方自然天尊志心朝禮最勝方便天尊志心朝禮漸妙玄會天尊志心朝禮德解洞玄天尊志心朝禮洞元仙寶天尊志心朝禮慧炬太真天尊志心朝禮神至響明天尊志心朝禮遍空飛駕天尊志心朝禮太玄寶丹天尊志心朝禮一切增益天尊志心朝禮行明高運天尊志心朝禮隨願往生天尊志心朝禮慈悲救苦真人志心朝禮慈悲救度真人志心朝禮慈悲大慧真人志心朝禮景虛真人志心朝禮平等真人志心朝禮大慈真人志心朝禮好生真人志心朝禮景上真人志心朝禮等曜真人志心朝禮靖慧真人志心朝禮智明真人志心朝禮妙慧真人志心朝禮明虛真人志心朝禮部録天師志心朝禮上奏天師志心朝禮除死天師志心朝禮定生天師志心朝禮保護天師志心朝禮普濟天師元始天尊再告左右侍真曰吾今出此天尊真人天師名號遣金華真人齎往下方散布萬國九州使一切人民懴悔朝謝或有清信賢者每遇本命生日燒香諷誦醮謝天地洞府神仙即有記名神王落死神王上生神王録其功德奏上諸天金帛豐足永保安寧或為儲君太子公主天親迎祥集慶大醮星辰獲福無量志心朝禮麻姑山丹霞洞天仙官仙都山玄都祈仙洞天仙官青田山青田大鶴洞天仙官鍾山朱湖太生洞天仙官良常山良常方會洞天仙官紫蓋山紫玄洞照洞天仙官天目山太極玄蓋洞天仙官桃源山白馬玄光洞天仙官金華山金華洞元洞天仙官海上東嶽廣桑山青帝洞仙官海上南嶽長離山赤帝洞仙官海上西嶽麗農山白帝洞仙官海上北嶽廣野山黑帝洞仙官海上中嶽昆崘山黃帝洞仙官元始上帝再告左右侍真曰吾今遣太一真人齎此經散布萬國九州遍使人天禮念延生保命集福消災若有奉道之民遇三元八節本命生辰轉禮三清寶號十方真人名位者身堅體固永保長生獲福無量沖妙先生燒香朝謝金闕上帝而獻頌曰挺秀雍熙運日奉至尊前身居龍鳯闕名籍繼諸仙燒香謝天蔭長誦希夷篇千生臻百福列位清微天永處逍遙境長享福自然太上靈寶朝天謝罪大懴卷之三
