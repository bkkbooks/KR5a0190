front:
  text: 太上靈寶朝天謝罪大懴卷之三露三爾時元始上帝在無上大羅天中玉京金闕之內坐天寶妙臺與太上玉晨道君太上聖祖太清老君大集群仙敷揚妙法講演經戒是時諸天大聖一切衆真燒香散花持旙執節吟詠洞章步虛讃歎功德巍巍未聞未見今日得詣寶軒列班侍立恭聽法音願賜開度是時元始上帝告左右侍真曰吾以威光普照無極世界下土兆民一切群生愚癡暗昧沉迷世網媅滯六欲不能自覺常處苦惱流浪生死並不開悟若有善信男女能發無上道意為一切衆生立三清寶座五帝靈壇挂旙獻花燒香朝禮轉念經懴為先祖宗親亡過父母妻子眷屬滅除罪犯使身心清淨常味靈音不墮惡道常行信奉懴謝前生今世舉心運心生不信奉心誹謗三寶毀壞三寶穢汙三寶戲弄三寶罵詈三寶呪詛三寶欺忽三寶傲誕三寶嗊嗃三寶訾毀經籙評論真偽攺易妄言強辨是非分别深淺言議短長形容不淨衣服不淨手腳不淨口氣不淨飲酒食肉啖嚼葷辛口出穢言心不恭敬或不淨手或不燒香或不漱口或不沐浴即入靈壇觸犯尊像穢辱真聖神仙天王力士玉女金童直壇靈官或對三清至真經法出家法師生不恭敬形容傲誕不肯信奉或乘車馬直入宫觀靈壇逼近尊像狼藉福地或見持齋受戒永不信奉或見禮經齋醮即便破亂以為妖妄或入道場法席高聲大語惱觸法衆或發言舉意道説是非較量真偽或倚恃三寶方便求財或假法教化誑惑百姓或費用三寶財物以養已身或恐愶出家求其長短以取財物養育妻子諸如上罪無量元邊今日發露心誠朝謝天地三寶星辰為光祖父母見存眷屬起懇首陳乞滅除罪犯內外清淨咸獲超度元始上帝再告左右侍真曰吾傷下土兆民見存在世三業六根罪業深重長行殺戮行諸苦酷不念慈心殺害群毛食啖六畜或為父母及已身兄弟妻兒延諸親族衆集鄉閭傷害衆生不計頭數或殺牛羊驢馬豬狗雞豚依人養牧芻豢之屬或殺麞鹿狐兔虎豹豺狼依泊山林野獸之屬或殺鵝鴨烏鵲鳩鴿鴟鳶鳬鶩鵁鶄飛禽之屬或殺蟲蛇虺蠍蜂蠆蚰蜒蜈蚣蜙蝑螻蟻之屬或殺黿鼉魚鱉螺蚌蝦蟇螯蟹蟛蜞水蟲之屬或殺𧏙蜋蠛蠓蝜蟠螟蛉蠍蠋丘蚓小蟲之屬或殺蚊虻蚤蝨蜉蝣蠌蝝𧍒蠕蛸翹化生之屬或飛鷹走犬張羅布網殺害衆生或放火燒山窮林竭澤殺害衆生或持弓矢刀杖殺害衆生或手揉足踏坐按卧捺殺害衆生或耕田種作打墻立壁殺害衆生或竪造舍宇穿坑出土拆籬作障殺害衆生或剖胎破卵熱湯潑地殺害衆生或對經像靈壇宫觀殺害衆生或禱祀鬼神或為嗔怒殺害衆生或命絶手中或身亡刀下或斷其頭足或剝裂皮毛或猛火煎燒或沸湯燖煮或生分子母斷其胎育或固絶命根令其磨滅或殺賢人道士或殺老弱女男或殺債主𡨚家或殺四方良善或恐殺怖殺毒藥殺呪殺罵殺或自殺教殺諸如上殺舉手動身殺害無數無量無邊罪業深重不忍聽聞今日若有奉道男女傾心露懇朝天禮謝拜表上章大醮三官放生續命布施財寶救濟孤貧燒香行道吟詠洞章步虛禮懴為七世祖禰亡過父母一切宗親懴滌罪犯攺惡修善洗滌身心所求皆遂所望皆成所救宗親咸得超度神仙接引逍遙無為名上南宫得歸人道獲福無量元始上帝再告左右侍真曰下界若有清信奉道之民或為水族介蟲蛟龍魚鱉蝦螺蚌蛤濕居毒獸一切魚龍建三清寶座五帝靈壇燒香然燈上章拜表懴謝水居業重之罪者吾遣太一救苦天尊於雲樓青簡金文寶藏出天尊懿號遍使人天稱揚讃歎吟詠洞章思神念道乞削落明真九幽長夜之函使一切水族介蟲離苦解脫滅無量罪咸獲超度是故燒香歸身歸命五體投地
