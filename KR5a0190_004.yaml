body:
  text: 太上靈寶朝天謝罪大懴卷之四露四爾時元始上帝在大羅天上玉京金闕紫微天臺大會群仙敷演妙法救度天人咸使悟道不歷諸苦施大威德放大光明普照萬國一切罪福俱在目前甚深微妙方便開度一切地獄窮魂苦毒無量痛楚難言並蒙恩救拔不溺沉淪咸得超度是時元始上帝慈悲廣洽更開要道使過去未來俱霑利益再告左右侍真曰人之稟生同資一氣及乎誕育命係三元壽夭吉凶冨貴貧賤因緣罪福善惡生死各逐宿命根源悉有報應隨其業力永不差移如影隨形似聲應響上元正月十五日天曹天官主録百司上詣天闕進呈世人罪福之籍七月十五日中元地官主録百司上詣天闕進呈世人罪福之籍十月十五日下元水官水府百司上詣天闕進呈世人罪福之籍三元之日與三界十方四司五帝善惡童子一切靈官上朝金闕元始座前考校男女生死之籍罪福因緣及九幽地獄水府窮魂姓名黑簿此時若有善信男女能發自然道意建造紫微寶臺玉京寶山樓閣臺榭百寶莊嚴香花供養燒香行道吟詠洞章然燈放生步虛法事布施發願謝過上章大建齋醮虔告天地晝夜不怠者吾當遣十天真人諸天神仙三界四司救苦靈童下降人間齊到道場為其滅罪保佑生人使國土安寧男女歡泰衆善齊降諸惡不生地獄苦魂一時解脫克生天上快樂無為率土太平功德巍巍獲福無量元始上帝再告左右侍真曰吾見十方無極世界十方天王造三十二層天臺寶盤悉以紫金珠玉錦縠紫網寶蓋紫節旌幢百花飲食器物百珍仙樂搖曳遍滿虛空來詣道場羅列供養爾時天尊以神通威力變此會中國土悉是琉璃洞徹內外皆同一色逺近平等不殊三界十方同霑福慶喜樂難言九幽罷對五苦停酸國土安寧人民長壽元始上帝再告左右侍真曰下界若有善信男女請道士法師常於三元節日宣説經戒罪福因緣懴悔自己受身不淨臭穢四大浮脆假合念念無常三業六根搆造諸惡漸染成愆輪回生死墮落三塗九幽地獄受諸苦惱吞火食炭鑊湯煎煮足履刀山手攀劔樹磑磨碓搗鋸解錐劖鐵鳥啄聙鐵犁耕舌牛頭亂拷鐵杖負身膿血流離身體爛壞沉淪黑暗流轉泥犁負石填河晝夜拷掠一入酆都地獄萬劫難原皆是衆生業力自受若有善信男女能發善心為七世祖禰及見存已身父母骨肉五苦三塗窮魂餓鬼畜生囚徒老病衆生造玉京髙座紫微天臺挂幡獻花百珍供養醮謝星宿拜表上章禮懴燒香滅諸罪源咸皆超度元始天尊告左右侍真曰若有善信男女於三元節日為一切人天建造齋醮轉經禮懴供養天尊神仙列曜星宿地府百司為祖考父母發片善心精誠不退過去未來三世父母獲福無量滅諸罪犯元始上帝告左右侍真曰吾見下土兆民多有凶禍邪鬼所害可為先亡祖考父母尊親五臘之日是天地開赦冝建齋行道禮懴上章救拔先祖咸得超度獲福無量正月一日天臘之日五帝神仙集於青天安寶華林青靈闕中校定世人罪福之籍五月五日地臘之日五帝神仙集於丹天梵寶昌陽丹靈朱闕校定世人罪福之籍七月七日道德臘之日五帝神仙集於金門素靈闕中校定世人罪福之籍十月一日民歲臘之日五帝神仙集於玄天洞隂黑靈闕中校定世人罪福之籍十二月遇臘日是王侯臘之日此日五方五帝集於玄都玉京元靈戊已金闕元始上帝八景殿中校定世人罪福之籍此五臘日皆是天地合攢之日定吉凶死生簿籍若有男女為過去先祖父母禮懴上表謝罪滅除黑簿罪目升度七祖父母入名上清皆得超度夫五臘日者皆生人九祖父母幽嶽鬼魂此日為酆都北隂大帝引出責問久處隂司年代積罪結釁端由及子孫姓名墳墓所在如積劫未有追贖因此日延纍生人引問得子孫親姻九族姓名為生人罪狀積釁幽司九族延滅此日可為先祖亡過父母上表懴謝宿愆追拔幽塗皆亡人一一得之常日祭祀不可得達為酆都幽深難為通徹沐賴真猷皆得宿愆解釋幽司不欲久滯死魂久滯則天曹責及幽司官吏亦責及生人轉福為禍災難自此而生若有至孝男女此日修奉齋醮即黑簿除名獲福無量皆得超度元始上帝告左右侍真曰下界衆生識見不同習惡造善根基各異今説要言各冝信奉若衆生好殺害損傷者即以慈悲門攝之若偷盜劫奪財物者即以分義門攝之若邪淫放蕩者即以貞潔門攝之若慳貪吝惜者即以布施門攝之若瞋怒鬬爭者即以歡喜門攝之若愚癡顚倒者即以方便門攝之若綺言浮華者即以簡正門攝之若妄語虛誑者即以信順門攝之若惡口呪詛者即以誦念門攝之若兩舌惡罵者即以讃歎門攝之若飲酒食肉過度者即以齋戒門攝之若誹謗訾毀者即以講説門攝之若倨傲輕慢者即以禮拜門攝之若剛強豪健者即以柔弱門攝之若不信罪福宿命者即以因緣門攝之若執繫有無者即以中道門攝之若是非彼我者即以平等門攝之若貪濁穢汙者即以清淨門攝之若堅固不移者即以輪轉門攝之若造作不休者即以無為門攝之若𡱈守不變者即以圓轉門攝之若躁競不安者即以靜定門攝之若煩惱不釋者即以解脫門攝之若憂悲不樂者即以逍遙門攝之以此二十四門常攝一切衆生不亦樂乎元始上帝曰吾本以無攝為攝勸化衆生衆生既悟亦無攝因若能持奉獲福無量元始上帝再告左右侍真曰下界兆庶若有清信奉道之民為九祖先逺父毋幽魂或於古觀靈壇或在本家淨室建三清寶座點七曜明燈燒香行道吟詠洞章轉禮經懴大醮諸天精誠不怠者五遣太乙救苦天尊於九氣天宫開七寶雲樓青簡金文出天尊懿號下降人間遍使人天禮念為削落九幽長夜玉匱之函使七祖超度魂上南宫神仙接引逍遙無為獲福無量是故燒香歸身歸命五體投地志心朝禮玉清聖境虛無自然元始天尊上清真境太上道君靈寶天尊太清仙境太上老君道德天尊太上昊天至尊金闕玉皇上帝南極星主紫微上宫天皇大帝中天星主紫微中宫北極大帝承天效法厚德光大后土皇地祇南極長生大帝統天元聖天尊東極青華大帝太乙救苦天尊貞明大聖九天應元雷聲普化天尊九天雷祖大帝除災濟物天尊紫微碧玉宫太一大天帝保制劫運天尊六天洞淵大帝伏魔上上太一天尊六波天主帝君普施法潤天尊九天可韓司丈人朱陵度命天尊九天採訪使應元保運妙化天尊東方九氣天中青靈始老洞空天尊南方三氣天中丹靈真老洞清天尊西方七氣天中皓靈皇老洞虛天尊北方五氣天中五靈玄老洞微天尊中央一氣天中玄靈元老洞真天尊志心朝禮北方玄上玉宸天尊志心朝禮玄明真仙天尊志心朝禮玄會慈恩天尊志心朝禮朱光妙果天尊志心朝禮妙果四極天尊志心朝禮無礙十華天尊志心朝禮運明靜行天尊志心朝禮運明真文天尊志心朝禮妙果正因天尊志心朝禮黃道運明天尊志心朝禮法海寶福天尊志心朝禮運明太虛天尊志心朝禮萬行靜定天尊志心朝禮金相凝神天尊志心朝禮靈融應體天尊志心朝禮上運智道天尊志心朝禮靈真丹天天尊志心朝禮運明妙空天尊志心朝禮元一天皇天尊志心朝禮無等開元天尊志心朝禮至道智明天尊志心朝禮齊物高勝天尊志心朝禮清響無等天尊志心朝禮靈顔妙光天尊志心朝禮上靈光照天尊志心朝禮明廣慧道天尊志心朝禮拔苦慈解天尊志心朝禮四宫真境天尊志心朝禮大洞體玄天尊志心朝禮洞玄開度天尊志心朝禮金光妙湛天尊志心朝禮結成騫林天尊志心朝禮雲宫法燈天尊志心朝禮至玄運道天尊志心朝禮慧光三天天尊志心朝禮自然流鈴天尊志心朝禮靜明玉帝天尊志心朝禮普朗業行天尊志心朝禮丹霍法成天尊志心朝禮寶林一乘天尊志心朝禮應會開闡天尊志心朝禮隨方傳法天尊志心朝禮中千常一天尊志心朝禮道運真空天尊志心朝禮上天妙嚴天尊志心朝禮長樂丹元天尊志心朝禮救生萬化天尊志心朝禮文真廣運天尊志心朝禮地皇神尊天尊志心朝禮皓素無等天尊志心朝禮華景一乘天尊志心朝禮正一三天天尊志心朝禮玉宫雲營天尊志心朝禮延壽慧真天尊志心朝禮重玄德真天尊志心朝禮流慈自然天尊志心朝禮七映妙光天尊志心朝禮太洞七元天尊志心朝禮上洞朱極天尊志心朝禮雲宫平等天尊志心朝禮道運光空天尊志心朝禮妙寶金緣天尊志心朝禮妙善真濟天尊志心朝禮丹紫無為天尊志心朝禮大運化道天尊志心朝禮紫極中華天尊志心朝禮延壽仙靈天尊志心朝禮法海瓊音天尊志心朝禮妙玄北真天尊志心朝禮真觀神真天尊志心朝禮妙玄道運天尊志心朝禮西明感化天尊志心朝禮期度仙道天尊志心朝禮廣明大道天尊志心朝禮開度解脫天尊志心朝禮仙靈普朗天尊志心朝禮朱宫妙樂天尊志心朝禮救生空觀天尊志心朝禮明智玄道天尊志心朝禮果成仙道天尊志心朝禮遍道上運天尊志心朝禮方便冥感天尊志心朝禮仙真南極天尊志心朝禮玄通長樂天尊志心朝禮正真法成天尊志心朝禮一切常度天尊志心朝禮無為丹元天尊志心朝禮寶明大度天尊志心朝禮朱因髙尊天尊志心朝禮無等清響天尊志心朝禮化成仙道天尊志心朝禮運明妙照天尊志心朝禮戒生明行天尊志心朝禮上道運明天尊志心朝禮妙果朱素天尊志心朝禮寂然紫度天尊志心朝禮金剛妙彩天尊志心朝禮拔苦慈恩天尊志心朝禮真空二氣天尊志心朝禮度厄應變天尊志心朝禮九幽拔罪天尊志心朝禮隨願往生天尊志心朝禮慈悲救苦真人志心朝禮慈悲救度真人志心朝禮慈悲大惠真人志心朝禮明皇真人志心朝禮照理真人志心朝禮普度真人志心朝禮至極真人志心朝禮普救真人志心朝禮慈覺真人志心朝禮玉臺真人志心朝禮金玄真人志心朝禮妙玄真人志心朝禮自在真人志心朝禮變化天師志心朝禮神妙天師志心朝禮皇上天師志心朝禮萬福天師志心朝禮太極天師志心朝禮玉晨天師元始上帝告諸神仙曰吾今降此天尊真人天師位號遣太清真人齎往下方散布萬國九州一切人天轉誦若有善信男女臻道之人每遇八節三元生辰本命轉禮經懴醮謝天地為三軍萬姓一切含生燒香朝謝使門戶昌隆世世榮盛子孫聰慧壽祿延永功德巍巍永消世厄志心朝禮東海廣德之神龍宫官屬南海洪聖廣利之神龍宫官屬西海廣潤之神龍宫官屬北海廣澤之神龍宫官屬江瀆廣源之神龍宫官屬河瀆靈源之神龍宫官屬淮瀆長源之神龍宫官屬濟瀆清源之神龍宫官屬浙江水府之神龍宫官屬吳江水府之神龍宫官屬楚江水府之神龍宫官屬荆江水府之神龍宫官屬揚子江水府之神龍宫官屬湘江水府之神龍宫官屬松江水府之神龍宫官屬南江水府之神龍宫官屬漢江水府之神龍宫官屬元始上帝再告左右侍真曰吾今降下此經散布十方世界遍使人天禮念獲生生福滅世世罪所求皆遂所願皆成世間若有奉道之民善信之家每遇本命生日八節三元燒香禮誦大建齋醮諷詠三清寶號真人名位上願三公輔弼將相寀寮拜表上章迎祥集福永臻冨貴長保遐齡沖妙先生燒香朝謝金闕上帝而獻頌曰天生明哲來贊昌期氷稜玉峭鳯質鸞姿燮調元化力贊雍熙農歌緑野兵戢四夷長臻五福永集天褀太上靈寶朝天謝罪大懴卷之四
