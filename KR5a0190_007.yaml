body:
  text: 志心朝禮玉清聖境虛無自然元始天尊上清真境太上道君靈寶天尊太清仙境太上老君道德天尊太上昊天至尊金闕玉皇上帝南極星主紫微上宫天皇大帝中天星主紫微中宫北極大帝承天效法厚德光大后土皇地祇南極長生大帝統天元聖天尊東極青華大帝太一救苦天尊貞明大聖九天應元雷聲普化天尊九天雷祖大帝除災濟物天尊紫微碧玉宫太一大天帝保制劫運天尊六天洞淵大帝伏魔上上太一天尊六波天主帝君溥施法潤天尊九天可韓司丈人朱陵度命天尊九天採訪使應元保運妙化天尊東方九氣天中青靈始老洞空天尊南方三氣天中丹靈真老洞清天尊西方七氣天中皓靈皇老洞虛天尊北方五氣天中五靈玄老洞微天尊中央一氣天中玄靈元老洞真天尊志心朝禮西南方太靈虛皇天尊志心朝禮道功真空天尊志心朝禮玄㑹為說天尊志心朝禮因果上光天尊志心朝禮度幽洞玄天尊志心朝禮玄㑹神妙天尊志心朝禮益智方便天尊志心朝禮湛然中天天尊志心朝禮梵行太皇天尊志心朝禮萬德洞玄天尊志心朝禮八景戒生天尊志心朝禮救苦真聖天尊志心朝禮天中萬變天尊志心朝禮光道至人天尊志心朝禮保命東華天尊志心朝禮靜定上因天尊志心朝禮金藏妙寶天尊志心朝禮八極洞幽天尊志心朝禮廣運無為天尊志心朝禮神玄道運天尊志心朝禮常保生神天尊志心朝禮丹紫緣感天尊志心朝禮淨明紫虛天尊志心朝禮真淨空㑹天尊志心朝禮行成真道天尊志心朝禮無量難賜天尊志心朝禮靈容妙彩天尊志心朝禮太元有音天尊志心朝禮玄㑹智力天尊志心朝禮玄都無滯天尊志心朝禮梵行無等天尊志心朝禮救生化道天尊志心朝禮玉清妙光天尊志心朝禮一切慈廕天尊志心朝禮寂然玄應天尊志心朝禮交神衆善天尊志心朝禮法主救生天尊志心朝禮地皇帝一天尊志心朝禮虛明上運天尊志心朝禮梵行衆妙天尊志心朝禮髙皇一切天尊志心朝禮洞宫妙寂天尊志心朝禮清光因果天尊志心朝禮應寂衆妙天尊志心朝禮直道真常天尊志心朝禮青華真志天尊志心朝禮萬淨真元天尊志心朝禮法通三界天尊志心朝禮保生開淨天尊志心朝禮明行天常天尊志心朝禮玄㑹悟開天尊志心朝禮道成真道天尊志心朝禮丹暉結成天尊志心朝禮法海太明天尊志心朝禮録妙安樂天尊志心朝禮決定無相天尊志心朝禮集虛西明天尊志心朝禮西靈玉曆天尊志心朝禮運明虛空天尊志心朝禮黃庭空運天尊志心朝禮丹景道真天尊志心朝禮延壽慧真天尊志心朝禮玄道朗慧天尊志心朝禮明經化運天尊志心朝禮仙映妙觀天尊志心朝禮真品元和天尊志心朝禮無相慧礙天尊志心朝禮普度丹景天尊志心朝禮金剛妙寶天尊志心朝禮善升六道天尊志心朝禮妙樂素華天尊志心朝禮開度保護天尊志心朝禮玉虛舟航天尊志心朝禮丹元慧廣天尊志心朝禮最勝無上天尊志心朝禮金臺妙寂天尊志心朝禮救物常善天尊志心朝禮至極保明天尊志心朝禮瓊璋寂然天尊志心朝禮玄㑹開悟天尊志心朝禮慧明遍覃天尊志心朝禮化成令威天尊志心朝禮究竟洞真天尊志心朝禮法被無際天尊志心朝禮度魂太清天尊志心朝禮仙靈虛應天尊志心朝禮金格拔幽天尊志心朝禮開祕丹元天尊志心朝禮重玄妙法天尊志心朝禮玄真道明天尊志心朝禮上宫玄解天尊志心朝禮妙樂紫素天尊志心朝禮寶運中千天尊志心朝禮玄虛解勝天尊志心朝禮隨順善果天尊志心朝禮百億感身天尊志心朝禮妙寶金相天尊志心朝禮益算聖王天尊志心朝禮寶衆真海天尊志心朝禮西明元洞天尊志心朝禮明運到景天尊志心朝禮九幽拔罪天尊志心朝禮隨願往生天尊志心朝禮慈悲救苦真人志心朝禮慈悲救度真人志心朝禮慈悲大惠真人志心朝禮景相真人志心朝禮明覺真人志心朝禮滿相真人志心朝禮景空真人志心朝禮景照真人志心朝禮明法真人志心朝禮妙景真人志心朝禮景慧真人志心朝禮化生真人志心朝禮相梵真人志心朝禮上聖天師志心朝禮虛皇天師志心朝禮無量天師志心朝禮明皇天師志心朝禮洞深天師志心朝禮普攝天師志心朝禮正一天師元始上帝告諸天神仙曰吾今以此經遣玉清真人齎往下界遍布萬國九州一切兆庶轉禮供養若有積善之人遇三元本命五臘之辰燒香轉誦大醮天地為上世幽魂所生父母一切宗親拔贖幽冥出離苦惱咸得超度轉化成人神仙接引上升天宫獲福無量志心朝禮黃河伯水府之神龍宫官屬洛河伯水府之神龍宫官屬淮河伯水府之神龍宫官屬巫峽溪真仙官聖衆五雲溪真仙官聖衆岷山溪真仙官聖衆清遠溪真仙官聖衆桐柏溪真仙官聖衆嶓𡺪溪真仙官聖衆昆崘溪真仙官聖衆武陵溪真仙官聖衆苧羅溪真仙官聖衆滌溪上真仙官聖衆洗沙溪真仙官聖衆沔池溪真仙官聖衆馬當山上水府之神龍宫官屬采石山中水府之神龍宫官屬金山下水府之神龍宫官屬元始上帝再謂侍真曰吾今遣金華真人降下此經散布萬國九州普使人天諷誦為見世父母亡過先祖一切羣生轉禮解釋宿殃虔心供養者使門户興隆世世昌盛萬災不千神明護門世間若有奉道之民善信男女遇三元五臘本命生辰修齊轉誦三清寶號玉軸金文為酆都地獄一切鬼神夙業罪犯咸願解除盡乞超度上升朱宫託生人道沖妙先生燒香朝謝金闕上帝而獻頌曰玉京元始尊生成萬化主靈文告三官下開九幽府酆都炎鑊獄慈悲灑法雨洗滌諸罪魂咸皆得超度太上露寶朝天謝罪大懴卷
