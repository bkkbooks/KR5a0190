front:
  text: 太上靈寶朝天謝罪大懴卷之七露七爾時元始上帝在大羅天中玉清宫內坐五雲天寶妙臺集諸天仙地仙水仙三界靈真無鞅數衆齊赴天闕上朝玉清燒香散花步虛旋繞朝拜至尊是時上帝大布威光廣演妙法念度一切咸使悟道時有上清真人太極真人妙行真人出班燒香朝拜至尊臣自歷劫以來叨居真列榮侍瓊軒每聽靈音開悟塵品長念下方兆庶流吹欲海飄浪愛河輪回生死不曾暫息未知作何善果出離沉淪盡獲超度是時元始上帝告左右侍真曰下界若有善信男女長行利益割口損身施捨財寶常作福田濟及鳥獸蠢動含靈普救飢寒最為第一若道邊開井建立屋宇種植果林撫養勞苦及於江河廣立橋梁運度行旅勤行不倦衆聖護身得福無量元始上帝告左右侍真曰吾念衆生在三毒十惡之中為諸魍魎精魅惡鬼邪神毒蟲猛獸刀兵水火杻械牢獄疾病苦痛凶禍纏繞不能自安吾固為汝演說三洞大法符籙寶經救護世間令得安樂為衆生愚癡不識罪福放縱六情或殺生偷盜邪淫放蕩慳貪瞋怒愚癡顚倒綺言妄語惡口兩舌啖食衆生違天犯地背正信邪檮祀鬼神衆罪縱橫而無片善致使毒風惡氣六天魔鬼遍滿人間流行殺伐日夜不停吾甚哀憫吾常遣諸天帝王十極神仙四司五帝按行救度咸使超悟不遇衆惡夙愆消蕩元始上帝再告左右天仙曰吾見凡夫從無量劫來沉淪罪苦造諸惡業殺生偷盜邪淫放蕩慳貪瞋怒愚癡顚倒惡口兩舌綺言妄語啖食群毛殺害生性違天逆地不信罪福業力深重不可稱量可於宫觀靈壇或在本家淨室建立三清寶座五帝星壇燒香散花朝禮天地懴悔上章乞消罪犯身宅清淨一切諸厄盡得消除獲福無量若有帝王國主后妃帝子天孫發無上心請道士法師為七世祖禰七代宗親亡過父母一切眷屬於正殿宫庭或清淨道室建置道場轉禮經懴燒香然燈懴悔行道散施財寶衣服卧具放生續命廣設齊醮勤心不退吾遣十天真人四司五帝十直靈官下降觀察身心不怠者使病者得差死者得活厄者得度禁者得脫行者得還仕者得遷水火刀兵虎狼毒獸邪精魍魎一切厄難永不干身年命長逺各得安寧若為亡過祖考心願出離九幽刀山劒樹鑊湯鞭撻楚痛之中上生天堂逍遙無為咸悟至道若為帝王后妃帝子人民土地一切衆生轉禮經懴救護群品見世安樂獲福無量若兵戈四起侵害兆民轉禮經懴即得退散無有損傷若疾疫時行人民卧疾轉禮經懴即得痊愈兆民安樂若水旱不調五榖妨害轉禮經懴即得風雨順調百榖滋茂若惡風毒氣飄灼火災燒失宅舍轉禮經懴即得天氣調和百物清潤若惡鬼毒蟲猛獸害人轉禮經懴悉皆迸退若婦人懷妊臨産不分轉禮經懴即得子母平安並無厄難若宫殿舍宇精邪鬼怪故氣不安轉禮經懴即得安靜永無怖懼元始上帝告左右侍真曰禮懴功德不可思議保國寧家和天安地上消天災下禳毒害其福難稱普度天人元始上帝再謂侍真曰吾為衆生廣作福田大建功德寫經造像置觀度人轉禮經懴修齊布施果報巍巍實為深厚何以故財者衆生性命切已難忘能捨命財心無吝惜廣建功德接濟孤貧內息慳貪外除劫賊人天利潤生死蒙恩救護之功獲福無量七祖先靈盡皆超度元始上帝告左右侍真曰吾與群仙下觀一切衆生命若蜉蝣之蟲朝生暮死甚可哀傷夫人死者五行數盡氣絶神逝髓竭骨枯形骸蕭索心怖神懼捨命之時受大苦惱內外六親圍繞左右男女悲泣死魂惶懼莫知去處身體虛冷氣息一絶生前所作惡業罪犯俱在目前若人前世積善天人扶衛魂超福境若人生平積業牛頭羅剎驅入地獄受諸苦惱當此之時英雄豪貴頓爾俱消髙車大馬何關人事莊宅金寶盡屬他人妻子眷屬豈能相代一切𡨚對俱在目前如影隨形莫可逃避若有善信男女大啓洪願為亡過父母一切宗親大醮天地拜表上章轉禮真經如暗得明如疾得藥如貧得寶如饑得食如囚得出如旱得雨洗滌罪障皆得清淨上生福堂出離五苦永得超度元始上帝再告左右侍真曰下界十方國土若有清信奉道男女或為地獄苦魂罪障惡鬼建三清寶座五帝靈壇燒香然燈百珍異果上章拜表大醮諸天為一切六畜群毛猪狗牛馬驢騾業畜懴謝惡業重罪者吾遣太乙救苦天尊開紫微上宫瓊簡紫籙寶函出天尊懿號傳度下方一切人民稱揚讃歎吟詠洞章思神念真乞削落九幽長夜之罪六畜之業使出度人天離苦解脫獲福無量咸得超度是故燒香歸身歸命五體投地
